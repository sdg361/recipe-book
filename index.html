:"garlic, minced"},{"q":1,"u":"tbsp","n":"ginger, minced or finely grated"},{"q":1.5,"u":"tsp","n":"ground cumin"},{"q":1.5,"u":"tsp","n":"garam masala"},{"q":1,"u":"tsp","n":"ground coriander"},{"q":400,"u":"g","n":"crushed tomatoes","note":"14 oz"},{"q":1,"u":"tsp","n":"red chili powder","note":"adjust to your taste preference"},{"q":1.25,"u":"tsp","n":"salt","note":"or to taste"},{"q":1,"u":"cup","n":"heavy or thickened cream","note":"or evaporated milk to save calories"},{"q":1,"u":"tbsp","n":"sugar"},{"q":0.5,"u":"tsp","n":"kasoori methi","note":"or dried fenugreek leaves"}]}],"steps":["In a bowl, combine chicken with all of the ingredients for the chicken marinade; let marinate for 30 minutes to an hour (or overnight if time allows).","Heat oil in a large skillet or pot over medium-high heat. When sizzling, add chicken pieces in batches of two or three, making sure not to crowd the pan. Fry until browned for only 3 minutes on each side. Set aside and keep warm. (You will finish cooking the chicken in the sauce.)","Heat butter or ghee in the same pan. Fry the onions until they start to sweat (about 6 minutes) while scraping up any browned bits stuck on the bottom of the pan.","Add garlic and ginger and sauté for 1 minute until fragrant, then add ground coriander, cumin and garam masala. Let cook for about 20 seconds until fragrant, while stirring occasionally.","Add crushed tomatoes, chili powder and salt. Let simmer for about 10–15 minutes, stirring occasionally until sauce thickens and becomes a deep brown red colour.","Remove from heat, scoop mixture into a blender and blend until smooth. You may need to add a couple tablespoons of water to help it blend (up to 1/4 cup). Work in batches depending on the size of your blender.","Pour the puréed sauce back into the pan. Stir the cream, sugar and crushed kasoori methi (or fenugreek leaves) through the sauce. Add the chicken with juices back into the pan and cook for an additional 8–10 minutes until chicken is cooked through and the sauce is thick and bubbling.","Garnish with chopped cilantro and serve with fresh, hot garlic butter rice and fresh homemade naan bread."],"notes":["Optional: to thin out the sauce, add a couple tablespoons of ghee or butter at the end of cooking, and gently simmer it through. Alternatively, add a small amount of water."]},"beef-vindaloo":{"title":"Beef Vindaloo","sub":"Restaurant-quality vindaloo that makes 3 meals for 2 people — ideal for cooking once and reheating later. It freezes and reheats beautifully, intensifying in flavor over time.","src":"Beef Vindaloo.docx","serves":6,"unit":"servings","groups":[{"n":"Beef & marinade","i":[{"q":1.2,"u":"kg","n":"beef chuck or gravy beef, cut into 3–4 cm cubes"},{"q":3,"u":"tbsp","n":"white vinegar"},{"q":4,"u":"cloves","n":"garlic, minced"},{"q":1,"u":"tbsp","n":"fresh ginger, minced"},{"q":2,"u":"tsp","n":"salt"},{"q":1,"u":"tbsp","n":"ground cumin"},{"q":1,"u":"tbsp","n":"ground coriander"},{"q":1,"u":"tsp","n":"turmeric"},{"q":2,"u":"tsp","n":"paprika","note":"or mild chili powder for color"},{"q":[1,2],"u":"tsp","n":"cayenne or Kashmiri chili","note":"adjust to heat preference"},{"q":1,"u":"tsp","n":"black pepper"},{"q":1,"u":"tsp","n":"garam masala"},{"q":1,"u":"tbsp","n":"tomato paste"}]},{"n":"For cooking","i":[{"q":2,"u":"tbsp","n":"ghee or vegetable oil"},{"q":2,"u":"medium","n":"onions, finely sliced"},{"q":2,"n":"tomatoes, chopped","note":"or 200 g canned crushed tomatoes"},{"q":1,"u":"cup","n":"beef stock or water","note":"add more as needed"},{"q":2,"n":"bay leaves"},{"q":1,"u":"medium","n":"potato, cubed","note":"optional, traditional Goan style"}]}],"steps":["Marinate (overnight if possible). Combine beef with all marinade ingredients in a bowl. Mix thoroughly, cover, and refrigerate at least 4 hours (best overnight).","Brown the beef. Heat ghee/oil in a heavy pot (Dutch oven preferred). Brown the marinated beef in batches until caramelized. Set aside.","Cook the onions. In the same pot, add more oil if needed. Sauté onions slowly on medium-low heat until golden brown (~10 min). This step develops the deep flavor typical of vindaloo.","Build the sauce. Add chopped tomatoes and bay leaves. Cook 3–4 min until soft. Return beef to the pot; stir to coat in the onion-tomato mixture. Pour in 1 cup of beef stock or water, scraping the bottom to release fond.","Simmer. Cover and simmer on low for 1½–2 hours, stirring occasionally, until beef is tender and sauce thick. If using potatoes, add them in the last 25 min. Adjust salt, chili, and vinegar to taste (should be tangy-spicy)."],"notes":["Serve with steamed basmati rice, naan, or roti + a side of cucumber raita or pickled onions.","Storage: divide into 3 airtight containers (2 portions each). Refrigerate up to 4 days or freeze up to 3 months.","Reheating: defrost overnight if frozen. Reheat on the stove with 2 tbsp water until gently bubbling (~8 min). The flavors deepen after resting 1–2 days — even better than fresh."]},"saag-paneer":{"title":"Saag Paneer","sub":"Smooth, earthy spinach curry with golden paneer cubes.","src":"Saag Paneer.docx","serves":3,"unit":"servings","groups":[{"n":"For the paneer","i":[{"q":250,"u":"g","n":"paneer, cut into 2 cm cubes"},{"q":1.5,"u":"tbsp","n":"oil or ghee"},{"n":"Salt – pinch"}]},{"n":"For the saag (spinach sauce)","i":[{"q":300,"u":"g","n":"spinach","note":"fresh baby spinach or frozen"},{"q":1,"u":"medium","n":"onion, finely chopped"},{"q":3,"u":"cloves","n":"garlic, minced"},{"q":1,"u":"tbsp","n":"ginger, minced"},{"q":1,"n":"green chili","note":"optional, adjust to taste"},{"q":1,"u":"small","n":"tomato, chopped"},{"q":0.5,"u":"tsp","n":"cumin seeds"},{"q":0.5,"u":"tsp","n":"garam masala"},{"q":0.25,"u":"tsp","n":"turmeric"},{"q":1,"u":"tsp","n":"coriander powder"},{"n":"Salt – to taste"},{"q":2,"u":"tbsp","n":"cream or yogurt","note":"for creaminess"},{"q":1,"u":"tbsp","n":"butter or ghee"}]}],"steps":["Blanch or wilt the spinach. Bring a pot of water to a boil, add the spinach, and cook for 1 min until just wilted. Drain and immediately rinse in cold water to keep the color. Blend the spinach with ¼ cup water into a smooth purée; set aside.","Brown the paneer. Heat 1½ tbsp oil in a non-stick pan. Add paneer cubes and fry until golden on most sides. Remove and set aside.","Cook the base. In the same pan, add butter/ghee and cumin seeds. Once they crackle, add onion and cook until soft and golden (about 5 min). Add garlic, ginger, and chili; sauté 30 sec. Stir in tomato, turmeric, coriander powder, garam masala, and salt. Cook until the tomato breaks down and the mixture thickens.","Combine and simmer. Add the spinach purée, mix well, and cook for 4–5 min on low heat. Add cream or yogurt, stir to combine. Add paneer cubes and simmer gently for another 3–4 min so flavors meld. Adjust salt and spice, and finish with a small knob of butter if you like a rich finish."],"notes":["Serve with basmati rice, naan, or roti — plus a squeeze of lemon or sprinkle of chili flakes for brightness."]},"mongolian-lamb":{"title":"Mongolian Lamb","sub":"RecipeTin Eats — sweet and savoury sauce with Chinese Five Spice and hoisin dominant. Also excellent with beef.","src":"Mongolian Lamb.pdf","transcribed":true,"serves":4.5,"unit":"servings","servesNote":"4–5","meta":[{"k":"Prep","v":"15 min"},{"k":"Cook","v":"10 min"},{"k":"Tenderise & marinate","v":"2 hrs"}],"groups":[{"n":"Lamb and marinade","i":[{"q":350,"u":"g","n":"lamb meat, thinly sliced 2–3 mm","note":"backstrap/fillet, mid loin chops, shoulder — boneless weight, fat trimmed"},{"q":0.5,"u":"tsp","n":"baking soda","note":"bicarb soda, tenderiser"},{"q":1,"u":"tsp","n":"cornflour / cornstarch"},{"q":1,"u":"tbsp","n":"light soy sauce","note":"or all purpose"},{"q":1,"u":"tbsp","n":"Chinese cooking wine"}]},{"n":"Sauce","i":[{"q":3,"u":"tsp","n":"cornflour / cornstarch"},{"q":2,"u":"tsp","n":"dark soy sauce"},{"q":1,"u":"tsp","n":"light soy sauce","note":"or all purpose"},{"q":1.5,"u":"tsp","n":"Sambal Oelek or other chilli paste","note":"or omit for no spice"},{"q":3,"u":"tbsp","n":"hoisin sauce","note":"Lee Kum Kee brand"},{"q":2,"u":"tbsp","n":"Chinese cooking wine"},{"q":0.25,"u":"tsp","n":"Chinese five spice powder"},{"q":185,"u":"ml","n":"water"},{"q":1,"u":"tsp","n":"sesame oil, toasted"}]},{"n":"Stir fry","i":[{"q":2,"u":"tbsp","n":"vegetable oil","note":"or canola or peanut"},{"q":1,"u":"large","n":"onion, cut into large 2.5 cm / 1\" squares"},{"q":2,"u":"cloves","n":"garlic, finely chopped"},{"q":4,"n":"green onions, cut into 5 cm / 2\" lengths"}]}],"steps":[{"h":"Tenderise lamb"},"Combine lamb and marinade ingredients, mix very well. Cover and refrigerate to marinate and tenderise the lamb.","Marinate 2 hours — backstrap, midloin chops and other listed tender cuts.","Marinate 24 hours — lamb shoulder and other listed economical cuts. (Bare minimum marinade time is 6 hrs.)",{"h":"Cooking"},"Sauce: mix cornflour with the soy sauces, then mix in the remaining sauce ingredients.","Cook onion: heat oil over high heat in a wok or heavy based skillet. Add onions, and stir fry for 30 seconds until starting to colour. Add garlic and toss through quickly.","Cook lamb: add lamb and cook for 3 minutes until most of it changes from red to brown, and some pieces start getting nice golden brown surfaces.","Add sauce: add green onions, stir for 30 seconds (meat should all now be brown), then add sauce. Stir and let simmer for 1–2 minutes until thickened.","Serve with rice."],"notes":["Lamb — any cut you want; ensure you factor in bone and fat to be trimmed, you need 350 g/12 oz of meat. The more economical the cut, the longer we tenderise, then it's as tender as expensive cuts.","Tender cuts (2 hour marinade): backstrap / fillet / loin; midloin chops (you need 700 g/1.4 lb); chump chop and lamb rump; cutlets.","Economical cuts (24 hour marinade): lamb shoulder; leg (steak or roast); forequarter chops and neck.","Beef version: excellent made with beef. 2 hour marinade — rump, flank, sirloin/strip/Porterhouse, t-bone and scotch fillet/boneless rib eye."]},"black-pepper-short-ribs":{"title":"黑椒牛仔骨 — Black Pepper Beef Short Ribs","sub":"Tender beef with a flavorful black pepper sauce.","src":"Black Pepper Beef Short Ribs.docx","serves":3,"unit":"servings","groups":[{"n":"Main","i":[{"q":700,"u":"g","n":"beef short ribs, cut into pieces"},{"q":1,"u":"small","n":"onion, thinly sliced"},{"q":0.5,"n":"bell pepper, cut into strips","note":"optional"},{"q":2,"u":"cloves","n":"garlic, minced"},{"q":1,"u":"tbsp","n":"fresh ginger, minced"},{"q":1,"u":"tbsp","n":"vegetable oil"}]},{"n":"Marinade","i":[{"q":1,"u":"tbsp","n":"soy sauce"},{"q":1,"u":"tbsp","n":"oyster sauce"},{"q":0.5,"u":"tbsp","n":"Shaoxing wine","note":"or any cooking wine"},{"q":0.5,"u":"tsp","n":"sugar"},{"q":0.25,"u":"tsp","n":"salt"},{"q":0.25,"u":"tsp","n":"black pepper"},{"q":0.5,"u":"tbsp","n":"cornstarch","note":"for coating"}]},{"n":"Sauce","i":[{"q":1,"u":"tbsp","n":"soy sauce"},{"q":1,"u":"tbsp","n":"oyster sauce"},{"q":0.5,"u":"tbsp","n":"Worcestershire sauce"},{"q":[0.5,1],"u":"tbsp","n":"coarse ground black pepper","note":"adjust to taste"},{"q":0.5,"u":"tsp","n":"sugar"},{"q":0.25,"u":"cup","n":"water"},{"q":0.5,"u":"tbsp","n":"cornstarch mixed with 1 tbsp water","note":"slurry for thickening"}]}],"steps":["Marinate the ribs. In a mixing bowl, combine soy sauce, oyster sauce, Shaoxing wine, sugar, salt, and black pepper for the marinade. Add the beef short ribs and toss well to coat. Marinate for at least 20–30 minutes (or up to 1 hour if you have time). After marinating, toss the ribs with cornstarch to coat lightly.","Prepare the sauce. In a small bowl, combine soy sauce, oyster sauce, Worcestershire sauce, black pepper, sugar, and water. Mix well and set aside.","Cook the ribs. Heat the vegetable oil in a large pan or wok over medium-high heat. Add the beef ribs and sear until browned on all sides, about 4–5 minutes. Remove the ribs and set aside.","Sauté aromatics and vegetables. In the same pan, add a little more oil if needed, then add garlic, ginger, and onion. Sauté until fragrant and the onion is softened. Add bell pepper strips if using, and stir-fry for another 1–2 minutes.","Combine and simmer. Return the ribs to the pan and pour in the sauce mixture. Stir well to coat everything. Bring the mixture to a simmer, cover, and cook for 10–15 minutes, or until the ribs are tender.","Thicken the sauce. Add the cornstarch slurry to the pan, stirring to thicken the sauce. Let cook for another 1–2 minutes until the sauce is glossy and coats the ribs well.","Serve hot with steamed rice and garnish with extra black pepper if desired."]},"beef-onion-veggies":{"title":"Beef & Onion with Veggies","src":"Rezepte.xlsx — Beef & Onion with Veggies","serves":2,"unit":"servings","groups":[{"i":[{"q":300,"u":"g","n":"beef, thinly sliced"},{"q":2,"n":"onion"},{"q":0.25,"u":"cup","n":"rice cooking wine"},{"q":2,"u":"tbsp","n":"light soy sauce"},{"q":3,"n":"carrots"},{"q":2,"u":"bunches","n":"broccolini"},{"q":2,"u":"cups","n":"long grain rice"}]}],"steps":["First of all, start the rice cooker — cook the rice with the appropriate amount of water.","Slice the onions into half rings. Heat a big frying pan to medium heat. Add the onions with a drizzle of olive oil. Cook the onion briefly.","In the meantime, bring a pot of water (about half filled) to the boil. Add the beef slices. As soon as the water is back to the boil, cook for 3 minutes. Use a strainer to transfer the beef to the frying pan with the onions.","Add the soy sauce and the rice cooking wine to the frying pan. Turn heat to medium-high, fry everything for a couple of minutes. Then add about 2 cups of water to the frying pan.","Put a lid on the pan and simmer for 10–15 minutes, or until all the water has evaporated.","In the meantime, cut the broccolini in 3 cm pieces and the carrot in 0.5–1 cm pieces. Bring a pot of water to the boil (about half filled). Add the vegetables with a pinch of salt. As soon as back to the boil, cook for about 3 minutes. Strain the vegetables.","Serve everything on two plates."]},"thai-curry":{"title":"Thai-Curry","lang":"de","src":"Thai-Curry.xls","serves":4.5,"unit":"Personen","servesNote":"4–5","groups":[{"n":"Marinade","i":[{"q":2,"u":"Essl.","n":"Maizena"},{"q":1,"u":"Essl.","n":"Oel"},{"q":3,"u":"Essl.","n":"Weisswein"},{"q":2,"u":"Essl.","n":"Currypaste","note":"z.B. Migros Thai Kitchen — Yellow Curry Paste, Glas à 225 g"},{"n":"Salz, Season all"},{"q":700,"u":"g","n":"Poulet-Geschnetzeltes"}]},{"n":"Sauce","i":[{"q":1,"u":"Essl.","n":"Oel"},{"q":2,"u":"Essl.","n":"Currypaste"},{"q":3,"u":"dl","n":"Kokosmilch"}]},{"n":"Gemüse (ca. 600 g)","i":[{"q":2,"u":"grosse","n":"Zwiebeln, in Spalten"},{"q":1,"u":"rote","n":"Peperoni, in Streifen"},{"q":1,"n":"Rüebli, fein geschnitten"},{"q":150,"u":"g","n":"Bohnen, grüne, halbiert"},{"q":150,"u":"g","n":"Champignons, geviertelt"},{"q":1,"u":"Stück","n":"Ingwer","note":"nach Belieben"}]}],"steps":["Maizena, Oel, Weisswein und Currypaste vermischen, mit Salz und Season all würzen.","Poulet-Geschnetzeltes dazugeben, gut vermischen, zugedeckt 1–2 Std. marinieren lassen.","Oel in einer hohen Bratpfanne erhitzen. Currypaste andünsten.","Mit Kokosmilch ablöschen, aufköcheln.","Gemüse in die Kokosmilch geben, köcheln lassen.","Mariniertes Fleisch in einer Bratpfanne portionenweise anbraten, zum Gemüse geben, evtl. nachwürzen.","Thai-Curry solange köcheln lassen, bis das Gemüse gar ist."],"notes":["Dazu passt Jasmin- oder Basmati-Reis.","Total ca. 1/2 Glas Curry-Paste."]},"pork-larb":{"title":"Larb (Pork or Chicken)","sub":"Thai minced-meat salad — sour, salty, spicy, herby. Genuinely better made ahead. Works hot or at room temp over rice.","src":"Pork Larb.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":600,"u":"grams","n":"pork mince","note":"or chicken mince"},{"q":2,"u":"tablespoons","n":"jasmine rice, for toasting"},{"q":3,"u":"tablespoons","n":"fish sauce"},{"q":2,"n":"limes, juiced"},{"q":1,"u":"teaspoon","n":"sugar"},{"q":1,"u":"teaspoon","n":"Thai roasted chili flakes"},{"q":4,"n":"shallots, thinly sliced"},{"q":4,"n":"spring onions, sliced"},{"q":20,"u":"grams","n":"mint leaves"},{"q":15,"u":"grams","n":"coriander, chopped"},{"q":1,"u":"tablespoon","n":"neutral oil"},{"q":300,"u":"grams","n":"jasmine rice, to serve"}]}],"steps":["Cook the rice: cook 300 grams jasmine rice by your usual method and keep warm.","Toast rice powder: in a dry pan over medium heat, toast 2 tablespoons jasmine rice until deep golden, shaking often, about 5 minutes. Cool, then grind to a coarse powder in a mortar or spice grinder. This is what gives larb its texture — don't skip it.","Brown the mince: heat 1 tablespoon neutral oil in a wok or wide pan over high heat. Add the pork mince and break it up well, frying until cooked through and lightly browned, 8–10 minutes. Add a splash of water if it catches.","Season off the heat: take the pan off the heat. Stir through the fish sauce, lime juice, sugar and Thai roasted chili flakes. Taste — it should land sour, salty, then spicy. Adjust.","Fold in the herbs: fold through the shallots, spring onions, most of the mint and coriander, and the toasted rice powder. Serve over the jasmine rice with the rest of the herbs scattered on top."],"notes":["Rice and rice powder are naturally GF, so the carb base is covered. For batching, hold back a little of the herbs and rice powder to add fresh on reheat so it doesn't go flat."]},"chinese-meatballs":{"title":"茄汁肉球 — Chinese Meatballs in Tomato Sauce","sub":"Juicy meatballs with a tangy tomato sauce.","src":"Chinese Meatballs and Tomato Sauce.docx","serves":3,"unit":"servings","groups":[{"n":"For the meatballs","i":[{"q":300,"u":"g","n":"ground pork","note":"or a mix of pork and beef if you prefer"},{"q":1,"n":"egg"},{"q":2,"u":"tablespoons","n":"bread crumbs or cornstarch","note":"for binding"},{"q":1,"u":"tablespoon","n":"soy sauce"},{"q":1,"u":"tablespoon","n":"Shaoxing wine","note":"optional, for extra flavor"},{"q":0.5,"u":"teaspoon","n":"salt"},{"q":0.5,"u":"teaspoon","n":"white pepper"},{"q":0.5,"u":"teaspoon","n":"ginger, finely grated"}]},{"n":"For the tomato sauce","i":[{"q":2,"u":"large","n":"tomatoes, diced","note":"or 1 cup canned tomato sauce"},{"q":2,"u":"tablespoons","n":"ketchup","note":"for sweetness and color"},{"q":1,"u":"tablespoon","n":"soy sauce"},{"q":0.5,"u":"tablespoon","n":"sugar"},{"n":"Salt to taste"},{"n":"Water, as needed"},{"q":1,"u":"tablespoon","n":"cooking oil"}]}],"steps":["Prepare the meatballs. In a mixing bowl, combine the ground pork, egg, breadcrumbs or cornstarch, soy sauce, Shaoxing wine (if using), salt, white pepper, and ginger. Mix thoroughly until everything is well combined. The mixture should be slightly sticky. Wet your hands to prevent sticking, then form the mixture into small balls (about 1 inch in diameter). Heat a frying pan with some oil over medium heat. Add the meatballs and pan-fry until golden brown on all sides. Remove them and set aside.","Make the tomato sauce. In the same pan, add a bit more oil if needed and sauté the diced tomatoes until they soften and break down, about 3–5 minutes. Add ketchup, soy sauce, sugar, and salt. Stir well. Add a bit of water to thin the sauce if it's too thick, and let it simmer for a few minutes until the flavors blend.","Combine and simmer. Return the cooked meatballs to the pan with the tomato sauce. Simmer for 5–10 minutes on low heat, allowing the meatballs to soak up the sauce. Adjust the seasoning with salt or a pinch of sugar if needed.","Serve. Once the meatballs are fully cooked and the sauce has thickened, transfer to a serving plate. Garnish with chopped green onions if desired and serve hot with rice or noodles."]},"steamed-tofu-shrimp":{"title":"蒸豆腐虾仁 — Steamed Tofu with Shrimp","sub":"A light, flavorful dish that highlights the delicate flavors of tofu and shrimp.","src":"Steamed Tofu with Shrimp.docx","serves":2,"unit":"servings","groups":[{"i":[{"q":1,"u":"block","n":"soft or silken tofu"},{"q":[8,10],"n":"medium shrimp","note":"peeled and deveined"},{"q":[1,2],"n":"green onions","note":"chopped for garnish"},{"q":1,"u":"small piece","n":"ginger, thinly sliced"},{"q":1,"u":"tablespoon","n":"soy sauce"},{"q":1,"u":"tablespoon","n":"cooking wine","note":"optional, for marinating the shrimp"},{"q":0.5,"u":"teaspoon","n":"sesame oil","note":"optional"},{"n":"Salt and white pepper to taste"}]}],"steps":["Prepare the shrimp. Rinse the shrimp and pat dry. Optional: marinate the shrimp with a little cooking wine and a pinch of salt for 10 minutes.","Prepare the tofu. Cut the tofu block into bite-sized cubes or slices and arrange them on a heatproof plate that fits in your steamer. Sprinkle a little salt on the tofu and top each piece with a slice of ginger.","Add the shrimp. Place one shrimp on top of each tofu piece.","Steam. Set up a steamer or use a large pot with a steaming rack. Place the plate of tofu and shrimp into the steamer and cover. Steam for 6–8 minutes, or until the shrimp are cooked through and pink.","Season. Remove the plate from the steamer. Drizzle soy sauce and sesame oil over the tofu and shrimp. Sprinkle chopped green onions on top as garnish.","Serve hot as an appetizer or main dish with rice."]},"braised-pork-belly-potato":{"title":"铁岭红烧五花肉炖土豆 — Tieling-Style Braised Pork Belly with Potatoes","src":"Braised Pork Belly with Potatos.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":600,"u":"g","n":"pork belly, cut into 3–4 cm chunks"},{"q":3,"u":"medium","n":"potatoes, peeled and cut into large chunks"},{"q":[4,5],"u":"slices","n":"ginger"},{"q":4,"u":"cloves","n":"garlic, smashed"},{"q":2,"n":"scallions, cut into 5 cm pieces"},{"q":[2,3],"n":"dried chili peppers","note":"optional, for a little heat"},{"q":2,"n":"star anise"},{"q":[1,2],"n":"bay leaf"},{"q":1,"u":"tbsp","n":"dark soy sauce","note":"for color"},{"q":3,"u":"tbsp","n":"light soy sauce"},{"q":3,"u":"tbsp","n":"Shaoxing wine"},{"q":1,"u":"tbsp","n":"rock sugar","note":"or white sugar"},{"n":"Salt – to taste"},{"n":"White pepper – a pinch"},{"n":"Water – enough to cover"},{"n":"Sesame oil – a few drops (optional)"},{"n":"Fresh coriander – for garnish (optional)"}]}],"steps":["Render the pork belly. Place pork belly pieces in a pot of cold water, bring to a boil, and blanch 2–3 minutes to remove impurities. Drain and rinse.","Caramelize sugar (东北 style). Heat a wok or heavy pot over medium heat. Add a little oil, then the sugar. Stir until it melts into a caramel and turns amber. Add pork belly, stir-fry until the pieces are coated and slightly browned.","Aromatics. Add ginger, garlic, scallion, star anise, bay leaf, and dried chili. Stir-fry until fragrant. Splash in the Shaoxing wine to deglaze.","Season. Add light soy, dark soy, and enough hot water to just cover the pork. Bring to a boil, then reduce to a gentle simmer.","Braise. Cover and simmer for about 45 minutes, stirring occasionally. Add water if needed so it doesn't dry out.","Add potatoes. After 45 minutes, add the potato chunks. Simmer another 25–30 minutes, until the pork is tender and the potatoes are soft but not falling apart. Taste and adjust seasoning with salt and white pepper.","Finish. Reduce liquid if needed until it becomes glossy and coats the pork and potatoes. Add a few drops of sesame oil for fragrance.","Serve. Garnish with coriander or sliced scallions."],"notes":["Best eaten with plain steamed rice or with 东北大拉皮 (wide mung bean noodles) on the side."]},"sauteed-broccolini":{"title":"Sautéed Broccolini","src":"Rezepte.xlsx — Sautéed Broccolini","serves":2,"unit":"sides","groups":[{"i":[{"q":2,"u":"bunches","n":"broccolini"},{"q":2,"u":"cloves","n":"garlic"},{"q":2,"u":"tbsp","n":"olive oil"},{"n":"Pinch of salt"}]}],"steps":["Bring a pot of water to the boil. In the meanwhile, wash the broccolini, remove the leaves and cut off the bottom third of the stem. If a stem is very thick, slice it in half. Peel the garlic cloves and chop into small pieces.","Add the broccolini into the pot of water as soon as it's boiling. It will stop boiling — from the moment it starts boiling again, count 2 minutes. After 2 minutes, strain broccolini. Add them to a bowl of cold water to stop the cooking process.","Pre-heat a pan to medium heat with ~2 tbsp of olive oil. Add garlic and fry for a minute or two. Add broccolini and fry for another 2–3 minutes, or until properly heated through. Season with a pinch of salt and serve while still hot (cools quickly once it's off the stove)."]},"roasted-mexican-zucchini":{"title":"Roasted Mexican Zucchini","sub":"Bowl of Delicious — a low-carb side to any Mexican dish, jam-packed with flavor similar to Mexican street corn.","src":"Roasted Mexican Zucchini.pdf","serves":4,"unit":"servings","meta":[{"k":"Prep","v":"5 min"},{"k":"Cook","v":"25 min"}],"groups":[{"i":[{"q":[3,4],"u":"medium","n":"zucchini, diced"},{"q":2,"u":"tbsp","n":"extra-virgin olive oil"},{"q":0.5,"u":"tsp","n":"chili powder"},{"q":0.5,"u":"tsp","n":"garlic powder"},{"q":0.125,"u":"tsp","n":"cayenne pepper"},{"n":"Kosher salt to taste"},{"n":"Black pepper to taste"},{"q":4,"u":"oz.","n":"cotija cheese, crumbled"},{"q":1,"n":"lime, juiced"},{"q":2,"u":"tbsp","n":"fresh cilantro, chopped"}]}],"steps":["Preheat oven to 425 degrees F and line a rimmed baking sheet with parchment paper.","In a medium bowl, mix the diced zucchini, olive oil, chili powder, garlic powder, cayenne pepper, and salt/pepper until well coated.","Spread evenly on baking sheet and roast for 25 minutes, or until zucchini is browned.","Serve sprinkled with lime juice, cotija cheese, and chopped fresh cilantro."],"notes":["Other ingredients and veggies, such as corn, chickpeas, summer squash, etc. can be added by roasting with the zucchini.","Make it vegan: omit the cotija cheese or substitute with a vegan-friendly alternative."]},"kartoffel-gratin":{"title":"Kartoffel-Gratin dauphinois","lang":"de","src":"Kartoffel-Gratin dauphinois.xls","serves":4,"unit":"Pers.","groups":[{"i":[{"q":3,"u":"dl","n":"Milch"},{"q":3,"u":"dl","n":"Rahm"},{"q":1.5,"u":"Teel.","n":"Salz (gestrichen)"},{"n":"Pfeffer, Muskat"},{"q":1,"n":"Knobli, gepresst"},{"q":720,"u":"g","n":"mehlige Kartoffeln","note":"Gewicht ohne Schale"},{"n":"Butterflöckli"}]}],"steps":["Gratinform einfetten.","Milch, Rahm, Salz, Pfeffer, Muskat und gepressten Knobli alles in eine Gratinform geben und mit einem Schwingbesen verrühren.","Mehlige Kartoffeln mit einem feinen Hobel in die Flüssigkeit hobeln.","Gratin ca. 30 Min. stehen lassen, mit einer Folie zudecken.","Vor dem Backen Folie entfernen, Butterflöckli auf dem Gratin verteilen.","Backen: 1 Std. 10 Min. auf der 2. untersten Rille bei 180 °C.","Gratin vor dem Servieren ca. 5 Min. ruhen lassen."],"notes":["Original gibt auch Mengen für 6 Personen an: 5 dl Milch, 5 dl Rahm, 2 Teel. Salz, 1–2 Knobli, 1200 g mehlige Kartoffeln."]},"black-rice-halloumi":{"title":"Black Rice & Halloumi Salad","sub":"A fresh, balanced grain salad with salty halloumi, herbs, and bright lemon. Perfect as a light main or a side dish.","src":"Black Rice and Halloumi Salad.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"u":"bag","n":"microwave black rice","note":"about 250 g cooked"},{"q":1,"u":"block","n":"halloumi","note":"about 200–225 g"},{"q":1,"u":"cup","n":"cherry tomatoes, halved"},{"q":0.5,"n":"cucumber, finely diced"},{"q":0.25,"u":"small","n":"red onion, very finely sliced"},{"q":0.5,"u":"cup","n":"flat-leaf parsley, finely chopped"},{"q":0.25,"u":"cup","n":"fresh mint, finely chopped"},{"q":1,"n":"lemon, juiced","note":"to taste"},{"q":[3,4],"u":"tbsp","n":"extra-virgin olive oil"},{"n":"Salt, to taste"},{"n":"Freshly cracked black pepper, to taste"}]}],"steps":["Prepare the black rice according to the packet instructions. Once cooked, spread it out on a plate or tray and allow it to cool to room temperature.","Slice the halloumi into 1 cm thick slices. Heat a non-stick pan over medium heat and cook the halloumi until golden brown on both sides. Remove and cut into bite-sized pieces.","In a large bowl, combine the cooled black rice, cherry tomatoes, cucumber, and red onion.","Add the chopped parsley and mint, mixing gently to distribute evenly.","Add the halloumi to the bowl.","Drizzle over the olive oil and lemon juice. Season with salt and freshly cracked black pepper.","Toss gently to combine. Taste and adjust lemon, salt, or pepper as needed. Serve at room temperature."],"notes":["Letting the rice cool before mixing prevents the herbs from wilting.","Keep the dressing simple to let the nutty rice and salty halloumi shine.","This salad keeps well for several hours; add halloumi just before serving for best texture."]},"lentil-salad":{"title":"Black Lentil Salad","src":"Lentil Salad.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"u":"cup","n":"black lentils (Beluga lentils), rinsed"},{"q":3,"u":"cups","n":"water or broth"},{"q":1,"n":"bay leaf","note":"optional"},{"q":1,"u":"small","n":"red onion, finely chopped"},{"q":1,"u":"small","n":"cucumber, diced"},{"q":1,"n":"bell pepper (any color), diced"},{"q":1,"u":"cup","n":"cherry tomatoes, halved"},{"q":0.25,"u":"cup","n":"fresh parsley or mint, chopped"},{"q":0.25,"u":"cup","n":"crumbled feta cheese","note":"optional"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"red wine vinegar or lemon juice"},{"q":1,"u":"tsp","n":"Dijon mustard"},{"n":"Salt and pepper, to taste"}]}],"steps":["Cook the lentils. Place lentils, water (or broth), and bay leaf in a saucepan. Bring to a boil, then reduce heat and simmer uncovered for 20–25 minutes, until tender but still holding their shape. Drain, rinse under cold water, remove bay leaf, and allow to cool.","Prepare the dressing. In a small bowl or jar, whisk together olive oil, vinegar (or lemon juice), Dijon mustard, salt, and pepper.","Assemble the salad. In a large bowl, combine cooled lentils, red onion, cucumber, bell pepper, cherry tomatoes, and herbs.","Dress and finish. Pour dressing over the salad and toss gently to combine. Add feta if using and mix lightly.","Serve. Let the salad rest for 10–15 minutes before serving to allow the flavors to develop. Serve chilled or at room temperature."]},"quinoa-salad-asian":{"title":"Asian-Inspired Sesame–Ginger Quinoa Salad","src":"Quinoa Salad.docx — Option 1","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"u":"cup","n":"white quinoa, rinsed","note":"cook in water or light vegetable stock, then cool"},{"q":1,"u":"cup","n":"edamame","note":"thawed if frozen"},{"q":1,"n":"Lebanese cucumber, deseeded and diced"},{"q":1,"n":"carrot, julienned or grated"},{"q":2,"n":"spring onions, finely sliced"},{"n":"Large handful coriander, roughly chopped"},{"q":2,"u":"tbsp","n":"light soy sauce"},{"q":1.5,"u":"tbsp","n":"rice vinegar"},{"q":1,"u":"tbsp","n":"sesame oil"},{"q":1,"u":"tbsp","n":"neutral oil","note":"grapeseed or canola"},{"q":[1,1.5],"u":"tsp","n":"freshly grated ginger"},{"q":1,"u":"small clove","n":"garlic, finely grated"},{"q":1,"u":"tsp","n":"honey or sugar"},{"q":0.5,"n":"lime, juiced"},{"q":[1,2],"u":"tbsp","n":"toasted sesame seeds"},{"n":"Optional: chilli oil or chilli crisp to taste"}]}],"steps":["Cook quinoa according to instructions. Fluff with a fork and allow to cool completely.","In a large bowl, combine quinoa, edamame, cucumber, carrot, spring onion, and coriander.","Whisk soy sauce, rice vinegar, sesame oil, neutral oil, ginger, garlic, honey, and lime juice.","Pour dressing over salad and toss gently to combine.","Finish with toasted sesame seeds and optional chilli oil before serving."]},"quinoa-salad-mixed":{"title":"Mixed Quinoa Salad","src":"Quinoa Salad.docx — Option 2","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"u":"cup","n":"quinoa, rinsed","note":"cook as per instructions; use chicken broth or add a pinch of salt"},{"q":1,"u":"small can","n":"corn, drained"},{"q":0.25,"n":"red pepper, diced"},{"q":0.25,"n":"green pepper, diced"},{"q":0.25,"n":"yellow pepper, diced"},{"q":1,"n":"spicy pepper (jalapeño or chilli), finely chopped"},{"q":1,"u":"small can","n":"black beans, rinsed and drained"},{"n":"Salt, pepper, and cumin to taste"},{"n":"A squeeze of lemon or lime juice"}]}],"steps":["Cook quinoa according to packet instructions and allow to cool slightly.","Combine quinoa, corn, peppers, spicy pepper, and black beans in a bowl.","Season with salt, pepper, and cumin.","Finish with a squeeze of lemon or lime juice and mix well before serving."]},"pork-dumpling-filling":{"title":"Pork Dumpling Filling","sub":"Enough for probably around 50 dumplings at least.","src":"Pork Dumpling Filling.docx","serves":50,"unit":"dumplings","groups":[{"n":"Filling","i":[{"q":4,"n":"baby bok choy"},{"q":500,"u":"g","n":"minced pork"},{"q":2,"n":"spring onions"},{"q":4,"u":"tablespoons","n":"soy sauce"},{"q":2,"u":"tablespoons","n":"sesame oil"},{"q":1,"u":"teaspoon","n":"salt"},{"q":1,"u":"pinch","n":"pepper"}]},{"n":"Dumpling dip sauce","i":[{"q":3,"u":"tablespoons","n":"soy sauce"},{"q":1,"u":"tablespoon","n":"Chinese black vinegar"},{"q":1,"u":"tablespoon","n":"sesame oil"},{"q":1,"u":"tablespoon","n":"dried chopped chili"}]}],"steps":["Boil bok choy for 5 minutes. Drain them properly and chop them. Add to bowl.","Chop spring onions, add to bowl.","Add all the rest. Mix well.","Dip sauce: mix all ingredients in a bowl."]},"egg-chive-dumplings":{"title":"Egg & Chive Dumplings","src":"Egg & Chive Dumplings.docx","serves":36,"unit":"dumplings","groups":[{"i":[{"q":5,"u":"bunches","n":"chives"},{"q":5,"n":"eggs"},{"n":"Salt and a bit of pepper"},{"n":"Dough — same as Egg & Chive Pies (650 g of flour can make around 60 dumplings)"}]}],"steps":["Dough — same as Egg & Chive Pies. 650 g of flour can make around 60 dumplings.","5 bunches of chives and 5 eggs will make around 36 dumplings.","Only season with salt and a bit of pepper."]},"egg-chive-pies":{"title":"Egg & Chive Pies","sub":"Makes c. 15 pies.","src":"Egg  & Chive Pies.xlsx","serves":15,"unit":"pies","groups":[{"n":"Dough","i":[{"q":450,"u":"g","n":"high gluten wheat flour"},{"q":2,"u":"cups","n":"water"},{"q":1,"u":"piece","n":"baby bok choy","note":"only for green dough"}]},{"n":"Filling","i":[{"q":6,"u":"bundles","n":"chives"},{"q":5,"u":"pieces","n":"eggs"},{"q":1,"u":"nest","n":"transparent noodles"}]},{"n":"Seasoning","i":[{"q":1,"u":"pinch","n":"pepper (black, white or Sezuan)"},{"q":2,"u":"teaspoon","n":"sesame oil"},{"q":1,"u":"pinch","n":"salt"}]}],"steps":[{"h":"Making the dough"},"Mix flour and water, knead for c. 10 mins. Let it rest in a bowl with cover for c. 1 h.","To make green dough: boil one baby bok choy for c. 5 mins. Add to blending cup with right amount of cold water less c. ¼ cup. Blend together. Then add the green water blend to the flour to make the dough.",{"h":"Preparation"},"Wash chives and cut into c. 1 cm pieces.","Stir-fry eggs with canola oil. Cut in small pieces.","Soak transparent noodles in cold water until soft and cut in c. 1 cm pieces.",{"h":"Mix and season the filling"},"Coat the chives with sesame oil.","Then add egg and transparent noodles.","Add the other seasoning.",{"h":"Make the pies"},"Shape the dough into a long shape (tip: make a doughnut out of the dough ball, then cut it open).","Work on a surface with flour on it. Cut pieces as in the picture.","Shape each little piece into a ball and flatten on the flour coated surface. Then use a rolling pin to make it flat and round.","Place some of the mixture on the dough.","Pull all sides of the dough together to one point. Then twist the loose ends and tear off the tip.","Flatten the pie by placing it on the surface and pressing softly on it with the hand.","While making pies, the ones that are done can e.g. be stored on a flour coated plate.","Heat a frying pan with some canola oil (however not too much). Add 4–5 pies, as many as can fit.","Fry slowly on low heat. Flip over once the bottom side is firm and golden brown. They're done when they're nice golden brown on both sides.","Serve with dumpling sauce for dipping."]},"egg-chive-pies-shrimp":{"title":"Egg & Chive Pies with Shrimp","sub":"Makes c. 15 pies. The shrimp variant of the pies above.","src":"Egg & Chive Pies.xlsx","serves":15,"unit":"pies","groups":[{"n":"Dough","i":[{"q":450,"u":"g","n":"high gluten wheat flour"},{"q":2,"u":"cups","n":"water"},{"q":1,"u":"piece","n":"baby bok choy","note":"only for green dough"}]},{"n":"Filling","i":[{"q":3,"u":"bundles","n":"chives"},{"q":5,"u":"pieces","n":"eggs"},{"q":1,"u":"nest","n":"transparent noodles"},{"q":15,"u":"pieces","n":"frozen shrimps"}]},{"n":"Seasoning","i":[{"q":1,"u":"pinch","n":"pepper (black, white or Sezuan)"},{"q":2,"u":"teaspoon","n":"sesame oil"},{"q":1,"u":"teaspoon","n":"oyster sauce"},{"q":1,"u":"tablespoon","n":"soy sauce"},{"q":1,"u":"pinch","n":"dry shrimp"}]}],"steps":[{"h":"Making the dough"},"Mix flour and water, knead for c. 10 mins. Let it rest in a bowl with cover for c. 1 h.","To make green dough: boil one baby bok choy for c. 5 mins. Add to blending cup with right amount of cold water less c. ¼ cup. Blend together. Then add the green water blend to the flour to make the dough.",{"h":"Preparation"},"Unfreeze the shrimps.","Wash chives and cut into c. 1 cm pieces.","Stir-fry eggs with canola oil. Cut in small pieces.","Soak transparent noodles in cold water until soft and cut in c. 1 cm pieces.",{"h":"Mix and season the filling"},"Coat the chives with sesame oil.","Then add egg and transparent noodles.","Add the other seasoning.",{"h":"Make the pies"},"Shape the dough into a long shape (tip: make a doughnut out of the dough ball, then cut it open).","Work on a surface with flour on it. Cut pieces as in the picture.","Shape each little piece into a ball and flatten on the flour coated surface. Then use a rolling pin to make it flat and round.","Place some of the mixture on the dough and add one shrimp for each pie.","Pull all sides of the dough together to one point. Then twist the loose ends and tear off the tip.","Flatten the pie by placing it on the surface and pressing softly on it with the hand.","While making pies, the ones that are done can e.g. be stored on a flour coated plate.","Heat a frying pan with some canola oil (however not too much). Add 4–5 pies, as many as can fit.","Fry slowly on low heat. Flip over once the bottom side is firm and golden brown. They're done when they're nice golden brown on both sides.","Serve with dumpling sauce for dipping."]},"cha-siu-bao":{"title":"Steamed BBQ Pork Buns (Char Siu Bao)","sub":"The Woks of Life — the secret to the perfect steamed pork bun just like at the dim sum restaurant.","src":"Cha Shao Bao.pdf","transcribed":true,"serves":10,"unit":"buns","meta":[{"k":"Prep","v":"3 hrs"},{"k":"Cook","v":"30 min"}],"groups":[{"n":"For the steamed cha siu bao dough","i":[{"q":1,"u":"teaspoon","n":"active dry yeast"},{"q":0.75,"u":"cup","n":"warm water"},{"q":2,"u":"cups","n":"all-purpose flour"},{"q":1,"u":"cup","n":"cornstarch"},{"q":5,"u":"tablespoons","n":"sugar"},{"q":0.25,"u":"cup","n":"canola or vegetable oil"},{"q":2.5,"u":"teaspoons","n":"baking powder"}]},{"n":"For the steamed bao filling","i":[{"q":1,"u":"tablespoon","n":"oil"},{"q":0.333,"u":"cup","n":"shallots or red onion","note":"finely chopped"},{"q":1,"u":"tablespoon","n":"sugar"},{"q":1,"u":"tablespoon","n":"light soy sauce"},{"q":1.5,"u":"tablespoons","n":"oyster sauce"},{"q":2,"u":"teaspoons","n":"sesame oil"},{"q":2,"u":"teaspoons","n":"dark soy sauce"},{"q":0.5,"u":"cup","n":"chicken stock"},{"q":2,"u":"tablespoons","n":"all purpose flour"},{"q":1.5,"u":"cups","n":"diced Chinese roast pork","note":"you can buy it ready-made"}]}],"steps":["In the bowl of an electric mixer fitted with a dough hook attachment (you can also just use a regular mixing bowl and knead by hand), dissolve the yeast in the warm water. Sift together the flour and cornstarch, and add it to the yeast mixture along with the sugar and oil. Turn on the mixer to the lowest setting and let it go until a smooth dough ball is formed. Cover with a damp cloth and let it rest for 2 hours. (Don't forget the baking powder — you'll add that later.)","While the dough is resting, make the meat filling. Heat the oil in a wok over medium high heat. Add the onion and stir-fry for a minute. Turn heat down to medium-low, and add the sugar, soy sauce, oyster sauce, sesame oil, and dark soy. Stir and cook until the mixture starts to bubble up. Add the chicken stock and flour, cooking for a couple minutes until thickened. Remove from the heat and stir in the roast pork. Set aside to cool. If you make the filling ahead of time, cover and refrigerate to prevent it from drying out.","After your dough has rested for 2 hours, add the baking powder to the dough and turn the mixer on to the lowest setting. At this point, if the dough looks dry or you're having trouble incorporating the baking powder, add 1–2 teaspoons water. Gently knead the dough until it becomes smooth again. Cover with a damp cloth and let it rest for another 15 minutes. In the meantime, get a large piece of parchment paper and cut it into ten 4×4 inch squares. Prepare your steamer by bringing the water to a boil.","Now we are ready to assemble the buns: roll the dough into a long tube and divide it into 10 equal pieces. Press each piece of dough into a disc about 4½ inches in diameter (it should be thicker in the center and thinner around the edges). Add some filling and pleat the buns until they're closed on top.","Place each bun on a parchment paper square, and steam. Steam the buns in two separate batches using a bamboo steamer (be sure the boiling water does not touch the buns during the steaming process). Once the water boils, place the buns in the steamer and steam each batch for 12 minutes over high heat."]},"gua-bao":{"title":"Gua Bao","sub":"Nicky's Kitchen Sanctuary — fluffy bao buns stuffed with tender sticky pork belly.","src":"Gua Bao.pdf","serves":10,"unit":"bao buns","meta":[{"k":"Prep","v":"30 min"},{"k":"Cook","v":"3 hrs"},{"k":"Proving","v":"2 hrs 30 min"}],"groups":[{"n":"Steamed buns","i":[{"q":450,"u":"g","n":"plain (all purpose) flour","note":"3¾ cups"},{"q":2,"u":"tbsp","n":"caster sugar"},{"q":0.5,"u":"tsp","n":"salt"},{"q":7,"u":"g","n":"instant dried yeast","note":"2 tsp / one packet"},{"q":3,"u":"tbsp","n":"whole milk"},{"q":210,"u":"ml","n":"warm water","note":"¾ cup + 2 tbsp"},{"q":3,"u":"tbsp","n":"unsalted butter, very soft"},{"q":1,"u":"tbsp","n":"olive oil"}]},{"n":"Slow cooked pork belly","i":[{"q":1,"u":"kg","n":"rindless pork belly slices, chopped in half","note":"each piece approx. the length of your index finger"},{"q":1,"u":"litre","n":"hot chicken/veg stock"},{"q":1,"u":"tbsp","n":"minced ginger"},{"q":3,"u":"cloves","n":"garlic, peeled and chopped in half"},{"q":1,"u":"tbsp","n":"rice wine"},{"q":1,"u":"tbsp","n":"caster sugar"}]},{"n":"Pork belly glaze","i":[{"q":2,"u":"tbsp","n":"vegetable oil"},{"q":1,"u":"pinch","n":"salt and pepper"},{"q":1,"u":"tbsp","n":"minced ginger"},{"q":1,"n":"red chilli, finely chopped"},{"q":2,"u":"tbsp","n":"honey"},{"q":2,"u":"tbsp","n":"brown sugar"},{"q":3,"u":"tbsp","n":"dark soy sauce"},{"q":1,"u":"tsp","n":"lemon grass paste"}]},{"n":"Toppings","i":[{"q":1,"u":"small bunch","n":"coriander (cilantro), roughly torn"},{"q":2,"n":"red chillies, sliced into thin strips"},{"q":4,"n":"spring onions (scallions), sliced into thin strips"},{"q":1,"u":"tbsp","n":"sesame seeds"},{"q":2,"u":"tbsp","n":"toasted cashew nuts, chopped"}]}],"steps":["Start by making the bao buns.","Place the flour, sugar, salt and yeast in a bowl and mix together.","Add the milk, warm water and butter to a jug and stir together until the butter melts. Stir the liquid mixture into the flour mixture at first with a spoon, and then with your hands. Turn out onto a floured surface and knead for 10 minutes. Alternatively, you can do this in a mixer fitted with a dough hook.","Place the dough in an oiled bowl. Cover (with clingfilm or a damp tea towel) and leave to prove until doubled in size — about 90 minutes to 2 hours.","Meanwhile, start on the pork belly. Add all the slow cooked pork belly ingredients to a pan (not the glaze ingredients). Bring to the boil, then place a lid on, turn down the heat and simmer for 2 hours. Then turn off the heat and drain the pork. You can reserve the liquid if you like (perfect for a Thai or Chinese noodle soup).","After the dough has proved, tip it out of the bowl onto a floured surface. Knead the dough again and split into 10 balls. Place a piece of baking parchment on your work surface and roll each ball into an oval on top of the parchment, using a rolling pin — approx. 12 cm × 8 cm.","Brush the ovals with the olive oil and fold each oval over, using a chopstick in the middle to fold over to leave a little space in the fold (so the oil is on the inside of the fold). Remove the chopstick.","Prepare two oven trays by lining each with a piece of baking parchment. Place the buns on the trays — still on the baking parchment — as this will help you to move them later. Cover each tray with clingfilm or a carrier bag and leave to prove for a further hour, until puffed up.","Put a large steamer pan on to boil. Working in batches, place the buns in the steamer (you can keep them on the baking parchment) and steam for 15 minutes.","Whilst the bao buns are steaming, you can continue to cook the pork belly. Chop the pork into bite sized chunks. Add 1 tbsp of the oil to a frying pan, and then mix the remaining glaze ingredients in a small bowl.","Heat the oil and add in the pork, salt and pepper, frying on a high heat until the pork starts to turn golden. Now pour the glaze over the pork and continue to cook until the pork looks dark and sticky — about 6–7 minutes. Turn off the heat and transfer to a warm bowl until you're ready to assemble the gua bao.","Once the buns are cooked, open them up and stuff them with sticky pork belly, coriander (cilantro), slices of red chillies, and strips of spring onions. Sprinkle on sesame seeds and chopped cashews."],"notes":["You can make the pork belly up to the end of step 5 (slow cooked and drained), then quickly cool, cover and refrigerate (up to two days) or freeze. Defrost in the refrigerator overnight before slicing and frying as per step 11.","You can make the buns ahead: cool, cover and refrigerate up to 2 days. Allow to come to room temperature before reheating — microwave 20–30 seconds each bun, or steam for 5 minutes.","Freezing: make the buns, cool, cover and freeze. Reheat from frozen by placing in the steamer for 10 minutes, until hot throughout."]},"gf-bbq-buns":{"title":"Gluten Free BBQ Buns","src":"Gluten Free BBQ Buns.docx","serves":1,"unit":"batch","groups":[{"n":"Dough","i":[{"q":200,"u":"g","n":"sweet potato, mashed"},{"q":160,"u":"g","n":"tapioca starch"},{"q":240,"u":"g","n":"rice flour"},{"q":10,"u":"g","n":"dry yeast"},{"q":20,"u":"g","n":"sugar"}]},{"n":"Filling","i":[{"q":600,"u":"g","n":"boneless pork belly, chopped into small pieces"},{"q":20,"u":"g","n":"ginger, minced"},{"q":200,"u":"g","n":"spring onion, finely sliced"},{"q":2,"u":"Tbs","n":"Shao Xing wine"},{"q":2,"u":"Tbs","n":"light soy sauce"},{"q":0.5,"u":"Tbs","n":"dark soy sauce"},{"q":2,"u":"Tbs","n":"sweet bean paste"}]}],"steps":[{"h":"Dough"},"Add 60 g tapioca starch and 60 g of water to a bowl. Mix well and put aside.","Add 100 g of mashed sweet potato and 180 g of water to another bowl. Mix well.","Strain through a mesh strainer into a small pot. Use a spoon to press the mash through the strainer. The result should be a thick liquid without lumps.","Put the pot on high heat until the sweet potato liquid is boiling. Then turn off the heat.","Pour in the tapioca starch mixture slowly while stirring, trying to avoid lumps forming.","Stir well until you have a uniform, sticky mass in the pot. Put it aside to let it cool down.","Mix another 100 g of sweet potato mash and 20 g of sugar in a separate bowl.","Mix the sweet potato and sugar mixture with the sticky mass in the pot. Transfer to a bowl.","In a separate bowl, mix 240 g rice flour and 100 g tapioca starch and 10 g yeast.","After it's well mixed, pour half of it into the bowl with the sticky mass. Knead it into a dough. Add the second half after you've kneaded in a considerable amount of the first portion of flour.","Knead into a dough until the surface is smooth. Then cover and let it rest for at least an hour to rise.","After resting it, use a rolling pin to flatten the dough into a square. Fold it back in on itself and repeat the procedure.","Then shape it into a long dough sausage and cut pieces off to shape the buns.",{"h":"Filling"},"Fry the pork belly in a frying pan.","Once it's all turned white, add the ginger and fry for a minute.","Add 1/3 of the spring onion and fry for a minute.","Add the sauces and stir while continuing to fry.","Add the rest of the spring onion and fry for a minute.","Put aside and cover."]},"gf-dumpling-wrappers":{"title":"Gluten-Free Dumpling Wrappers","sub":"Snixy Kitchen — with just gluten-free flours and water, these pliable wrappers can be used to make gluten-free potstickers or gyoza.","src":"Gluten-Free Dumpling Wrappers.pdf","serves":39,"unit":"wrappers","servesNote":"36–42","meta":[{"k":"Prep","v":"1 hour"}],"groups":[{"i":[{"q":150,"u":"g","n":"chickpea flour","note":"about 1¼ cups"},{"q":125,"u":"g","n":"tapioca starch","note":"about ¾ cup + 3.5 tbsp"},{"q":125,"u":"g","n":"sweet rice flour","note":"about ½ cup + 3.5 tbsp — different from white or brown rice flour"},{"q":1.25,"u":"teaspoon","n":"xanthan gum","note":"or sub 6 tbsp ground white or black chia seeds, and add 2–3 tbsp more water"},{"q":1,"u":"cup + 1 tbsp","n":"warm water","note":"110–115 °F"}]}],"steps":["Prepare your dumpling filling first if you plan to fill and pleat immediately, and set it aside while you make your wrappers. Cooking the veggies in the filling softens any sharp edges that may tear the wrappers.","Make the wrappers: when your water temperature is 120 °F, whisk together all the dry ingredients in a medium bowl. Pour in the warm water and mix together with a fork until it forms a shaggy dough.","Using your hands, gather the dough together and knead until it forms a ball. Remove the dough from the bowl and knead it for 2–3 minutes until it forms a smooth ball. If you find the dough too sticky, dust the surface with a bit of tapioca starch while kneading. Humidity can make a difference and you may find you need another tablespoon of water to make your dough more pliable, or a tablespoon of tapioca starch if it feels too sticky. Your dough should be firm but pliable, almost like playdough.","Place the dough in the mixing bowl and cover with a damp kitchen or paper towel while you prepare your dumpling station. The towel keeps the dough from drying out.","Fill a small bowl with water and another with tapioca starch. Have a damp paper towel ready to cover the wrappers so they don't dry out. Keep a rolling pin and bench scraper nearby. Have a spoon or small cookie scoop ready for the filling. Place a baking sheet nearby for the finished dumplings, with another damp paper towel. Have a kitchen scale ready for dividing the dough.","Pull off 15–16 g balls of dough (about 1.25 tablespoons), keeping the rest of the dough covered in the bowl with the damp paper towel.","Lightly dust your work surface with tapioca starch. Take out a ball of dough and using the palm of your hand, flatten the dough into a disc, about 2 inches in diameter. If the outside of the ball feels dry, massage it with your fingers to soften a bit, adding a dot of water if needed. It should be smooth and pliable and not at all crumbly.","Dust the dough disc lightly with tapioca starch on both sides and place it onto the dusted surface.","Use your rolling pin to roll the disc into a very thin circle about 3.75–4 inches in diameter, turning and flipping as you go to keep it from sticking, dusting with more tapioca starch if needed. Use a round cutter, mug, or glass to cut the thin dough into perfect 3¼–3½-inch rounds. Save the scraps, set the wrapper aside under another damp towel, and repeat with 2 more balls of dough. After rolling out three wrappers, gather up the scraps, dab with a drop of water and roll into another ball, then repeat.","Repeat until you've made all your dumpling wrappers, keeping the rolled wrappers under a damp paper towel while you work.","To fill: dip the ¼-inch edge of the wrapper in water about 2/3 of the way around (or run a wet index finger along the edge of the upper half). Lay the wrapper in the palm of your hand, scoop about 1 tablespoon of filling into the centre, and pleat using the \"V\" shape pleating method, pinching the dough together tightly as you go. Treat the gluten-free dough very carefully — don't stretch the dough for each pleat, simply fold and press.","Place the finished dumpling upright on the baking sheet and cover with the damp towel."],"notes":["If storing wrappers in the fridge or freezer for later use, even just for a few hours, very lightly dust them with tapioca starch before stacking to keep them from sticking."]},"goan-fish-curry":{"title":"Goan Fish Curry","sub":"Xitti kodi — the everyday Goan curry: a red coconut-tamarind masala, sour and warm rather than fiery.","src":"Provided by Sandro, 9 August 2026","serves":4,"unit":"servings","groups":[{"n":"Fish","i":[{"q":700,"u":"g","n":"firm white fish (kingfish, snapper or barramundi), cut into thick steaks or 6 cm pieces"},{"q":0.5,"u":"tsp","n":"ground turmeric","note":"for the fish"},{"q":1.5,"u":"tsp","n":"fine salt","note":"half for the fish, half for the curry"}]},{"n":"Masala paste","i":[{"q":10,"n":"dried Kashmiri chillies, stems removed"},{"q":100,"u":"g","n":"fresh grated coconut","note":"or desiccated, soaked in warm water"},{"q":2,"u":"tsp","n":"coriander seeds"},{"q":1,"u":"tsp","n":"cumin seeds"},{"q":0.5,"u":"tsp","n":"black peppercorns"},{"q":0.5,"u":"tsp","n":"ground turmeric","note":"for the masala"},{"q":6,"u":"cloves","n":"garlic"},{"q":1,"u":"thumb-sized piece","n":"ginger, peeled"},{"q":1,"u":"tbsp","n":"tamarind paste"},{"q":1,"u":"tbsp","n":"coconut vinegar or white vinegar"}]},{"n":"Curry","i":[{"q":2,"u":"tbsp","n":"coconut oil"},{"q":1,"n":"brown onion, finely sliced"},{"q":2,"n":"green chillies, slit lengthways"},{"q":250,"u":"ml","n":"water"},{"q":200,"u":"ml","n":"coconut milk"},{"q":1,"n":"tomato, cut into wedges"},{"q":4,"n":"okra, topped and tailed","note":"optional but traditional"}]}],"steps":[{"h":"Salt the fish"},"Rub the fish with the 1/2 tsp turmeric and half of the salt. Set aside in the fridge while you make the masala — this seasons the flesh and firms it slightly so it holds together in the curry.",{"h":"Soak the chillies"},"Cover the dried Kashmiri chillies with hot water and leave to soften. Meanwhile dry-toast the coriander seeds, cumin seeds and peppercorns in a pan over medium heat until fragrant and just starting to colour — 30 seconds or so, no more.",{"h":"Grind the masala"},"Drain the chillies, keeping a little soaking water. Blend them with the toasted spices, coconut, turmeric, garlic, ginger, tamarind paste and vinegar into a smooth, deep red paste. Add soaking water a spoon at a time. Blend for longer than feels necessary — any grit from the coconut or coriander will stay in the finished curry.",{"h":"Soften the onion"},"Heat the coconut oil in a wide pan and cook the onion with the green chillies over medium heat until soft and translucent. You don't want deep browning here — this curry stays bright, not caramelised.",{"h":"Fry the masala"},"Add the masala paste and fry, stirring, until it darkens and you see oil separating at the edges. This step is not optional — raw masala tastes flat and slightly dusty, and the difference is enormous.",{"h":"Build the curry"},"Pour in the water, bring to a simmer and add the tomato wedges and okra if using. Simmer gently to let the flavours come together, then stir in the coconut milk and the remaining salt. Taste — it should be sour first, then warm. Add a splash more vinegar or tamarind if it tastes flat.",{"h":"Poach the fish"},"Slide the fish into the simmering curry in a single layer. Do not stir — tilt and shake the pan instead, or the fish will break up. Cook at a bare simmer until just opaque through. Take off the heat and let it sit for 10 minutes before serving with rice; the fish finishes cooking in the residual heat and the curry settles."],"notes":["The masala paste is the whole dish, and it freezes well — make a double or triple batch and portion it into an ice cube tray. Two cubes plus coconut milk and you have dinner in 15 minutes.","Kashmiri chillies are for colour, not heat. If you only have hot dried chillies, use 3–4 and add a teaspoon of sweet paprika for the red.","Coconut vinegar is the authentic sourness and worth seeking out at an Indian grocer, but cider vinegar is a closer substitute than white if that's what you have.","This genuinely improves overnight — the fish firms up and the masala settles. Reheat gently without boiling.","Prawns work just as well; add them for the last 3 minutes only."]}},"built":"2026-08-03"}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('BOOK').textContent);
var MENU = DATA.menu, R = DATA.recipes;

/* ---------- flatten menu ---------- */
var DISHES = [];
function addItems(sectionName, groupName, items){
  items.forEach(function(it){
    DISHES.push({t:it.t, c:it.c||'', r:it.r||[], sub:it.sub||[], x:!!it.x,
                 section:sectionName, group:groupName||''});
  });
}
MENU.sections.forEach(function(s){
  if(s.items) addItems(s.name, '', s.items);
  (s.groups||[]).forEach(function(g){ addItems(s.name, g.name, g.items); });
});
var SECTION_ORDER = MENU.sections.map(function(s){return s.name;});
var CUISINES = [];
DISHES.forEach(function(d){ if(d.c && CUISINES.indexOf(d.c)<0) CUISINES.push(d.c); });
CUISINES.sort();

var nRecipes = Object.keys(R).length;
var nWith = DISHES.filter(function(d){return d.r.length;}).length;
document.getElementById('count').textContent =
  DISHES.length + ' dishes · ' + nWith + ' with recipes · ' + nRecipes + ' recipe pages';
document.getElementById('foot').textContent =
  'Built ' + DATA.built + ' from AA_Menu.xlsx and the recipe files in “01. Favourite Recipes”. ' +
  'Dishes without a linked recipe are on the menu but have no recipe file (simple to cook, or in a physical cookbook).';

/* ---------- number formatting ---------- */
var FRACS=[[0.125,'⅛'],[0.25,'¼'],[1/3,'⅓'],[0.375,'⅜'],[0.5,'½'],[0.625,'⅝'],[2/3,'⅔'],[0.75,'¾'],[0.875,'⅞']];
function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '';
  if(n===0) return '0';
  var neg = n<0; n = Math.abs(n);
  var out;
  if(n>=50){ out = String(Math.round(n)); }
  else if(n>=10){ var h=Math.round(n*2)/2; out = (h%1===0)? String(h) : String(h); }
  else {
    var whole = Math.floor(n + 1e-9), frac = n - whole, best=null, bd=1;
    if(frac < 0.02) out = String(whole);
    else{
      for(var i=0;i<FRACS.length;i++){ var d=Math.abs(frac-FRACS[i][0]); if(d<bd){bd=d;best=FRACS[i][1];} }
      if(bd <= 0.042) out = (whole? whole+' ':'') + best;
      else out = String(Math.round(n*100)/100);
    }
  }
  return (neg?'-':'') + out;
}
function scaleQ(q, f){
  if(q===null||q===undefined) return null;
  if(Array.isArray(q)) return [q[0]*f, q[1]*f];
  return q*f;
}
function fmtQ(q){
  if(q===null||q===undefined) return '';
  if(Array.isArray(q)) return fmtNum(q[0]) + '–' + fmtNum(q[1]);
  return fmtNum(q);
}

/* ---------- search index ---------- */
function recipeText(id){
  var r = R[id]; if(!r) return '';
  var t = [r.title, r.sub||'', r.src||''];
  (r.groups||[]).forEach(function(g){
    if(g.n) t.push(g.n);
    (g.i||[]).forEach(function(i){ t.push(i.n||''); t.push(i.note||''); });
  });
  return t.join(' ');
}
DISHES.forEach(function(d){
  d._s = (d.t + ' ' + d.c + ' ' + d.section + ' ' + d.group + ' ' +
          d.sub.join(' ') + ' ' + d.r.map(recipeText).join(' ')).toLowerCase();
});

/* ---------- state ---------- */
var state = { q:'', cuisine:null, view:'course' };

/* ---------- chips ---------- */
var chipsEl = document.getElementById('chips');
function renderChips(){
  chipsEl.innerHTML = '';
  var all = document.createElement('button');
  all.className = 'chip clear'; all.textContent = 'All cuisines';
  all.setAttribute('aria-pressed', state.cuisine===null);
  all.onclick = function(){ state.cuisine=null; renderChips(); render(); };
  chipsEl.appendChild(all);
  CUISINES.forEach(function(c){
    var b=document.createElement('button'); b.className='chip'; b.textContent=c;
    b.setAttribute('aria-pressed', state.cuisine===c);
    b.onclick=function(){ state.cuisine = (state.cuisine===c? null : c); renderChips(); render(); };
    chipsEl.appendChild(b);
  });
}

/* ---------- list rendering ---------- */
function match(d){
  if(state.cuisine && d.c !== state.cuisine) return false;
  if(state.q && d._s.indexOf(state.q) < 0) return false;
  if(state.view==='recipes' && !d.r.length) return false;
  return true;
}
function dishNode(d){
  var li=document.createElement('li');
  var b=document.createElement('button');
  b.className='dish' + (d.r.length? ' has':'');
  var txt=document.createElement('div'); txt.className='txt';
  var nm=document.createElement('div'); nm.className='name'; nm.textContent=d.t;
  if(d.x){ var xm=document.createElement('span'); xm.className='xmark'; xm.textContent='X';
           xm.title='Marked with an X in your AA_Menu spreadsheet'; nm.appendChild(xm); }
  txt.appendChild(nm);
  var cui=document.createElement('div'); cui.className='cui';
  cui.textContent = d.c + (state.view==='region' ? ' · ' + d.section : '');
  txt.appendChild(cui);
  if(d.sub.length){
    var ul=document.createElement('ul'); ul.className='variants';
    d.sub.forEach(function(s){ var l=document.createElement('li'); l.textContent=s; ul.appendChild(l); });
    txt.appendChild(ul);
  }
  b.appendChild(txt);
  var rc=document.createElement('span'); rc.className='rc';
  if(d.r.length===1){ rc.textContent='Recipe →'; }
  else if(d.r.length>1){ rc.textContent = d.r.length + ' recipes →'; }
  else { rc.className='rc none'; rc.textContent='no recipe'; }
  b.appendChild(rc);
  if(d.r.length){
    b.onclick=function(){
      if(d.r.length===1) openRecipe(d.r[0]);
      else openChoice(d);
    };
  }
  li.appendChild(b);
  return li;
}
function render(){
  var host=document.getElementById('list');
  host.innerHTML='';
  var shown = DISHES.filter(match);
  if(!shown.length){
    host.innerHTML='<p class="empty">Nothing matches that.</p>'; return;
  }
  var buckets = {}, order = [];
  shown.forEach(function(d){
    var key = (state.view==='region') ? d.c : d.section;
    if(!buckets[key]){ buckets[key]=[]; order.push(key); }
    buckets[key].push(d);
  });
  if(state.view==='region') order.sort();
  else order.sort(function(a,b){ return SECTION_ORDER.indexOf(a)-SECTION_ORDER.indexOf(b); });

  order.forEach(function(key){
    var sec=document.createElement('section'); sec.className='grp';
    var h=document.createElement('h2'); h.textContent=key; sec.appendChild(h);
    var lastGroup=null, ul=null;
    buckets[key].forEach(function(d){
      var gname = (state.view==='region') ? '' : d.group;
      if(gname !== lastGroup){
        lastGroup = gname;
        if(gname){ var h3=document.createElement('h3'); h3.className='sub'; h3.textContent=gname; sec.appendChild(h3); }
        ul=document.createElement('ul'); ul.className='dishes'; sec.appendChild(ul);
      }
      if(!ul){ ul=document.createElement('ul'); ul.className='dishes'; sec.appendChild(ul); }
      ul.appendChild(dishNode(d));
    });
    host.appendChild(sec);
  });
}

/* ---------- recipe rendering ---------- */
var current=null, servings=null;

function openChoice(d){
  var host=document.getElementById('recipe');
  host.innerHTML='';
  host.appendChild(backBtn());
  var h=document.createElement('div'); h.className='rhead';
  h.innerHTML='<h2>'+esc(d.t)+'</h2><p class="rsub">This menu line has more than one recipe. Pick one:</p>';
  host.appendChild(h);
  var ul=document.createElement('ul'); ul.className='dishes';
  d.r.forEach(function(id){
    var li=document.createElement('li');
    var b=document.createElement('button'); b.className='dish has';
    var t=document.createElement('div'); t.className='txt';
    t.innerHTML='<div class="name">'+esc(R[id].title)+'</div>'+
      (R[id].sub? '<div class="cui">'+esc(R[id].sub)+'</div>':'');
    b.appendChild(t);
    var rc=document.createElement('span'); rc.className='rc'; rc.textContent='Open →'; b.appendChild(rc);
    b.onclick=function(){ openRecipe(id); };
    li.appendChild(b); ul.appendChild(li);
  });
  host.appendChild(ul);
  document.body.classList.add('rv');
  window.scrollTo(0,0);
}
function backBtn(){
  var b=document.createElement('button'); b.className='back'; b.textContent='← Back to the menu';
  b.onclick=closeRecipe; return b;
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function openRecipe(id){
  current = id;
  var r = R[id];
  servings = r.serves || null;
  paint();
  document.body.classList.add('rv');
  window.scrollTo(0,0);
  try{ location.hash = 'r/' + id; }catch(e){}
}
function closeRecipe(){
  document.body.classList.remove('rv');
  current=null;
  try{ location.hash=''; }catch(e){}
  window.scrollTo(0,0);
}
function paint(){
  var r = R[current];
  var f = (r.serves && servings) ? (servings / r.serves) : 1;
  var host=document.getElementById('recipe');
  host.innerHTML='';
  host.appendChild(backBtn());

  var head=document.createElement('div'); head.className='rhead';
  head.innerHTML = '<h2>'+esc(r.title)+'</h2>' + (r.sub? '<p class="rsub">'+esc(r.sub)+'</p>':'');
  host.appendChild(head);

  var meta=document.createElement('div'); meta.className='rmeta';
  var bits=[];
  if(r.serves) bits.push('<span>Base recipe <b>'+ (r.servesNote||fmtNum(r.serves)) +' '+esc(r.unit||'servings')+'</b></span>');
  (r.meta||[]).forEach(function(m){ bits.push('<span>'+esc(m.k)+' <b>'+esc(m.v)+'</b></span>'); });
  if(r.lang==='de') bits.push('<span>Language <b>German (original)</b></span>');
  if(r.lang==='it') bits.push('<span>Language <b>Italian (original)</b></span>');
  meta.innerHTML = bits.join('');
  if(bits.length) host.appendChild(meta);

  if(r.transcribed){
    var fl=document.createElement('div'); fl.className='flag';
    fl.textContent='Transcribed from a photo or scanned PDF — quantities and wording were typed out by hand from the image. Worth checking against the original file before you cook it the first time.';
    host.appendChild(fl);
  }

  if(r.serves){
    var sc=document.createElement('div'); sc.className='scaler';
    sc.innerHTML =
      '<span class="lab">Scale to</span>'+
      '<span class="stepper"><button id="mn" aria-label="Fewer">−</button>'+
      '<span class="val" id="sv"></span>'+
      '<button id="pl" aria-label="More">+</button></span>'+
      '<span class="unit">'+esc(r.unit||'servings')+'</span>'+
      '<button class="reset" id="hf">\u00bd\u00d7</button>'+
      '<button class="reset" id="db">2\u00d7</button>'+
      '<span class="factor" id="fx"></span>'+
      '<button class="reset" id="rs">Reset</button>';
    host.appendChild(sc);
    var shortNote = r.servesNote && /^[0-9\u00bc\u00bd\u00be\u2153\u2154\u2013\u2014 .-]+$/.test(r.servesNote);
    sc.querySelector('#sv').textContent =
      (Math.abs(f-1)<0.001 && shortNote) ? r.servesNote : fmtNum(servings);
    sc.querySelector('#fx').textContent = (Math.abs(f-1)<0.001? '' : '× '+fmtNum(f)+' of the original');
    sc.querySelector('#mn').onclick=function(){ step(-1); };
    sc.querySelector('#pl').onclick=function(){ step(1); };
    sc.querySelector('#rs').onclick=function(){ servings=r.serves; paint(); };
    sc.querySelector('#hf').onclick=function(){ mult(0.5); };
    sc.querySelector('#db').onclick=function(){ mult(2); };
  }

  var cols=document.createElement('div'); cols.className='cols';

  var left=document.createElement('div');
  left.innerHTML='<h4 class="blk">Ingredients</h4>';
  (r.groups||[]).forEach(function(g){
    var box=document.createElement('div'); box.className='ig';
    if(g.n){ var gn=document.createElement('div'); gn.className='gn'; gn.textContent=g.n; box.appendChild(gn); }
    var ul=document.createElement('ul'); ul.className='ings';
    (g.i||[]).forEach(function(ing){
      var li=document.createElement('li');
      var q = ing.fix ? ing.q : scaleQ(ing.q, f);
      var qs = fmtQ(q);
      if(qs){
        var sp=document.createElement('span'); sp.className='q';
        sp.textContent = qs + (ing.u? ' '+ing.u : '');
        li.appendChild(sp);
        li.appendChild(document.createTextNode(' '));
      }
      var nm=document.createElement('span'); nm.className='n';
      nm.textContent = ing.n || '';
      if(ing.note){ var nt=document.createElement('span'); nt.className='nt'; nt.textContent=' — '+ing.note; nm.appendChild(nt); }
      li.appendChild(nm);
      ul.appendChild(li);
    });
    box.appendChild(ul); left.appendChild(box);
  });
  cols.appendChild(left);

  var right=document.createElement('div');
  right.innerHTML='<h4 class="blk">Method</h4>';
  var ol=document.createElement('ol'); ol.className='steps';
  (r.steps||[]).forEach(function(s){
    var li=document.createElement('li');
    if(typeof s === 'object' && s.h){ li.className='h'; li.textContent=s.h; }
    else { li.className='s'; li.textContent=s; }
    ol.appendChild(li);
  });
  right.appendChild(ol);
  if(r.notes && r.notes.length){
    var nh=document.createElement('h4'); nh.className='blk'; nh.textContent='Notes'; right.appendChild(nh);
    var nl=document.createElement('ul'); nl.className='notes';
    r.notes.forEach(function(n){ var li=document.createElement('li'); li.textContent=n; nl.appendChild(li); });
    right.appendChild(nl);
  }
  cols.appendChild(right);
  host.appendChild(cols);

  var src=document.createElement('div'); src.className='src';
  src.textContent='Source file: ' + (r.src||'—');
  host.appendChild(src);
}
function step(dir){
  var s = servings;
  if(s < 1){ s = Math.round((s + dir*0.5)*2)/2; }
  else if(s % 1 !== 0){ s = dir > 0 ? Math.ceil(s) : Math.floor(s); }
  else { s = s + dir; }
  servings = Math.max(0.5, s);
  paint();
}
function mult(m){
  var s = servings * m;
  if(s >= 2) s = Math.round(s);
  else s = Math.round(s*2)/2;
  servings = Math.max(0.5, s);
  paint();
}

/* ---------- wiring ---------- */
document.getElementById('q').addEventListener('input', function(e){
  state.q = e.target.value.trim().toLowerCase(); render();
});
function setView(v){
  state.view=v;
  document.getElementById('vCourse').setAttribute('aria-pressed', v==='course');
  document.getElementById('vRegion').setAttribute('aria-pressed', v==='region');
  document.getElementById('vRecipes').setAttribute('aria-pressed', v==='recipes');
  render();
}
document.getElementById('vCourse').onclick=function(){setView('course');};
document.getElementById('vRegion').onclick=function(){setView('region');};
document.getElementById('vRecipes').onclick=function(){setView('recipes');};
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.body.classList.contains('rv')) closeRecipe();
});

renderChips(); render();
var h = (location.hash||'').replace(/^#/,'');
if(h.indexOf('r/')===0 && R[h.slice(2)]) openRecipe(h.slice(2));
})();
</script>
</body>
