 high — you want it very hot and lightly smoking before the octopus goes on.","Brush the grill with a little oil to stop sticking. Lay the marinated tentacles directly on the hottest part of the grill.","Char hard for 2–3 minutes per side, turning once, until you get deep grill marks and crisped, blistered edges. It's already fully cooked from the poach, so this step is about colour, char and smoky flavour, not cooking through — don't linger or it will toughen up again.","Move to a board and rest for a minute or two before slicing into portions, if not already cut.",{"h":"6. Dress and plate"},"Whisk the remaining 4 tbsp olive oil with the remaining lemon juice and the lemon zest.","Toss half the dressing through the salad base and plate it. Top with the hot charred octopus and drizzle over the remaining dressing. Serve immediately."],"notes":["Low and slow is the whole game with whole octopus — rushing the poach is the most common cause of rubbery results, not the searing step.","No cork needed despite the old kitchen myth — tenderness comes from the gentle simmer and rest, not anything added to the water.","Swap the rocket base for sliced boiled potatoes, olive oil, smoked paprika and flaky salt for a Galician-style (pulpo a la gallega) version.","Leftover poached octopus keeps well in the fridge for 2–3 days — poach ahead and just sear when ready to eat.","A pressure cooker will cut the poaching time to roughly 15–20 minutes at high pressure if you're short on time."]},"prawn-rolls":{"title":"Prawn Rolls","src":"Prawn Rolls.docx","serves":5.5,"unit":"servings","servesNote":"5–6","groups":[{"n":"Prawn salad","i":[{"q":700,"u":"g","n":"raw prawns, peeled and deveined"},{"q":[1,2],"u":"tbsp","n":"neutral oil","note":"for the wok"},{"n":"Salt, pepper, and a pinch of smoked paprika (for seasoning the prawns)"},{"q":0.25,"u":"cup + 1 tsp","n":"good mayonnaise"},{"q":1.5,"u":"tbsp","n":"lemon juice, plus zest of 3/4 lemon"},{"q":[1,2],"u":"stalks","n":"celery, finely diced","note":"for crunch"},{"q":3,"u":"tbsp","n":"chives, finely chopped"},{"q":1.5,"u":"tsp","n":"Dijon mustard"},{"n":"Pinch of Old Bay seasoning or smoked paprika (optional)"},{"n":"Salt and pepper to taste"}]},{"n":"Rolls","i":[{"q":6,"n":"top-split hot dog buns","note":"brioche if available"},{"q":3,"u":"tbsp","n":"butter, softened"}]}],"steps":["Pat the raw prawns dry and season with salt, pepper, and a pinch of paprika.","Heat the oil in a wok over high heat. Fry the prawns in batches for 2–3 minutes, until pink and just cooked through — don't overcrowd the wok. Remove and cool to room temperature.","Once cooled, roughly chop the prawns, leaving some pieces chunky.","In a bowl, mix the mayonnaise, lemon juice, zest, mustard, and seasoning.","Fold in the chopped prawns, celery, and chives. Toss gently — you want the prawns coated, not mashed. Chill for 20–30 minutes if time allows.","Butter the outer sides of the buns and toast in a hot pan until golden on both cut faces.","Fill the toasted buns generously with the prawn salad. Top with extra chives or a lemon wedge."],"notes":["Goes well with kettle-cooked chips or fries, a light vinegar-based coleslaw, grilled corn, and a crisp white wine or rosé."]},"steakhouse-burgers":{"title":"Juicy Steakhouse Burgers","sub":"Once Upon a Chef — packed with flavour and reliably juicy, even when cooked to well-done.","src":"The Best Steakhouse Burgers.pdf","serves":8,"unit":"burgers","groups":[{"i":[{"q":2,"u":"pieces","n":"white sandwich bread, crusts removed and cut into 1/4-inch pieces"},{"q":0.333,"u":"cup","n":"milk"},{"q":2.5,"u":"tsp","n":"kosher salt"},{"q":1,"u":"tsp","n":"freshly ground black pepper"},{"q":3,"u":"cloves","n":"garlic, minced"},{"q":1.5,"u":"tbsp","n":"Worcestershire sauce"},{"q":2,"u":"tbsp","n":"ketchup"},{"q":3,"u":"pounds","n":"85% lean ground beef"},{"q":3,"n":"scallions, very finely sliced","note":"optional"},{"q":8,"n":"hamburger buns"}]}],"steps":["Preheat the grill to high heat.","In a large bowl, mash the bread and milk together with a fork until it forms a chunky paste. Add the salt, pepper, garlic, Worcestershire sauce and ketchup and mix well.","Add the ground beef and scallions and break the meat up with your hands. Mix everything together until just combined. Divide the mixture into 8 equal portions and form balls. Flatten the balls into 3/4-inch patties about 4-1/2 inches across. Form a slight depression in the center of each patty to prevent the burgers from puffing up on the grill.","Oil the grilling grates. Grill the burgers, covered, until nicely browned on the first side, 2 to 4 minutes. Flip burgers and continue cooking for a few minutes more until desired doneness is reached. Before serving, toast the buns on the cooler side of the grill if desired."],"notes":["Freezer-friendly: the uncooked burgers can be frozen for up to three months. (Freeze the burgers on a baking sheet or plate so their shape sets, then transfer them to a sealable plastic bag.) Defrost overnight in the refrigerator prior to serving and then cook as directed."]},"smash-burgers":{"title":"The Best Homemade Smash Burgers","sub":"CarnalDish — the Burger Juice is what makes these burgers so amazing.","src":"Beef Smash Burgers.pdf","serves":5,"unit":"servings","servesNote":"4–6","meta":[{"k":"Total","v":"36 min"}],"groups":[{"n":"CarnalDish burger juice","i":[{"q":0.5,"u":"stick","n":"butter, melted"},{"q":1,"u":"tbsp","n":"Worcestershire sauce"},{"q":0.5,"u":"tbsp","n":"fish sauce","note":"trust me, adds a great depth of flavor"},{"n":"A few dashes of liquid smoke"}]},{"n":"Burgers","i":[{"q":1,"u":"pound","n":"ground chuck (80/20)"},{"n":"Kosher salt and black pepper, to taste"},{"n":"Cheese, any kind you choose"},{"n":"Brioche buns, buttered and toasted"},{"n":"Toppings of choice (try to keep it simple if you can)"}]},{"n":"Burger sauce","i":[{"q":0.25,"u":"cup","n":"mayo"},{"q":0.25,"u":"cup","n":"ketchup"},{"q":0.25,"u":"cup","n":"spicy brown mustard"},{"q":2,"n":"minced garlic cloves"},{"q":1,"u":"tbsp","n":"white vinegar"},{"q":0.125,"u":"tsp","n":"cayenne pepper"},{"q":0.125,"u":"tsp","n":"smoked paprika"},{"n":"Salt and pepper, to taste"},{"n":"Pinch of sugar, to taste"}]}],"steps":["Mix all ingredients for the burger sauce, and set aside in the fridge. Mix all the Burger Juice ingredients together in a small bowl. In another medium-sized bowl, add the beef. Pour the Burger Juice into the beef, and gently break it up with a spoon or your hands and GENTLY mix thoroughly. Do not over-work your meat, be very very gentle with it. Once it's thoroughly mixed, scoop into 3–4 oz sized balls. Cover the burger balls with plastic wrap and refrigerate for a minimum of a half hour. You want the meat to be super cold. You could also pop into your freezer for about 15 minutes.","When ready to cook, heat a large cast iron skillet over high heat until SUPER HOT. Drop a tiny sprinkle of water to test it, if it immediately sizzles and bounces around and disappears, it's ready. No need to add oil, there's plenty of fat in the burger. Remove your burgers from the fridge or freezer and sprinkle them with kosher salt and pepper. Place about 3 to 4 balls in the skillet, leaving room for them to be smashed down. After 30 seconds of searing, smash them all the way down until they can't be smashed anymore, with a large heavy skillet. Leave them alone and let them cook for about 3 to 4 minutes, or when the edges start to turn brown. Flip them over and immediately place a slice of cheese on top of each patty. When the cheese melts, they're ready, about 1 to 2 minutes longer.","Build your burger with the toppings of your choice and enjoy!"]},"wagyu-steak":{"title":"Pan-Seared Wagyu Steak","src":"Wagyu Steak.docx","serves":1,"unit":"steak","groups":[{"i":[{"q":1,"n":"wagyu steak, c. 1.5 cm thick","note":"bought in Market City"},{"q":[4,5],"u":"large cloves","n":"garlic, cut into thin slices"},{"n":"A LOT of salt and pepper"},{"n":"Canola oil (not butter, turns black under high heat)"}]}],"steps":["Leave at room temperature for c. 1 h before frying.","Cut c. 4–5 large garlic cloves into thin slices.","Season with A LOT of salt and pepper before frying.","Heat non-stick frying pan / stainless steel pan until very hot.","Add canola oil (not butter, turns black under high heat).","Sear steak on each side for 1 min to close the pores and keep the juice in the steak.","Then add the garlic and fry for a total of 4 min on low heat / 6 minutes on low heat until cooked medium. Add some garlic on top of the steak for flavour.","When done frying, wrap in tin foil and let it rest for c. 2–3 mins.","Serve on a hot plate (warm for c. 2–2.5 mins in the microwave). Serve with the sliced garlic fried with the steak."],"notes":["Turned out very well according to the above instructions."]},"reverse-seared-steak":{"title":"Reverse-Seared Steak","sub":"Serious Eats.","src":"Reverse-seared steak (serious eats).pdf","serves":1.5,"unit":"servings","servesNote":"1 to 2","meta":[{"k":"Prep","v":"25 min"},{"k":"Cook","v":"25 min"},{"k":"Total","v":"50 min"}],"groups":[{"i":[{"n":"Thick-cut beef steak(s), at least 1 1/2 to 2 inches thick, such as ribeye, strip, porterhouse, T-bone, tri-tip, or filet mignon"},{"n":"Kosher salt and freshly ground black pepper"},{"n":"Vegetable oil (if finishing on the stovetop; optional)"},{"q":1,"u":"tbsp","n":"unsalted butter (15 g)","note":"if finishing on the stovetop; optional"}]}],"steps":["Generously season steak(s) all over with salt and pepper. If desired, set steak(s) on a wire rack set in a rimmed baking sheet and refrigerate, uncovered, overnight to dry out the exterior. Otherwise, proceed with the next step.",{"h":"If cooking in the oven"},"Set steak(s) on a wire rack set in a rimmed baking sheet. Preheat oven to anywhere between 200 and 275 °F (93 and 135 °C); if your oven goes lower, you can set it to an even lower temperature, though it will take longer to cook.","Place steak(s) in the oven and cook until an instant-read thermometer registers 105 °F (41 °C) for rare, 115 °F (46 °C) for medium-rare, 125 °F (52 °C) for medium, or 135 °F (57 °C) for medium-well. This will take about 20 minutes for rare steak and up to about 40 minutes for medium-well; cooking time can vary dramatically depending on many factors, so check often.","Just before steak(s) come out of the oven, add 1 tablespoon (15 ml) oil to a cast iron, carbon steel, or heavy stainless steel skillet and heat over high heat until smoking. Add steak(s) and butter to skillet and cook until each side is well browned, about 45 seconds per side. Using tongs, hold steak(s) sideways to sear edges. Serve right away; there's no need to let reverse-seared steaks rest.",{"h":"If cooking on the grill"},"Light one chimney full of charcoal. When all the charcoal is lit and covered with gray ash, pour out and spread the coals evenly over half of the coal grate. Alternatively, set half the burners of a gas grill to high heat. Set cooking grate in place, cover grill, and allow to preheat for 5 minutes. Clean and oil grilling grate.","Set steak(s) on cooler side of grill and let cook uncovered, turning occasionally, until an instant-read thermometer registers 105 °F (41 °C) for rare, 115 °F (46 °C) for medium-rare, 125 °F (52 °C) for medium, or 135 °F (57 °C) for medium-well. Cooking time can vary greatly, so check the steaks often.","Transfer steak(s) to a platter and tent with foil. If you are using a charcoal grill and your coals have died down, build up the biggest fire you can. If using a gas grill, make sure all burners are turned to their highest heat and allow the grill to preheat with the lid closed.","Return steak(s) to the hottest part of the grill and cook, turning frequently, until crisp and charred all over, about 1 1/2 minutes total. Serve right away."],"notes":["Special equipment: wire rack and rimmed baking sheet (if dry-brining or cooking in the oven); cast iron pan, carbon steel skillet, or heavy stainless steel skillet (if finishing on the stovetop); charcoal grill and chimney starter (if cooking on the grill); instant-read thermometer."]},"oven-bbq-pork-ribs":{"title":"Oven Barbecue Ribs (Pork)","sub":"Cafe Delites — baby back pork ribs slathered in a sticky barbecue sauce.","src":"Oven Barbecue Ribs.pdf","serves":5,"unit":"people","servesNote":"4–6","meta":[{"k":"Prep","v":"10 min"},{"k":"Cook","v":"2 hrs 15 min"}],"groups":[{"n":"Ribs","i":[{"q":2,"u":"kg","n":"baby back pork ribs","note":"4 pounds"},{"q":2,"u":"tsp","n":"garlic powder"},{"q":1,"u":"tsp","n":"onion powder"},{"q":2,"u":"tsp","n":"paprika"},{"q":2,"u":"tsp","n":"salt"},{"q":1,"u":"tsp","n":"cracked black pepper"},{"q":0.5,"u":"tsp","n":"cumin"},{"q":1,"u":"tsp","n":"chili or cayenne powder","note":"optional"},{"q":2,"u":"tbsp","n":"olive oil"}]},{"n":"Sauce","i":[{"q":500,"u":"ml","n":"barbecue sauce","note":"2 cups"},{"q":3,"u":"tbsp","n":"minced garlic"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"Worcestershire sauce"},{"q":[0.5,1],"u":"tbsp","n":"cayenne pepper","note":"optional, for heat"},{"q":1,"u":"tsp","n":"salt"}]}],"steps":["Preheat oven to 350 °F (180 °C).","Peel off tough membrane that covers the underside/bony side of the ribs. Place on a baking sheet or tray lined with foil (or parchment paper).","Combine together garlic powder, onion powder, paprika, salt, pepper, cumin and chili or cayenne. Sprinkle seasoning over ribs and drizzle with oil. Rub the seasoning all over the ribs on both sides. Cover tray with foil and bake for 2 hours.","During the last 5 minutes of cook time, mix together sauce ingredients.","Remove ribs from the oven, remove foil and spread the tops of the ribs with the barbecue sauce mixture.","Increase oven temperature to 460 °F (240 °C). Return ribs to the oven, uncovered, and bake for a further 10 minutes. Change oven settings to broil (or grill) on medium-high heat to lightly char and caramelise the edges (about 3 minutes).","Rest for 10 minutes to allow the juices to recirculate back into the meat before slicing."]},"oven-bbq-beef-ribs":{"title":"Oven Baked BBQ Beef Ribs","sub":"Divas Can Cook — well-seasoned to the bone, slow baked, tender, juicy and fall off the bone.","src":"Oven Baked BBQ Beef Rib.pdf","serves":4,"unit":"people","meta":[{"k":"Prep","v":"10 min"},{"k":"Marinate","v":"2 hrs"},{"k":"Cook","v":"4 hrs"}],"groups":[{"i":[{"q":3,"u":"lbs","n":"meaty beef ribs (grass-fed)"},{"n":"Liquid smoke, optional"},{"q":[2,4],"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"garlic powder"},{"q":1,"u":"tbsp","n":"onion powder"},{"q":1,"u":"tbsp","n":"cajun seasoning"},{"q":2,"u":"tbsp","n":"dark brown sugar, packed"},{"q":1,"u":"tsp","n":"chili powder"},{"q":1,"u":"tsp","n":"salt","note":"can use smoked salt as well; author used 1½ tsp"},{"q":1,"u":"tsp","n":"paprika"},{"q":2,"u":"tsp","n":"oregano"},{"n":"Favorite BBQ sauce (only a few tablespoons of Sweet Baby Ray's)"}]}],"steps":["Rinse ribs and dry COMPLETELY with paper towels.","Douse dry ribs with liquid smoke if using and rub it in.","Lightly coat ribs in olive oil.","Mix together seasoning and sprinkle generously over ribs, front and back. (You don't have to use all of seasoning mix.)","Massage the spices into the ribs, adding more olive oil to help distribute the spices well if needed.","Place the ribs in a large ziplock bag or covered bowl and marinate in the fridge for 1–2 hours.","Preheat the oven to 250 °F.","Place the ribs on a foil lined baking tray in a single layer.","Add another piece of foil on top to create a pouch for the ribs to cook in. Be sure to seal the edges of the foil so that it's tight and steam won't seep out.","Bake on the middle rack of 3 1/2–4 hours. (Check on it after the 3 1/2 hour mark. The oven temperature is very low so you can afford to cook it a bit longer without worry.)","When the ribs are done to your liking, drain off the excess fat.","Brush the ribs with desired amount of BBQ sauce.","Broil on low until the sauce is sticky. (This won't take long so keep an eye on it.)","Serve hot and enjoy."]},"buffalo-wings":{"title":"Baked Buffalo Wings","sub":"Using Sweet Baby Ray's Buffalo Sauce, baking option only.","src":"Buffalo wings.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":2,"u":"pounds","n":"chicken wings","note":"drumettes and flats"},{"q":1,"u":"tsp","n":"salt"},{"q":1,"u":"tsp","n":"pepper"},{"q":1,"u":"tsp","n":"paprika","note":"optional"},{"n":"Cooking spray, for the baking rack"},{"q":[0.5,0.667],"u":"cup","n":"Sweet Baby Ray's Buffalo Sauce"}]}],"steps":[{"h":"1. Prep the wings"},"Separate the wings: if necessary, cut each wing into drumettes and flats; discard the wing tips.","Season: pat the wings dry with paper towels and toss with salt, pepper, and paprika.",{"h":"2. Bake the wings"},"Preheat your oven to 400 °F (200 °C).","Line a baking sheet with aluminum foil for easy cleanup and place a wire rack on top. Spray the rack with cooking spray.","Arrange the wings in a single layer on the rack, ensuring they are not overcrowded.","Bake for 45–50 minutes, flipping the wings halfway through, until they are golden brown and crispy.",{"h":"3. Toss in buffalo sauce"},"Once the wings are cooked, transfer them to a large mixing bowl.","Pour Sweet Baby Ray's Buffalo Sauce over the wings (adjust the amount to your taste).","Toss gently until all the wings are evenly coated.",{"h":"4. Serve"},"Serve the wings hot with celery sticks, carrot sticks, and your choice of ranch or blue cheese dressing."],"notes":["Maximize crispiness: ensure the wings are completely dry before seasoning and baking.","Extra saucy wings: warm the sauce slightly before tossing the wings.","Make ahead: bake the wings and reheat in the oven before saucing for a quick appetizer."]},"blue-cheese-dip":{"title":"Blue Cheese Dip","sub":"Food Network Kitchen — from the Fried Buffalo Wings with Blue Cheese Dip recipe.","src":"Blue Cheese Dip.pdf","transcribed":true,"serves":6,"unit":"servings","groups":[{"n":"For the dip","i":[{"q":0.5,"u":"cup","n":"sour cream"},{"q":0.5,"u":"cup","n":"crumbled blue cheese"},{"q":0.25,"u":"cup","n":"mayonnaise"},{"q":1,"u":"small clove","n":"garlic, chopped"},{"q":1,"u":"tbsp","n":"milk or buttermilk"},{"q":0.5,"n":"lemon, juiced"},{"n":"Kosher salt and freshly ground pepper"}]}],"steps":["Make the dip: pulse the sour cream, blue cheese, mayonnaise, garlic, milk and lemon juice in a food processor until combined but still chunky. Season with salt and pepper. Cover and refrigerate until ready to serve."],"notes":["The source recipe also includes fried buffalo wings; only the dip is reproduced here, since the menu pairs it with the oven-baked wings."]},"garlic-parmesan-wings":{"title":"Garlic Parmesan Wings (Wingboy-Style)","sub":"Oven-baked nibbles with a creamy garlic-parmesan-chive sauce.","src":"Garlic Parmesan Wing Sauce.docx","serves":1,"unit":"kg of wings","groups":[{"n":"Wings (for ~1 kg)","i":[{"q":1,"u":"kg","n":"chicken nibbles (wingettes/drumettes)"},{"q":1,"u":"tbsp","n":"neutral oil"},{"q":0.75,"u":"tsp","n":"salt"},{"q":0.5,"u":"tsp","n":"white pepper"},{"q":0.5,"u":"tsp","n":"garlic powder"},{"q":0.5,"u":"tsp","n":"onion powder"},{"q":0.5,"u":"tsp","n":"baking powder","note":"optional, for extra crisp"}]},{"n":"Creamy garlic parmesan sauce","i":[{"q":0.5,"u":"cup","n":"whole-egg mayonnaise"},{"q":0.25,"u":"cup","n":"light sour cream"},{"q":1,"u":"small clove","n":"garlic, micro-planed"},{"q":[35,40],"u":"g","n":"finely grated parmesan"},{"q":0.5,"u":"tsp","n":"garlic powder"},{"q":0.5,"u":"tsp","n":"onion powder"},{"q":0.25,"u":"tsp","n":"white pepper"},{"n":"Salt to taste"},{"q":[1,2],"u":"tbsp","n":"finely chopped chives"}]}],"steps":[{"h":"Oven method (wings)"},"Preheat oven to 220 °C fan.","Pat chicken very dry with paper towels.","Toss with oil, salt, white pepper, garlic powder, onion powder, and optional baking powder.","Place on a wire rack over a tray.","Bake for 40–45 minutes, flipping once at ~25 minutes. Wings should be golden and crispy.",{"h":"Sauce"},"Whisk mayonnaise and sour cream until smooth.","Add garlic, garlic powder, onion powder, and white pepper.","Gradually whisk in parmesan until smooth.","Season lightly with salt if needed. Fold in chives.",{"h":"Finish"},"Toss hot wings with sauce immediately after baking. Serve with extra parmesan and chives if desired."]},"lemongrass-chicken-skewers":{"title":"Lemongrass Chicken Skewers","sub":"Fragrant Vietnamese-style lemongrass chicken skewers that stay juicy and light, perfect for BBQ or grill cooking.","src":"Lemongrass Chicken Skewers.docx","serves":5.5,"unit":"servings","servesNote":"approx. 5–6","groups":[{"n":"Chicken & marinade","i":[{"q":1.2,"u":"kg","n":"chicken thighs, boneless & skinless"},{"q":3,"u":"stalks","n":"lemongrass (tender inner part only), very finely minced"},{"q":5,"u":"cloves","n":"garlic, minced"},{"q":2,"u":"small","n":"shallots, finely minced or grated","note":"or 1 medium brown onion"},{"q":3,"u":"tbsp","n":"fish sauce"},{"q":2.5,"u":"tbsp","n":"brown sugar or palm sugar"},{"q":1.5,"u":"tbsp","n":"neutral oil","note":"vegetable or rice bran"},{"q":1.5,"u":"tbsp","n":"light soy sauce","note":"optional, for depth"},{"q":0.75,"u":"tsp","n":"white pepper","note":"or black pepper"},{"q":0.75,"u":"tsp","n":"turmeric or chili flakes","note":"optional"}]},{"n":"Nuoc cham sauce","i":[{"q":4,"u":"tbsp","n":"fish sauce"},{"q":4,"u":"tbsp","n":"fresh lime juice"},{"q":2.5,"u":"tbsp","n":"sugar"},{"q":2,"u":"tbsp","n":"water"},{"q":[1,2],"u":"cloves","n":"garlic, finely minced"},{"n":"Fresh red chili, finely chopped (to taste)"}]}],"steps":[{"h":"Preparation"},"Trim chicken thighs and slice into flat, skewer-friendly pieces.","Remove tough outer layers from lemongrass. Use only the bottom 10–12 cm and mince very finely.","Combine lemongrass, garlic, shallot, fish sauce, sugar, oil, soy sauce, pepper, and optional spices in a bowl.","Add chicken and mix thoroughly until evenly coated.","Cover and marinate for at least 2 hours, ideally overnight.",{"h":"Cooking"},"Soak bamboo skewers in water for 30 minutes if using.","Thread chicken onto skewers, folding pieces back and forth for even cooking.","Preheat BBQ or grill to medium-high heat and lightly oil the grill.","Grill skewers for 2–3 minutes per side, turning frequently, until lightly charred and cooked through (internal temperature ~74 °C).","If flare-ups occur, move skewers to indirect heat to finish cooking.",{"h":"Nuoc cham"},"Stir fish sauce, lime juice, sugar, and water until sugar dissolves.","Add garlic and chili.","Taste and adjust balance of salty, sour, and sweet as needed."]},"aji-amarillo-chicken":{"title":"Grilled Aji Amarillo Chicken Plate","src":"Aji Amarillo Chicken.docx","serves":4,"unit":"servings","groups":[{"n":"Chicken + marinade","i":[{"q":[800,1000],"u":"g","n":"chicken thighs"},{"q":[2,3],"u":"tbsp","n":"aji amarillo paste"},{"q":3,"u":"cloves","n":"garlic"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"soy sauce"},{"q":1,"u":"tbsp","n":"lime juice"},{"q":1,"u":"tsp","n":"smoked paprika"},{"q":1,"u":"tsp","n":"cumin"},{"q":0.5,"u":"tsp","n":"oregano"},{"n":"Black pepper"},{"q":1,"u":"tbsp","n":"Greek yoghurt","note":"optional"}]},{"n":"Creamy aji amarillo sauce","i":[{"q":2,"u":"tbsp","n":"aji amarillo paste"},{"q":1,"u":"small","n":"onion, diced"},{"q":2,"u":"cloves","n":"garlic"},{"q":1,"u":"tbsp","n":"butter"},{"q":0.5,"u":"cup","n":"chicken stock"},{"q":0.5,"u":"cup","n":"evaporated milk","note":"or cream"},{"q":[2,3],"n":"crackers or small piece white bread"},{"q":2,"u":"tbsp","n":"parmesan"},{"n":"Optional: handful cashews or walnuts"}]},{"n":"Pickled red onions","i":[{"q":1,"n":"red onion, thinly sliced"},{"q":2,"n":"limes, juiced"},{"n":"Salt"},{"n":"Coriander"}]},{"n":"Grilled corn","i":[{"q":[2,3],"n":"corn cobs, halved"},{"n":"Butter"},{"n":"Lime"},{"n":"Salt + paprika"}]},{"n":"Avocado","i":[{"q":2,"n":"ripe avocados"},{"n":"Lime"},{"n":"Salt"},{"n":"Olive oil"}]}],"steps":["Marinate chicken: blend marinade ingredients, coat chicken, marinate 2–3 hours (overnight best).","Pickle onions: combine onion, lime juice, salt, and coriander. Let sit 20–30 mins.","Make sauce: cook onion in butter (5 mins), add garlic (1 min), add aji paste (2–3 mins). Blend with stock, milk, crackers, parmesan, optional nuts. Simmer until smooth.","Prep sides: slice avocado and season. Optionally pre-boil corn for 5 mins.","Grill: cook chicken on medium-high 5–7 mins per side until charred and cooked (~75 °C internal). Grill corn until lightly charred and toss with butter, lime, paprika, salt.","Rest chicken 5 mins, slice.","Plate: spoon sauce onto plate, add chicken, sides, finish with coriander and lime."]},"chipotle-chicken-tacos":{"title":"Smoky Chipotle Slow-Cooked Chicken Tacos","src":"Chipotle chicken tacos.docx","serves":6,"unit":"servings","groups":[{"n":"Chicken","i":[{"q":[1.2,1.5],"u":"kg","n":"chicken thighs","note":"boneless, skinless"},{"q":1,"u":"large","n":"onion, sliced"},{"q":[4,5],"u":"cloves","n":"garlic"},{"q":[2,3],"n":"chipotle peppers in adobo","note":"+ 1 tbsp adobo sauce"},{"q":1,"u":"tbsp","n":"tomato paste"},{"q":1,"u":"tsp","n":"cumin"},{"q":1,"u":"tsp","n":"smoked paprika"},{"q":1,"u":"tsp","n":"oregano"},{"q":1,"u":"cup","n":"chicken stock"},{"q":1,"u":"tsp","n":"soy sauce or fish sauce"},{"n":"Salt & pepper"},{"q":1,"u":"tbsp","n":"olive oil or butter","note":"for finishing"},{"q":1,"n":"lime, juiced"}]},{"n":"Toppings","i":[{"n":"Red onion mix: finely sliced red onion + lime juice + chopped coriander + salt"},{"n":"Lime crema: sour cream + lime juice + salt"},{"n":"Chopped lettuce"}]}],"steps":["(Optional) Sear chicken thighs in a hot pan with a little oil for extra flavour. Alternatively, sear on the BBQ.","Add sliced onion and garlic to the bottom of a slow cooker or heavy pot.","Place chicken on top and add all remaining ingredients (except butter and lime).","Cook on LOW for 6–7 hours or HIGH for 3–4 hours.","Remove chicken, shred with forks.","Simmer the remaining liquid uncovered for 10–15 minutes until slightly thickened.","Return chicken to sauce and mix well.","Finish with butter/olive oil and fresh lime juice. Adjust seasoning.",{"h":"To serve"},"Heat tortillas in a sandwich press until warm and slightly toasted.","Fill with chipotle chicken. Top with red onion mix and lime crema and chopped lettuce. Serve immediately."]},"tacos-al-pastor":{"title":"Tacos al Pastor — BBQ Version with Pork Neck","src":"Tacos al Pastor.docx","serves":6,"unit":"servings","meta":[{"k":"Prep","v":"30 min (plus marinate overnight)"},{"k":"Cook","v":"~15–20 min"}],"groups":[{"n":"Marinade + pork","i":[{"q":2,"u":"hunks","n":"pork neck","note":"about 1–1.2 kg total"},{"q":3,"n":"dried guajillo chiles","note":"stems/seeds removed"},{"q":2,"u":"cloves","n":"garlic"},{"q":0.5,"n":"onion"},{"q":1,"u":"tsp","n":"dried oregano"},{"q":0.5,"u":"tsp","n":"ground cumin"},{"q":0.5,"u":"tsp","n":"ground cinnamon"},{"q":2,"u":"tbsp","n":"white vinegar"},{"q":1,"n":"orange, juiced","note":"or ½ cup pineapple juice"},{"q":2,"u":"tbsp","n":"achiote paste","note":"or sub with 1 tbsp smoked paprika + ½ tsp turmeric + 1 tsp white vinegar"},{"q":1.5,"u":"tsp","n":"salt"},{"q":2,"u":"tbsp","n":"neutral oil"},{"q":2,"u":"slices","n":"fresh pineapple","note":"peeled, cored"}]},{"n":"To serve","i":[{"n":"Corn tortillas"},{"n":"Diced fresh pineapple"},{"n":"Chopped onion"},{"n":"Chopped cilantro"},{"n":"Lime wedges"},{"n":"Salsa (optional)"}]}],"steps":["Make marinade. Toast the guajillo chiles in a dry pan over medium heat (30 sec each side, until fragrant). Soak them in hot water for 10–15 min until soft. Blend together: soaked chiles, garlic, onion, oregano, cumin, cinnamon, vinegar, orange juice / pineapple juice, achiote paste, salt, oil → blend into a smooth paste.","Marinate pork neck hunks (whole). Place your whole pork neck hunks in a dish or ziplock bag. Pour in the marinade and coat all over. Marinate overnight in the fridge (minimum 4 hours). (Do NOT slice yet — it stays juicier this way.)","Slice pork thinly (after marinating). Remove pork from marinade. Slice across the grain into 4–5 mm thick slices, like thin pork steaks or strips. Optional: grill pineapple slices alongside pork.","Grill the pork on your gas BBQ. Preheat BBQ to medium-high (lid closed). Grill pork slices for 2–3 minutes per side until charred and cooked through. Grill pineapple slices at the same time, turning once. Rest pork briefly, then chop into small taco-sized pieces.","Assemble tacos. Warm corn tortillas on the grill. Fill with chopped pork, grilled pineapple (chopped), onion, cilantro, and a squeeze of lime. Add salsa if you like."],"notes":["Keep the grill closed between flipping to maintain high heat.","If pork slices are too thick, you can pound them a bit with a meat mallet or back of a knife before grilling.","Freeze any leftover grilled pork for quick taco nights later."]},"skirt-steak":{"title":"Grilled Skirt Steak (for Tacos)","src":"Skirt Steak.docx","serves":1,"unit":"kg steak","groups":[{"n":"Steak","i":[{"q":1,"u":"kg","n":"Entraña skirt steak","note":"Meat Emporium; last time c. $24/kg"},{"n":"Salt and pepper, generously"},{"n":"Oil, to rub"}]},{"n":"To serve as steak tacos","i":[{"n":"Soft wheat tacos"},{"n":"Coriander, fresh chili"},{"n":"Sour cream, hot sauce"},{"n":"Grilled onion, garlic"}]}],"steps":["Buy c. 1 kg Entraña skirt steak in the Meat Emporium.","Take out of the fridge c. 1 h ahead of time.","Pre-heat gas grill for c. 20 minutes.","Generously salt and pepper the steak, rub some oil.","Might need to cut the steak into halves — good to keep thicker part separate from thinnest parts if possible.","Reduce grill heat to medium. Grill 3 min on each side.","Check the temperature in the thickest part — should be 60–64 for medium (nice pink colour but not rare). If not yet reached the temperature, flip and leave it for another minute, and measure again.","Remove steak from grill once ready and let it rest for 5–10 minutes.","Cut against the grain into slices."],"notes":["Alternatively: try grilling 3 min on each side on medium-hot temperature next time. Be sure to measure temperature so as not to overcook it while trying this."]},"mexican-shredded-beef":{"title":"Mexican Shredded Beef (and Tacos)","sub":"RecipeTin Eats — the sauce is rich, thick and full of flavour, and the beef is very tender and juicy.","src":"Mexican Shredded Beef (and Tacos).pdf","serves":12,"unit":"tacos","meta":[{"k":"Prep","v":"20 min"},{"k":"Cook","v":"3 hrs"}],"groups":[{"n":"Spice mix","i":[{"q":0.9,"u":"tbsp","n":"chipotle powder","note":"adjust spiciness to taste"},{"q":0.6,"u":"tbsp","n":"paprika"},{"q":0.6,"u":"tbsp","n":"dried oregano"},{"q":0.6,"u":"tsp","n":"All Spice powder"},{"q":0.6,"u":"tsp","n":"coriander powder"},{"q":1.2,"u":"tsp","n":"onion powder or garlic powder","note":"OR 1 tsp of each"},{"q":0.6,"u":"tsp","n":"salt and pepper, each"}]},{"n":"Beef","i":[{"q":[0.6,1.2],"u":"tbsp","n":"olive oil"},{"q":0.9,"u":"kg","n":"beef chuck or brisket, cut into 4 pieces","note":"1.8 lb; or gravy or any other slow cooking beef"},{"q":3,"u":"cloves","n":"garlic, minced"},{"q":0.6,"n":"onion, diced","note":"yellow, brown or white"},{"q":111,"u":"ml","n":"orange juice","note":"0.45 cup"},{"q":1.2,"u":"tbsp","n":"lime juice"},{"q":240,"u":"g","n":"can crushed tomatoes","note":"8.4 oz"},{"q":300,"u":"ml","n":"beef or chicken broth/stock","note":"1.2 cups"},{"q":75,"u":"ml","n":"water","note":"0.3 cup"},{"n":"Salt and pepper"}]},{"n":"For the tacos","i":[{"n":"Warmed small tortillas"},{"n":"Avocado slices"},{"n":"Pico de Gallo"},{"n":"Shredded cheese"},{"n":"Sour cream"},{"n":"Lime wedges and extra cilantro/coriander leaves"}]}],"steps":["Combine the Spice Mix ingredients in a bowl. Sprinkle 4 teaspoons over the beef and pat so it sticks.","Heat the olive oil in a large heavy based pot over high heat. Add the beef (in batches if necessary) and brown well on all sides. Remove onto a plate.","Turn the stove down to medium. If the pot looks dry, add more olive oil.","Add the garlic and onion and cook for 3 minutes until soft.","Add the orange juice and lime juice, and scrape the bottom of the pot so the brown bits mix into the liquid.","Add tomato, beef stock, water and remaining spice mix. Mix, then return beef into pot.","Put the lid on, bring to a simmer then turn the stove down so it is bubbling gently, not rapidly.","Cook for 2 hours, then remove lid and simmer for another 30 minutes until beef is tender enough to shred.","Remove the beef from sauce, shred with 2 forks.","Leave the sauce to simmer with the lid off for 10 to 15 minutes to reduce and thicken to your taste. Adjust salt to taste. Optional: puree with stick blender to make it smooth.","Toss beef back into the sauce (can reserve some sauce for drizzling on tacos if you want, there's plenty).","Transfer beef into large dish and serve. To make tacos, serve the beef with warmed small tortillas, avocado slices, Pico de Gallo, shredded cheese, sour cream, lime wedges and extra cilantro/coriander leaves."],"notes":["Cook time will vary depending on the cut of beef, how heavy based your pot is and how thick your cut is. Check at 2 hours and every 30 minutes thereafter to see if it is \"shreddable\" tender.","Other cook methods: slow cooker for 8 hours on low, pressure cooker & Instant Pot on high for 50 minutes. Oven: after completing step 6, cover and place in 325 °F/160 °C oven for 3–3½ hours.","Quantity: makes enough for 20–25 tacos, 12–15 burritos. Enough to serve 8 to 10 people.","Storage: to freeze or refrigerate, keep the sauce and beef separate. Reheat the beef in the microwave or in the oven (covered with foil), heat the sauce then toss.","Chipotle powder spiciness: mild — reduce to 2 tsp to 1 tbsp, add 1 tsp extra coriander plus 1 tsp cumin; medium — 1.5 tbsp; spicy — 2 tbsp. Substitute: ½ tbsp each SMOKED paprika, cumin and cayenne pepper."]},"coda-alla-vaccinara":{"title":"Coda alla Vaccinara (Roman-Style Oxtail Stew)","sub":"A classic Roman braised oxtail dish: rich, gelatinous, tomato-based, and deeply savoury.","src":"Oxtail Stew Italian.docx","serves":5,"unit":"servings","servesNote":"4–6","groups":[{"n":"Stew","i":[{"q":[1.8,2],"u":"kg","n":"oxtail, cut into segments"},{"n":"Salt and freshly ground black pepper"},{"q":3,"u":"tbsp","n":"olive oil"},{"q":1,"u":"large","n":"onion, finely chopped"},{"q":[6,7],"u":"stalks","n":"celery, chopped"},{"q":4,"u":"cloves","n":"garlic, smashed"},{"q":2,"u":"tbsp","n":"tomato paste"},{"q":400,"u":"g","n":"canned crushed tomatoes","note":"or passata"},{"q":1,"u":"cup","n":"dry white wine"},{"q":2,"n":"bay leaves"},{"q":1,"u":"small sprig","n":"rosemary or thyme"}]},{"n":"Optional but traditional (choose 1–2)","i":[{"q":2,"n":"anchovy fillets"},{"q":1,"u":"tbsp","n":"pine nuts"},{"q":1,"u":"tbsp","n":"raisins or currants"},{"n":"A small strip of orange peel (no white pith)"}]},{"n":"To finish","i":[{"q":[1,2],"u":"tbsp","n":"red wine vinegar"},{"n":"Chopped flat-leaf parsley"},{"n":"Optional: grated Pecorino Romano"}]}],"steps":["Brown the oxtail. Season the oxtail generously with salt and pepper. Heat olive oil in a heavy pot or Dutch oven. Brown the oxtail deeply on all sides in batches. Remove and set aside.","Build the soffritto. In the same pot, add onion and celery. Cook gently for 10–15 minutes until very soft and lightly golden. Add garlic, tomato paste, and anchovies (if using). Cook for 2 minutes until fragrant and the paste darkens.","Deglaze. Pour in the white wine, scraping the bottom of the pot to release all browned bits. Reduce by about half.","Braise. Return the oxtail to the pot. Add crushed tomatoes, bay leaves, and herbs. Add enough water or stock to almost cover the meat. Bring to a gentle simmer, cover, and cook low and slow — stovetop: 3–3.5 hours on very low heat; oven: 160 °C (320 °F) for 3–4 hours. Stir occasionally.","Final seasoning. When the meat is falling off the bone, remove bay leaves and herb stems. Stir in red wine vinegar, pine nuts, raisins, or orange peel if using. Simmer uncovered for 10–15 minutes until the sauce is glossy. Adjust seasoning."],"notes":["Traditionally served with rigatoni (toss the pasta in the sauce first, then serve the meat separately), or with polenta or crusty bread. Finish with parsley and Pecorino Romano."]},"osso-buco":{"title":"Osso Buco alla Milanese (Beef Version)","sub":"A classic, slow-braised Italian osso buco adapted for beef shank. Rich, deeply savoury, and balanced with fresh gremolata at the end.","src":"Osso Bucco alla Milanese (Beef).docx","serves":4,"unit":"people","groups":[{"n":"For the osso buco","i":[{"q":4,"n":"beef osso buco (beef shank), 4–5 cm thick"},{"n":"Salt and freshly ground black pepper"},{"n":"Plain flour, for light dredging"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":40,"u":"g","n":"butter"},{"q":1,"u":"medium","n":"onion, very finely diced"},{"q":1,"u":"medium","n":"carrot, very finely diced"},{"q":1,"u":"stalk","n":"celery, very finely diced"},{"q":2,"u":"cloves","n":"garlic, lightly crushed"},{"q":200,"u":"ml","n":"dry white wine"},{"q":500,"u":"ml","n":"good beef stock"},{"q":1,"n":"bay leaf"},{"q":1,"u":"strip","n":"lemon peel","note":"no white pith"},{"q":1,"u":"tsp","n":"tomato paste","note":"optional, for depth"}]},{"n":"For the gremolata","i":[{"q":1,"n":"lemon, zested"},{"q":1,"u":"small clove","n":"garlic, very finely minced or microplaned"},{"n":"Small handful flat-leaf parsley, finely chopped"}]}],"steps":["Tie each osso buco around the circumference with kitchen string to keep its shape during cooking. Season generously with salt and pepper, then lightly dredge in flour, shaking off any excess.","Heat the olive oil and butter in a heavy casserole or Dutch oven over medium-high heat. Brown the osso buco deeply on both sides, then remove and set aside.","Lower the heat to medium. Add the onion, carrot, celery, and garlic. Cook gently for 8–10 minutes until soft and sweet, without browning.","Add the white wine and scrape the bottom of the pot. Reduce by about two-thirds to cook off the alcohol.","Stir in the tomato paste if using. Add the beef stock, bay leaf, and lemon peel. Return the osso buco to the pot, marrow-side up. The liquid should come about halfway up the meat.","Cover with a lid slightly ajar and cook very gently at a bare simmer, or in a 160 °C oven, for 2½–3 hours. Turn the shanks once during cooking. The meat should be tender but still holding together.","Carefully remove the osso buco and discard the bay leaf and lemon peel. Reduce the sauce slightly if needed until glossy. Adjust seasoning.","Mix the gremolata ingredients just before serving. Spoon the sauce over the osso buco and finish with a generous sprinkle of gremolata."],"notes":["Traditionally served with risotto alla Milanese. Also excellent with creamy polenta or buttery mashed potatoes.","Beef osso buco requires a longer cooking time than veal. Keep the simmer gentle to avoid dryness. The gremolata is essential and should always be added raw at the end."]},"creamy-polenta":{"title":"Creamy Mash-Style Polenta","sub":"Soft, spoonable polenta with a texture similar to loose mashed potatoes. Not meant to be set or sliced.","src":"Osso Bucco alla Milanese (Beef).docx","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"u":"cup","n":"polenta","note":"coarse cornmeal or instant"},{"q":[4,5],"u":"cups","n":"liquid","note":"water, milk, or half-and-half"},{"q":1,"u":"tsp","n":"salt"},{"q":[30,50],"u":"g","n":"butter"},{"q":[0.5,0.75],"u":"cup","n":"Parmigiano-Reggiano, finely grated"},{"n":"Optional: splash of cream, olive oil, white pepper"}]}],"steps":["Bring 4 cups of liquid and the salt to a gentle boil in a saucepan.","Lower heat to medium-low. Slowly pour in the polenta while whisking constantly to avoid lumps.","Cook gently, stirring every 30–60 seconds. Regular polenta takes 30–40 minutes; instant polenta takes 5–10 minutes. Add more liquid as needed to keep it soft and flowing.","Remove from heat. Stir in butter, Parmesan, and optional cream or olive oil.","Adjust texture: add hot liquid if too thick, or cook a few minutes longer if too thin."],"notes":["Texture target: softer than risotto, glossy, and spoonable. If it firms up while resting, loosen it with hot water or milk."]},"miso-noodle-soup":{"title":"Miso Noodle Soup","sub":"With chilli minced beef, tomato-chilli salad and pak choi noodles.","src":"Rezepte.xlsx — Miso Noodle Soup","serves":2,"unit":"servings","groups":[{"n":"Minced beef","i":[{"q":500,"u":"g","n":"minced beef"},{"q":0.5,"n":"onion"},{"q":[2,3],"u":"cloves","n":"garlic"},{"q":1,"u":"tsp","n":"ginger"},{"q":1,"u":"tbsp","n":"red curry paste"},{"q":1,"u":"tbsp","n":"tomato paste"}]},{"n":"Soup","i":[{"q":100,"u":"g","n":"light miso paste"},{"q":6,"u":"dl","n":"water"},{"q":3,"u":"dl","n":"coconut milk"},{"q":2,"u":"stalks","n":"lemon grass"},{"q":1,"u":"tsp","n":"ginger"},{"q":0.5,"n":"lemon"}]},{"n":"Noodles","i":[{"q":250,"u":"g","n":"Asian noodles"},{"q":2,"n":"baby pak choi"}]},{"n":"Salad","i":[{"q":2,"n":"tomatoes"},{"q":1,"n":"spring onion"},{"q":2,"n":"red chili"},{"q":0.5,"n":"lemon"}]},{"n":"Topping","i":[{"q":8,"u":"twigs","n":"coriander"},{"q":1,"u":"tbsp","n":"sesame"}]}],"steps":["We start with the minced beef. First, finely dice the half onion, and press the garlic and the ginger. Sauté with a bit of canola oil. Put aside. Now start frying the minced beef with high heat; if necessary, add a bit more oil. Fry until evenly brown, then add the tomato paste and curry paste and mix well. Fry briefly, before adding back sautéed onion, garlic and ginger. Deglaze with about a cup of water. Cook until the water has evaporated; meanwhile, season with soy sauce and salt as appropriate. Put aside, keep warm if possible.","Next to the soup. Add miso paste, water, coconut milk, lemon grass, ginger (pressed) and juice of half the lemon to a pan. Bring to boil, then simmer for about 20 minutes. When done simmering, pour through a fine strainer into another pot or a bowl to get rid of the seasonings.","While simmering, heat up a pot of water. Wash the pak choi and cut into ~8 mm stripes. When the water is boiling, add a pinch of salt, as well as the noodles. Cook the noodles as indicated on the package, generally around 8–10 mins. About 2–3 mins before end of cooking time, add the pak choi as well. When done, strain all of it, put it in a bowl and set aside, keep warm if possible.","Also while simmering the soup, prepare the salad. Chop the tomato into pieces, finely chop the spring onion and the chili into slices. Add all of it with the juice of half a lemon to a bowl and season with vinegar (e.g. apple vinegar), oyster sauce, sesame oil as appropriate. Put aside. Next, wash the coriander and pull the leaves. Put on a plate or in a small bowl separately and put aside.","To assemble the soup, first put noodles / pak choi in each person's bowl. Next add minced beef on top. Now add a couple of scoops of the soup, just as much that some noodles and the beef still come out on top. Next, add some salad on top and top with the toppings (i.e. coriander leaves and some sesame)."]},"miso-noodle-soup-heiko":{"title":"Asia-Suppe mit Chili-Hackfleisch (Heiko@home)","lang":"de","sub":"Kokos-Miso-Suppe mit Chili-Hackfleisch, Asia-Nudeln und Salat.","src":"Miso Soup.pdf","serves":4,"unit":"Schüsseln","groups":[{"n":"Kokos-Miso-Suppe","i":[{"q":100,"u":"g","n":"Misopaste, hell"},{"q":600,"u":"ml","n":"Wasser"},{"q":300,"u":"g","n":"Kokosnussmilch"},{"q":3,"u":"Stk.","n":"Limonenblätter"},{"q":2,"u":"Stk.","n":"Zitronengras, gebrochen","note":"das Innere für den Salat verwenden"},{"q":1,"u":"TL","n":"Ingwer, grob geschnitten"},{"n":"Zitronensaft"}]},{"n":"Chili-Hackfleisch","i":[{"q":250,"u":"g","n":"Rindshackfleisch"},{"q":250,"u":"g","n":"Schweinehackfleisch"},{"n":"Sonnenblumenöl"},{"q":1,"u":"EL","n":"Schalotten, feingeschnitten"},{"q":1,"u":"TL","n":"Knoblauch, feingeschnitten"},{"q":1,"u":"TL","n":"Ingwer, feingeschnitten"},{"q":[1,2],"u":"TL","n":"Currypaste, rot"},{"q":1,"u":"EL","n":"Tomatenmark"},{"n":"Wasser, Sojasauce"},{"n":"Asia-Wokspice (Ingo Holland), Himalaya-Salz"}]},{"n":"Asia-Nudeln","i":[{"q":250,"u":"g","n":"Asia-Nudeln, nach Wahl"},{"q":3,"u":"Stk.","n":"Pak Choi, Mini, in ca. 8 mm breite Streifen geschnitten"},{"q":100,"u":"g","n":"Shiitake-Pilze, ohne Strunk, in feine Scheiben geschnitten"}]},{"n":"Salat","i":[{"q":150,"u":"g","n":"Kirschtomaten, geviertelt"},{"q":1,"u":"Stk.","n":"Frühlingslauch, in feine Scheiben geschnitten"},{"q":2,"u":"Stk.","n":"Zitronengras, das Innere in feine Scheiben geschnitten"},{"q":1,"u":"Stk.","n":"Myoga, in feine Streifen geschnitten"},{"q":1,"u":"Stk.","n":"Peperoncini, in feine Streifen geschnitten"},{"n":"Limone (Saft), Sushi-Essig (Mizkan), Fishsauce, Sesamöl"}]},{"n":"Weitere Zutaten","i":[{"q":0.5,"u":"Bd.","n":"Minze, gezupft"},{"q":1,"u":"Bd.","n":"Koriander, gezupft"},{"q":1,"u":"Bd.","n":"Thai-Basilikum, gezupft"},{"n":"Sesamöl, Sesam geröstet, Togarashi-Gewürzmischung, Limonenabrieb"}]}],"steps":["Suppe: Alle Zutaten miteinander aufkochen und ca. 20 Minuten ziehen lassen. Passieren.","Chili-Hackfleisch: Die Schalotten, den Knoblauch und den Ingwer langsam und gleichmässig in etwas Sonnenblumenöl anschwitzen. Anschliessend herausnehmen und das Hackfleisch hineingeben. Dieses gleichmässig unter höherer Hitzezufuhr anbraten. Tomatenmark und Chilipaste dazugeben und kurz mitrösten. Die Schalotten-Knoblauch-Ingwer-Mischung wieder zu dem Hackfleisch geben und alles mit etwas Wasser ablöschen. Das Fleisch garkochen und die Flüssigkeit fast verkochen lassen. Abschmecken mit etwas Sojasauce, Asia-Wokspice und eventuell etwas Salz.","Asia-Nudeln: Die Asia-Nudeln in ausreichend leicht gesalzenem Wasser garkochen. Kurz vor Ende der Garzeit die Shiitake-Pilze und den Pak Choi dazugeben. Nudel-Gemüse-Mischung auf ein Sieb giessen.","Salat: Alle Zutaten mischen, mit Sushi-Essig, Fishsauce, Limonensaft und Sesamöl vorsichtig abschmecken.","Anrichten: Die Nudel-Gemüse-Mischung auf vier Schüsseln verteilen. Chili-Hackfleisch obenauf geben. Die heisse Suppe in die Schüsseln giessen. Salat obenauf das Chili-Hackfleisch setzen und mit den restlichen Zutaten garnieren, bzw. vorsichtig beträufeln und würzen."]},"tomato-beef-stew":{"title":"番茄牛腩 — Tomato Braised Beef Brisket","sub":"Hearty and comforting: tender beef simmered in a flavourful tomato-based broth with ginger and spices. Perfect with rice or noodles.","src":"Tomato and beef stew.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":500,"u":"g","n":"beef brisket (牛腩), cut into chunks"},{"q":[2,3],"u":"large","n":"tomatoes, chopped","note":"you can also use canned tomatoes"},{"q":1,"u":"large","n":"potato, peeled and chopped","note":"optional"},{"q":1,"n":"onion, chopped"},{"q":[2,3],"u":"slices","n":"ginger"},{"q":[2,3],"u":"cloves","n":"garlic, minced"},{"q":1,"u":"tbsp","n":"tomato paste","note":"optional, for extra richness"},{"q":2,"u":"tbsp","n":"soy sauce"},{"q":1,"u":"tbsp","n":"oyster sauce"},{"q":1,"u":"tbsp","n":"Shaoxing wine (绍兴酒)","note":"or cooking wine"},{"q":1,"u":"tsp","n":"sugar"},{"n":"Salt and pepper to taste"},{"q":[4,5],"u":"cups","n":"water or beef broth"},{"q":[1,2],"n":"star anise","note":"optional"},{"n":"Fresh cilantro for garnish (optional)"}]}],"steps":["Blanch the beef. Bring a pot of water to boil, then add the beef brisket chunks. Boil for about 3–5 minutes to remove impurities and excess fat. Drain and rinse the beef under cold water. Set aside.","Sauté the aromatics. Heat some oil in a large pot or wok over medium heat. Add the ginger, garlic, and onions. Stir-fry until fragrant (about 2–3 minutes). Add the chopped tomatoes and stir-fry until they start to break down and release their juices (about 5 minutes). If you want a richer tomato flavor, add 1 tablespoon of tomato paste at this point and stir well.","Braise the beef. Add the blanched beef brisket to the pot. Pour in soy sauce, oyster sauce, Shaoxing wine, and sugar. Stir to coat the beef with the seasonings. Add enough water or beef broth to cover the beef completely (around 4–5 cups). If using, add the star anise for extra flavor. Bring to a boil, then lower the heat to a gentle simmer. Cover the pot and let it simmer for about 1.5 to 2 hours, or until the beef is tender.","Add vegetables. If you're adding potatoes or other vegetables like carrots, add them to the pot during the last 30 minutes of cooking. Make sure to cover the pot again and let the vegetables cook until they're tender.","Season and serve. Taste the broth and adjust the seasoning with salt and pepper as needed. Once the beef and vegetables are tender, the dish is ready. Ladle into bowls and garnish with fresh cilantro if desired."],"notes":["For a more intense tomato flavor, you can blend some of the cooked tomatoes before adding them back to the pot.","The longer you braise the beef, the more tender and flavorful it will become.","This dish tastes even better the next day as the flavors meld together.","Serve with steamed rice, noodles, or even a crusty bread to soak up the rich broth."]},"mushroom-daylily-soup":{"title":"杂菌黄花菜瘦肉汤 — Mixed Mushroom and Dried Daylily Soup with Lean Pork","sub":"A nourishing, light soup combining earthy mushrooms with dried daylily flowers (golden needles) and lean pork.","src":"Mixed mushroom and dried daylily soup with lean pork.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":200,"u":"g","n":"lean pork, thinly sliced"},{"q":10,"u":"g","n":"dried daylily flowers (黄花菜)","note":"rehydrated in warm water for 20–30 minutes"},{"q":150,"u":"g","n":"mixed mushrooms","note":"shiitake, oyster, enoki, or button — cleaned and sliced"},{"q":1,"u":"piece","n":"ginger, sliced"},{"q":[2,3],"n":"dried red dates","note":"optional, for sweetness"},{"q":1.5,"u":"litres","n":"water or chicken stock"},{"n":"Salt, to taste"},{"n":"White pepper, to taste"},{"n":"A handful of goji berries (optional, for extra nutrition)"}]}],"steps":["Prepare ingredients. Rinse the dried daylily flowers after rehydrating them and remove any hard ends. Prepare the mushrooms by cleaning and slicing them as needed. Slice the lean pork into thin pieces. For extra tenderness, marinate with a pinch of salt and a little cornstarch (optional).","Make the soup. Bring the water or chicken stock to a boil in a pot. Add the ginger slices, dried red dates, and goji berries (if using). Let them simmer for a few minutes to release their flavors. Add the sliced mushrooms and rehydrated daylily flowers to the pot. Let them simmer for about 10 minutes.","Add the pork. Add the sliced lean pork to the pot. Stir to separate the pieces, and allow the pork to cook for 5–10 minutes until just tender. Season the soup with salt and white pepper to taste.","Serve. Ladle the soup into bowls and serve hot. This soup pairs well with steamed rice or as part of a multi-dish Chinese meal."]},"shrimp-ball-winter-melon-soup":{"title":"虾滑冬瓜汤 — Shrimp Ball and Winter Melon Soup","sub":"A light and delicious Chinese soup.","src":"Shrimp ball and winter melon soup.docx","serves":4,"unit":"servings","groups":[{"n":"Shrimp balls (虾滑)","i":[{"q":300,"u":"g","n":"shrimp","note":"peeled and deveined"},{"q":1,"n":"egg white","note":"optional, for tenderness"},{"q":1,"u":"tbsp","n":"cornstarch"},{"q":1,"u":"slice","n":"ginger","note":"grated for juice"},{"q":1,"u":"tsp","n":"Shaoxing wine"},{"q":0.5,"u":"tsp","n":"salt"},{"n":"White pepper: a pinch"}]},{"n":"Soup","i":[{"q":300,"u":"g","n":"winter melon","note":"peeled, seeds removed, and thinly sliced"},{"q":1,"u":"litre","n":"chicken or vegetable stock"},{"q":[3,4],"u":"slices","n":"ginger"},{"q":2,"n":"scallions","note":"cut into 1-inch pieces"},{"n":"Salt, to taste"},{"n":"White pepper, to taste"},{"q":1,"u":"tsp","n":"sesame oil","note":"optional"},{"n":"Cilantro, for garnish (optional)"}]}],"steps":["Prepare the shrimp balls (虾滑). Place the shrimp in a food processor and blend until smooth, or chop finely with a knife for a more textured result. In a mixing bowl, combine the shrimp paste with egg white, cornstarch, grated ginger juice, Shaoxing wine, salt, and white pepper. Stir the mixture in one direction until sticky and well combined. Refrigerate for 15–20 minutes.","Prepare the winter melon. Peel the winter melon, remove the seeds, and slice it into thin pieces (around 5 mm thick).","Cook the soup. Bring the chicken or vegetable stock to a boil in a pot. Add the ginger slices and scallions to the boiling stock. Simmer for 2–3 minutes to infuse the flavors. Reduce the heat to medium and add the winter melon slices. Cook for 5–7 minutes, or until the melon turns translucent.","Form and cook the shrimp balls. Use a spoon to scoop the shrimp paste into small balls. Alternatively, squeeze the paste through your palm and scoop it with a spoon for smoother shapes. Gently drop the shrimp balls into the simmering soup. They will float to the surface when cooked (around 3–4 minutes).","Season and serve. Taste the soup and season with salt and white pepper as needed. Drizzle with sesame oil for a fragrant finish. Garnish with cilantro and serve hot."]},"braised-pork-belly":{"title":"Braised Pork Belly","src":"Braised pork belly.docx","serves":4,"unit":"people","groups":[{"i":[{"q":1.5,"u":"kg","n":"pork belly"},{"q":1.5,"u":"dl","n":"Haday seafood flavored soy sauce"},{"q":1,"u":"tablespoon","n":"Haday superior dark soy sauce"},{"q":2,"u":"pieces","n":"garlic cloves"},{"n":"Sichuan pepper, star anise, sugar, and cinnamon for seasoning to taste"}]}],"steps":["Remove bones and skin from pork belly and cut into slices that are ca. 0.5 cm thick.","Bring pot of water (ca. 3 L) to boil. Put in pork belly and leave in there for 10–12 min, until color has turned to white. Take pork belly out and pour water down the sink.","Bring another pot of water to boil in the meanwhile (ca. 3 L) and chop the garlic cloves. When it boils, put in pork belly and reduce heat to medium.","Add soy sauces, ca. 20–25 sichuan pepper corns, 1 star anise, 2–3 pinches of sugar, and a little bit of cinnamon, and the garlic cloves.","Simmer for 3–4 h until meat is really tender. Add more water / flavorings if necessary.","Serve with a bowl of (fried egg) rice."]},"kuerbiscremesuppe":{"title":"Kürbiscremesuppe II","lang":"de","src":"Kürbiscremesuppe II.xls","serves":4,"unit":"Personen","groups":[{"i":[{"q":1,"u":"Essl.","n":"Butter"},{"q":1,"n":"Zwiebel, gehackt"},{"q":[2,3],"n":"Tomaten"},{"q":450,"u":"g","n":"Hokkaido-Kürbis (oranger Knirps)"},{"q":1,"n":"Karotte, in Scheiben"},{"q":1,"u":"lt.","n":"Hühner-Bouillon"},{"n":"Curry mild"},{"q":1.5,"u":"dl","n":"Rahm"},{"q":2,"u":"Teel.","n":"Mehl"}]}],"steps":["Butter erhitzen, Zwiebel andämpfen.","Tomaten: Stielansatz herausschneiden, übers Kreuz einschneiden, kurz in kochendes Wasser tauchen, häuten und grob würfeln. Zu den Zwiebeln hinzugeben und etwas einkochen lassen.","Kürbis entkernen, mit Schale in Würfel schneiden (auch gut ohne Schale). Karotte in Scheiben schneiden. Beides in die Pfanne geben.","Hühner-Bouillon dazugiessen. Mit mildem Curry würzen.","Suppe ca. 20 Min. kochen lassen, dann pürieren.","Rahm und Mehl verrühren, zur Suppe geben, 5 Min. fertig köcheln. En Guete!"]},"californian-leberkaese":{"title":"Californian Leberkäse","sub":"Start preparing about 2 h before desired eating time. Effective preparation time is around 30–45 mins.","src":"Rezepte.xlsx — Californian Leberkaese","serves":4,"unit":"servings","groups":[{"i":[{"q":0.5,"n":"capsicum (red)"},{"q":1.5,"u":"tbsp","n":"parsley"},{"q":1,"n":"egg","note":"reduced to 1 from 2 eggs per ½ kg of Brät to try to reduce juice after baking"},{"q":1,"u":"tbsp","n":"paprika (sweet, red)"},{"q":0.5,"u":"kg","n":"Leberkäse Brät"},{"q":200,"u":"g","n":"ham (diced)"},{"q":4,"n":"pickles (european/dill)"},{"q":0.5,"u":"can","n":"corn"}]}],"steps":["Chop capsicum and parsley. Lightly sauté with some butter. Put aside in a bowl and let cool down. Add eggs and paprika to a separate bowl, and add black pepper to taste. Mix well.","Once cooled, add capsicum to the bowl with egg-spice mixture. Chop pickles (and ham, if not bought already chopped) and add to the bowl. Add corn and Leberkäse Brät to the bowl. Mix all of it very well. Add mixture to an aluminium form of appropriate size, cover with plastic wrap and let rest in the fridge for 30 mins.","Once the 30 mins are over, remove plastic wrap, and bake in the oven at 200 °C for about 40 mins. After that, take out of the oven and drain any liquid that assembled in the form (if any). Bake for another 10 min.","Once done, take out of the oven and let it rest in the aluminium for 5–10 min."],"notes":["Bake at a lower temperature like 170 degrees for a longer time such as an hour to avoid the juice."]},"mediterraner-fleischkaese":{"title":"Mediterraner Fleischkäse","lang":"de","sub":"Mit Ofengemüse aus Kichererbsen, Zucchini und Aubergine.","src":"Mediterraner Fleischkaese.JPG","transcribed":true,"serves":4,"unit":"Personen","meta":[{"k":"Vor- und zubereiten","v":"ca. 25 Min."},{"k":"Backen","v":"ca. 1 Std."}],"groups":[{"n":"Fleischkäse","i":[{"q":400,"u":"g","n":"Brät"},{"q":1,"n":"rote Peperoni, in Würfeli"},{"q":0.25,"u":"TL","n":"Cayennepfeffer"},{"q":4,"u":"Zweiglein","n":"Rosmarin"}]},{"n":"Gemüse","i":[{"q":1,"u":"Dose","n":"Kichererbsen (ca. 400 g)","note":"abgespült, abgetropft"},{"q":2,"n":"Zucchini, in Stücken"},{"q":1,"n":"Aubergine, in Stücken"},{"q":1,"n":"Zwiebel, fein gehackt"},{"q":4,"u":"EL","n":"geriebener Parmesan"},{"q":1,"u":"EL","n":"Rosmarin, fein geschnitten"},{"q":2,"u":"EL","n":"Olivenöl"},{"q":0.75,"u":"TL","n":"Salz"},{"n":"wenig Pfeffer"},{"q":2,"u":"EL","n":"Aceto balsamico"}]}],"steps":["Brät, Peperoni und Cayennepfeffer mischen, in die vorbereitete Cakeform geben, glatt streichen. Rosmarinzweiglein hineinstecken, Form auf ein Backblech stellen.","Kichererbsen in die vorbereitete weite Form geben, diese neben die Cakeform auf das Backblech stellen. Zucchini und alle Zutaten bis und mit Pfeffer mischen, auf den Kichererbsen verteilen.","Backen: ca. 1 Std. in der Mitte des auf 180 Grad vorgeheizten Ofens. Herausnehmen, Aceto über das Gemüse träufeln, mischen. Fleischkäse aus der Form nehmen, in Tranchen schneiden, mit dem Gemüse anrichten."],"notes":["Für eine Cakeform von ca. 20 cm, mit Backpapier ausgelegt, und eine weite ofenfeste Form von ca. 2 Litern, gefettet.","Dazu passt: Senf.","Portion: 473 kcal, F 35 g, Kh 19 g, E 22 g.","Transkribiert aus einem Foto einer Kochbuchseite — bitte gegen das Original prüfen."]},"reiskugeln":{"title":"Reiskugeln","lang":"de","sub":"Reiskugeln mit Schinken und Parmesan — Mengen für 8 bzw. 12 Kugeln.","src":"Reiskugeln.xls","serves":8,"unit":"Kugeln","groups":[{"i":[{"q":1,"n":"Zwiebel"},{"q":1,"u":"Essl.","n":"Oel"},{"q":200,"u":"g","n":"Risottoreis"},{"q":4,"u":"dl","n":"Bouillon"},{"q":1,"u":"dl","n":"Weisswein"},{"q":70,"u":"g","n":"Parmesan, gerieben"},{"q":0.667,"n":"Eigelb"},{"q":60,"u":"g","n":"Schinkenwürfeli"},{"n":"Zum Panieren: Ei (1 Ei + 1 Eiweiss) und Paniermehl"},{"n":"Öl zum Braten"}]}],"steps":["Zwiebel hacken und andünsten, Reis dazugeben, mit Flüssigkeit ablöschen. Reis 20 Min. köcheln lassen.","Parmesan untermischen, auskühlen lassen.","Eigelb und Schinkenwürfeli dazugeben, gut vermischen.","Aus der Reis-Masse 8 Kugeln formen.","Die Kugeln panieren, jedoch nur Ei (1 Ei + 1 Eiweiss) und Paniermehl verwenden.","Die Reiskugeln werden in einer Bratpfanne (ca. 20 Min.) mit genügend Öl rundherum goldgelb angebraten.","Zu den Reiskugeln einen feinen Salat servieren. En Guete!"],"notes":["Originalrezept gibt auch Mengen für 12 Kugeln an: 1 Zwiebel, 1 Essl. Oel, 300 g Risottoreis, 6 dl Bouillon, 1.5 dl Weisswein, 110 g Parmesan, 1 Eigelb, 120 g Schinkenwürfeli."]},"party-filet":{"title":"Party-Filet","lang":"de","sub":"Betty Bossi — ein Klassiker unter den Schweinsfilet-Rezepten: schnell gemacht und mit einer raffiniert einfachen Sauce.","src":"Party-Filet.pdf","transcribed":true,"serves":4,"unit":"Personen","meta":[{"k":"Vor- und zubereiten","v":"ca. 20 Min."},{"k":"Braten im Ofen","v":"ca. 25 Min."}],"groups":[{"n":"Fleisch","i":[{"q":500,"u":"g","n":"Schweinsfilet"},{"q":0.5,"u":"TL","n":"Paprika"},{"q":0.5,"u":"TL","n":"Salz"},{"n":"wenig Pfeffer"},{"q":12,"u":"Tranchen","n":"Bratspeck"}]},{"n":"Sauce","i":[{"q":2,"u":"dl","n":"Rahm"},{"q":1.5,"u":"EL","n":"Ketchup"},{"q":1,"u":"EL","n":"Cognac"},{"n":"wenig Pfeffer"}]}],"steps":["Ofen auf 220 Grad vorheizen.","Fleisch in 12 gleich dicke Medaillons schneiden. Medaillons beidseitig mit Paprika, Salz und Pfeffer würzen.","Medaillons mit Speck umwickeln, nebeneinander in die vorbereitete Form stellen.","Braten: ca. 25 Min. in der unteren Hälfte des Ofens.","Rahm steif schlagen, mit Ketchup, Cognac und Pfeffer mischen, auf dem Fleisch verteilen, anrichten."],"notes":["Form: für eine weite ofenfeste Form von ca. 2 Litern, gefettet.","Dazu passen: Nudeln, Trockenreis.","Variante: Statt Schweins- Kalbsfilet verwenden.","Variante: Fleisch zusätzlich mit 1 Zwiebel, fein gerieben, und 1 Knoblauchzehe, gepresst, würzen.","Variante: Je nach Paprikasorte und persönlicher Vorliebe Paprikamenge erhöhen.","Variante: Ketchup oder Cognac weglassen.","Lässt sich vorbereiten: Fleisch einige Stunden im Voraus ofenfertig vorbereiten, zugedeckt im Kühlschrank aufbewahren.","Nährwert pro Portion: 455 kcal, F 34 g, Kh 3 g, E 33 g.","Transkribiert aus einem gescannten PDF — bitte gegen das Original prüfen."]},"crepes-party":{"title":"Crèpes Party","lang":"de","sub":"Omeletten-Teig mit sechs Füllungen. Mengenangaben für 6 Personen (Original gibt auch 8–10 und 12 Personen an).","src":"Crèpes Party.xls","serves":6,"unit":"Personen","groups":[{"n":"Omeletten-Teig","i":[{"q":700,"u":"g","n":"Mehl"},{"q":7,"n":"Eier"},{"q":1.4,"u":"lt.","n":"Milch"},{"n":"Salz"}]},{"n":"Chili con Carne","i":[{"q":300,"u":"g","n":"Rinds-Gehacktes"},{"q":1,"n":"Zwiebel, gehackt"},{"q":1,"n":"Knobli, gehackt"},{"n":"Salz"},{"q":1.5,"u":"dl","n":"Rindsbouillon"},{"q":0.5,"u":"dl","n":"Rotwein"},{"q":0.5,"u":"Essl.","n":"Tomatenpurrée"},{"q":1,"u":"Teel.","n":"Chilipulver"},{"n":"Paprikapulver"},{"q":0.5,"u":"kl. B.","n":"rote Bohnen"}]},{"n":"Pilz-Füllung","i":[{"q":1,"n":"Zwiebel, gehackt"},{"q":1,"n":"Knobli-Z., gehackt"},{"q":2,"u":"B.","n":"Pilzmischung","note":"abspülen und gut abtropfen lassen"},{"q":2,"u":"Essl.","n":"Bratensauce"},{"q":1,"u":"Essl.","n":"Cognac"},{"q":0.5,"u":"dl","n":"Rahm"},{"n":"Wasser (wenig)"},{"n":"Petersilie getr., wenig Pfeffer, Gemüse-B.-Extrakt"}]},{"n":"Gemüse-Füllung","i":[{"q":0.5,"u":"Essl.","n":"Butter"},{"q":1,"n":"Zwiebel, gehackt"},{"q":1,"n":"Knobli-Zehen, gehackt"},{"q":1,"n":"Rüebli, gewürfelt"},{"q":0.5,"n":"Kohlrabi, gewürfelt"},{"q":0.5,"n":"Peperoni gelb, gewürfelt"},{"q":1,"n":"Stangensellerie, gewürfelt"},{"q":0.5,"u":"dl","n":"Gemüse-Bouillon"},{"q":0.75,"u":"dl","n":"Rahm"},{"q":1,"u":"Teel.","n":"Mehl"},{"n":"Gemüse-B.-Extrakt, Pfeffer, ev. wenig Curry"}]},{"n":"Quark-Füllung","i":[{"q":500,"u":"g","n":"Magerquark"},{"q":2,"n":"Eigelb"},{"q":120,"u":"g","n":"Puderzucker"},{"n":"Zitronensaft"}]},{"n":"Weitere Füllungen","i":[{"q":600,"u":"g","n":"Pouletfleisch für Curry-Geschnetzeltes"},{"q":400,"u":"g","n":"Spinat \"fixfertig\" (mit Speck)"},{"n":"Zwetschgen- und/oder Aprikosen-Konfitüre"}]}],"steps":["Omeletten-Teig: alle Zutaten mit der Küchenmaschine (Schwingbesen) 2–3 Min. rühren.","Chili con Carne: Zwiebeln und Knobli anbraten, Gehacktes dazugeben. Mit Salz würzen. Mit Rindsbouillon und Rotwein ablöschen. Tomatenpurrée und Chilipulver dazurühren, mit Paprikapulver würzen. Rote Bohnen beigeben. Gericht 30 Min. zugedeckt leicht kochen lassen.","Pilz-Füllung: Zwiebeln andämpfen, Knobli dazugeben. Pilzmischung (abspülen und gut abtropfen lassen) mitdämpfen. Bratensauce darüber streuen. Mit Cognac ablöschen. Rahm und wenig Wasser dazugeben. Mit Petersilie, wenig Pfeffer und Gemüse-B.-Extrakt würzen.","Gemüse-Füllung: Butter erhitzen, Zwiebel, Knobli, Rüebli, Kohlrabi, Peperoni und Stangensellerie andämpfen. Mit Gemüse-Bouillon ablöschen, ca. 15 Min. köcheln lassen. Rahm und Mehl vermischen, beigeben. Mit Gemüse-B.-Extrakt, Pfeffer und ev. wenig Curry würzen.","Quark-Füllung: alle Zutaten vermischen.","Übrige Füllungen: Curry-Geschnetzeltes aus Pouletfleisch zubereiten; Spinat \"fixfertig\" (mit Speck) erwärmen; Konfitüre bereitstellen."],"notes":["Original-Mengen für 8–10 Personen: 900 g Mehl, 9 Eier, 1.8 lt. Milch; für 12 Personen: 1000 g Mehl, 10 Eier, 2.0 lt. Milch."]},"coq-au-vin":{"title":"Coq au Vin","lang":"de","src":"Coq au vin.xls","serves":4.5,"unit":"Personen","servesNote":"4–5","groups":[{"i":[{"q":150,"u":"g","n":"Specktranchen"},{"q":1,"n":"Zwiebel, gewürfelt"},{"q":150,"u":"g","n":"kl. Champignons"},{"q":1,"n":"Knobli, gepresst"},{"q":700,"u":"g","n":"Poulet-Innenfilets"},{"n":"Salz, Pfeffer"},{"q":2,"u":"dl","n":"Rotwein"},{"q":2,"u":"dl","n":"Hühnerbouillon"},{"q":0.5,"u":"dl","n":"Rotwein"},{"q":1,"u":"Teel.","n":"Mehl"}]}],"steps":["Specktranchen in feine Streifen schneiden und in einer weiten Bratpfanne knusprig anbraten, herausnehmen.","Zwiebel andämpfen, herausnehmen.","Champignons halbieren, Knobli pressen, alles beigeben, andämpfen, herausnehmen.","Poulet-Innenfilets würzen (Salz, Pfeffer), portionenweise anbraten.","Fleischportionen mit 2 dl Rotwein ablöschen, Fleisch zu den Zwiebeln geben (mit Fond). Alles wieder in die Bratpfanne geben.","Hühnerbouillon dazugiessen, aufkochen.","0.5 dl Rotwein mit 1 Teel. Mehl mit einem Schwingbesen gut verrühren, dazugeben, ev. nachwürzen.","15 Min. auf kleiner Stufe zugedeckt schmoren lassen."],"notes":["Dazu passt: Wildreis, Kartoffelstock, Nudeln.","Falls Pouletschenkel verwendet werden: Unter- und Oberschenkel trennen, enthäuten, würzen, ca. 35 Min. schmoren lassen."]},"shakshouka":{"title":"Shakshouka","src":"Rezepte.xlsx — Shakshouka","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"n":"green capsicum"},{"q":1,"n":"red capsicum"},{"q":3,"n":"tomatoes"},{"q":1,"n":"brown onion"},{"q":2,"u":"cloves","n":"garlic"},{"q":4,"n":"eggs"},{"q":400,"u":"g","n":"tomato puree"},{"n":"Sweet paprika, oregano, chicken salt, pepper, chili flakes — to taste"},{"n":"Fresh parsley, to finish"},{"n":"White bread, to serve"}]}],"steps":["Chop capsicum, onion and garlic clove. Add to a large frying pan with a drizzle of olive oil and cook, stirring frequently, until the vegetables have softened — about 10 minutes. Add spices — sweet paprika, oregano, chicken salt, pepper, chili flakes — to taste.","In the meantime, chop the tomatoes. Add after vegetables have softened, together with tomato puree (or tomato sauce). Simmer until the tomato mixture begins to reduce — about another 10 minutes. Taste and adjust the seasoning to your liking.","After 10 minutes, using a wooden spoon, make 4 indentations in the tomato mixture (make them spaced out). Gently crack an egg into each indentation. Cover the pan, and cook on low–medium until the egg whites are set.","Thereafter, uncover the pan, and add fresh parsley on top. Serve with white bread."]},"falafel":{"title":"Falafel","sub":"The Mediterranean Dish — authentic falafel made with dried chickpeas, fresh herbs, and spices.","src":"Falafel.pdf","transcribed":true,"serves":24,"unit":"patties","meta":[{"k":"Prep","v":"30 min"},{"k":"Cook","v":"20 min"}],"groups":[{"n":"Falafel","i":[{"q":2,"u":"cups","n":"dried chickpeas","note":"do NOT use canned or cooked chickpeas"},{"q":0.5,"u":"tsp","n":"baking soda"},{"q":1,"u":"cup","n":"fresh parsley leaves, stems removed"},{"q":0.75,"u":"cup","n":"fresh cilantro leaves, stems removed"},{"q":0.5,"u":"cup","n":"fresh dill, stems removed"},{"q":1,"u":"small","n":"onion, quartered"},{"q":[7,8],"u":"cloves","n":"garlic, peeled"},{"n":"Salt to taste"},{"q":1,"u":"tbsp","n":"ground black pepper"},{"q":1,"u":"tbsp","n":"ground cumin"},{"q":1,"u":"tbsp","n":"ground coriander"},{"q":1,"u":"tsp","n":"cayenne pepper","note":"optional"},{"q":1,"u":"tsp","n":"baking powder"},{"q":2,"u":"tbsp","n":"toasted sesame seeds"},{"n":"Oil for frying"}]},{"n":"Sauce & fixings (optional)","i":[{"n":"Tahini sauce"},{"n":"Pita pockets"},{"n":"English cucumbers, chopped or diced"},{"n":"Tomatoes, chopped or diced"},{"n":"Baby arugula"},{"n":"Pickles"}]}],"steps":["(One day in advance) Place the dried chickpeas and baking soda in a large bowl filled with water to cover the chickpeas by at least 2 inches. Soak overnight for 18 hours (longer if the chickpeas are still too hard). When ready, drain the chickpeas completely and pat them dry.","[Step 2 of the source recipe — combining the drained chickpeas, herbs, onion, garlic and spices in a food processor — was lost in the page break of the saved PDF. Please check the original before cooking.]","Transfer the falafel mixture to a container and cover tightly. Refrigerate for at least 1 hour or (up to one whole night) until ready to cook.","Just before frying, add the baking powder and sesame seeds to the falafel mixture and stir with a spoon.","Scoop tablespoonfuls of the falafel mixture and form into patties (1/2 inch in thickness each). It helps to have wet hands as you form the patties.","Fill a medium saucepan 3 inches up with oil. Heat the oil on medium-high until it bubbles softly. Carefully drop the falafel patties in the oil, let them fry for about 3 to 5 minutes or so until crispy and medium brown on the outside. Avoid crowding the falafel in the saucepan, fry them in batches if necessary.","Place the fried falafel patties in a colander or plate lined with paper towels to drain.","Serve falafel hot next to other small plates; or assemble the falafel patties in pita bread with tahini or hummus, arugula, tomato and cucumbers."],"notes":["Cook's tip: you need to start with dry chickpeas, do not use canned chickpeas here. Begin soaking the chickpeas overnight, allow up to 24 hours.","Variations: some versions call for flour or eggs. You can add 1 to 1½ tbsp of flour to the falafel mix or 1 egg. The author used neither and the mixture stayed well together.","Pro tip for frying: you want a deep golden brown colour on the outside and the patties fully done inside. Your frying oil needs to be at 375 °F.","Baked falafel option: bake the patties in a 350 °F heated oven for about 15–20 minutes, turning them over midway. Use a lightly oiled sheet pan and brush the patties with extra virgin olive oil before baking.","Make-ahead: prepare the mixture and divide into patties (up to step 6). Freeze on a parchment-lined sheet; once hard, transfer to a freezer bag. They keep well for a month or so. Fry or bake from frozen.","Transcribed from a scanned PDF — one instruction step was clipped by the page break. Please verify against the original."]},"poulet-gulasch":{"title":"Poulet Gulasch","lang":"de","src":"Poulet Gulasch.xls","serves":4,"unit":"Personen","groups":[{"i":[{"q":1.5,"u":"dl","n":"Rapsöl / Sonnenblumenöl"},{"q":400,"u":"g","n":"Zwiebeln, gehackt"},{"q":1,"n":"Peperoni, in Streifen"},{"q":1,"u":"geh. Essl.","n":"Paprikapulver"},{"n":"Cayennepfeffer"},{"q":0.333,"u":"dl","n":"Wasser"},{"q":1,"u":"kg","n":"Poulet (Schenkel und Flügeli)","note":"Alternative: 800 g – 1 kg Voressen-Fleisch (Schulter), Schmorfleisch, Ragout"},{"q":2,"n":"Knobli-Zehen, gepresst"},{"q":1,"n":"Tomate, gewürfelt"},{"q":1,"u":"Schnitz","n":"Sellerie"},{"q":1,"n":"Rüebli"},{"n":"Salz"},{"n":"genügend Wasser"},{"q":2,"u":"dl","n":"Rahm"}]}],"steps":["Öl in der Pfanne erwärmen. Zwiebeln ca. 10 Min. andämpfen — Zwiebeln müssen hell bleiben, ja nicht braun werden lassen.","Peperoni dazugeben, 10 Min. weiterdämpfen. Pfanne vom Herd nehmen.","Paprikapulver und Cayennepfeffer untermischen. Wasser dazugeben.","Poulet dazugeben, Pfanne wieder auf den Herd stellen, immer wieder rühren, damit nichts anbrennt, bis das Fleisch heiss ist.","Knobli-Zehen, Tomate, Sellerie und Rüebli dazugeben, immer wieder umrühren bis das Fleisch Wasser gezogen hat. Mit Salz würzen.","Genügend Wasser dazugeben, bis alles knapp bedeckt ist.","Gulasch ca. 1 Std. köcheln lassen (dabei immer wieder umrühren). Mit Voressen-Fleisch ca. 1.5 h.","Rahm vor dem Servieren dazugeben."]},"gefuellte-peperoni":{"title":"Gefüllte Peperoni / Krautwickel","lang":"de","src":"Gefüllte Peperoni.xls","serves":4,"unit":"Personen","groups":[{"n":"Füllung","i":[{"q":2,"n":"Zwiebel, angedämpft"},{"q":300,"u":"g","n":"Reis","note":"mit 3 dl Wasser gekocht"},{"q":600,"u":"g","n":"Gehacktes Schweinefleisch"},{"q":1,"n":"Knobli-Zehe, gepresst"},{"q":1,"n":"Ei"},{"q":0.5,"u":"dl","n":"Wasser"},{"n":"Salz, Pfeffer"}]},{"n":"Gefäss","i":[{"q":4,"n":"Peperoni, weisse"},{"n":"oder: 1 Wirz / Kohl"}]},{"n":"Sauce","i":[{"n":"Oel"},{"q":2,"n":"Zwiebel"},{"q":2,"n":"Peperoni","note":"nur bei Krautwickel"},{"q":1,"u":"Tube","n":"Tomatenpurée","note":"Thomy-Tomatenpurée, 300 g, 3-fach konzentriert"},{"q":2,"u":"Essl.","n":"Paprikapulver"},{"q":2,"u":"Essl.","n":"Mehl"},{"q":2,"u":"lt.","n":"Wasser (ca.)"},{"q":[3,4],"n":"Knobli-Zehen"},{"q":1,"n":"Würfelzucker"},{"n":"Salz, Pfeffer, Cayenne"}]}],"steps":["Füllung: alle Zutaten sehr gut kneten, evtl. etwas nachwürzen.","Peperoni aushöhlen und waschen, Füllung satt einfüllen. Aus der restlichen Füllung Kugeln formen.","Oder: Ganzen Wirz-/Kohlkopf in Salzwasser ca. 15 Min. kochen, beim Blatt Mittelteil wegschneiden, Päckli machen.","Sauce: Oel erhitzen, Zwiebel andämpfen (bei Krautwickel auch 2 Peperoni).","Tomatenpurée, Paprikapulver und Mehl dazugeben, kurz anschwitzen.","Mit ca. 2 lt. Wasser ablöschen, Sauce aufkochen.","Mit Knobli-Zehen, Würfelzucker, Salz, Pfeffer und Cayenne würzen.","Peperoni oder Krautwickel 1 Std. köcheln lassen."]},"geschnetzeltes-stroganoff":{"title":"Geschnetzeltes Stroganoff","lang":"de","src":"Geschnetzeltes Stroganoff.xls","serves":4,"unit":"Personen","groups":[{"n":"Marinade","i":[{"q":2,"u":"Essl.","n":"Maizena"},{"q":3,"u":"Essl.","n":"Weisswein"},{"q":1,"u":"Essl.","n":"Erdnussöl"},{"n":"Salz, Pfeffer, Season all, Cayenne, Paprikapulver"},{"q":500,"u":"g","n":"Rindsgeschnetzeltes"}]},{"n":"Sauce","i":[{"q":60,"u":"g","n":"Speckwürfeli"},{"q":2,"n":"Zwiebeln, gehackt"},{"q":1,"n":"Knoblizehe, gehackt"},{"q":0.5,"n":"Lauch, in Ringen"},{"q":2,"n":"Tomaten, in Würfel"},{"q":1,"u":"dl","n":"Rotwein"},{"q":1.5,"u":"dl","n":"Wasser"},{"n":"Rindsbouillon"},{"q":1,"u":"Essl.","n":"Tomatenpurée"}]},{"n":"Gemüse & Finish","i":[{"q":200,"u":"g","n":"Champignons, in Scheiben"},{"q":1,"n":"Peperoni, in Streifen"},{"q":0.5,"u":"Bund","n":"Petersilie, gehackt"},{"q":1,"u":"Becher","n":"saurer Halbrahm"}]}],"steps":["Maizena, Weisswein und Erdnussöl in einer Schüssel verrühren. Mit Salz, Pfeffer, Season all, Cayenne und Paprikapulver würzen.","Rindsgeschnetzeltes dazu geben, alles gut vermischen. 1–2 Std. bei Zimmertemperatur oder über Nacht marinieren (dann im Kühlschrank).","Speckwürfeli in einer weiten Bratpfanne anbraten, Zwiebeln und Knoblizehe kurz mitbraten.","Lauch und Tomaten mitdünsten, alles in eine Glasschüssel geben.","Rindsgeschnetzeltes in Portionen heiss anbraten. Jede Portion mit wenig Rotwein ablöschen. Fleischportionen in die Glasschüssel geben, am Schluss alles wieder in die Bratpfanne retour.","Wasser, Rindsbouillon und Tomatenpurée dazugeben, alles vermischen. Sauce probieren, ev. nachwürzen.","Geschnetzeltes 30 Min. zugedeckt köcheln (auf Stufe 2–3).","Champignons in der Bratpfanne andünsten, mit den Peperoni zum Fleisch geben.","Geschnetzeltes weitere 10–20 Min. zugedeckt fertig köcheln.","Petersilie und sauren Halbrahm am Schluss dazu geben."]},"chicken-paprikash":{"title":"Chicken Paprikash","sub":"Hungarian-style braised chicken in a paprika-sour cream sauce. One pan, ~40 minutes, great reheated for leftovers.","src":"Chicken Paprikash.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":800,"u":"g","n":"boneless, skinless chicken thighs"},{"q":1,"u":"tsp","n":"salt"},{"q":0.5,"u":"tsp","n":"black pepper"},{"q":2,"u":"tbsp","n":"vegetable oil"},{"q":1,"u":"large","n":"onion, finely diced"},{"q":3,"u":"cloves","n":"garlic, minced"},{"q":1,"n":"red capsicum, diced"},{"q":3,"u":"tbsp","n":"sweet Hungarian paprika"},{"q":1,"u":"tbsp","n":"tomato paste"},{"q":500,"u":"ml","n":"chicken stock"},{"q":150,"u":"g","n":"sour cream"},{"q":1,"u":"tbsp","n":"plain flour"},{"q":300,"u":"g","n":"egg noodles or rice, to serve"}]}],"steps":["Prep and season chicken: cut chicken thighs into large bite-sized chunks. Season with salt and black pepper.","Brown the chicken: heat vegetable oil in a large deep pan or Dutch oven over medium-high heat. Brown chicken in batches, 2–3 minutes per side (doesn't need to cook through). Remove and set aside. (~5 min)","Soften onion and capsicum: lower heat to medium. Add onion and capsicum to the same pan, scraping up any browned bits. Cook until softened, about 6–7 minutes.","Add garlic and paprika: stir in garlic, then paprika and tomato paste. Cook for 30–60 seconds, stirring constantly, until fragrant — don't let the paprika burn.","Simmer: pour in chicken stock, scraping the pan bottom. Return chicken (and any juices) to the pan. Bring to a gentle simmer, cover, and cook until chicken is tender. (~15 min)","Finish the sauce: whisk sour cream with plain flour in a small bowl to prevent splitting. Stir a ladle of hot sauce into the sour cream mixture to temper it, then stir the whole lot back into the pan. Warm through gently without boiling (boiling can split the sauce).","Cook noodles and serve: meanwhile, cook egg noodles or rice according to packet directions. Serve chicken paprikash over the noodles or rice."],"notes":["Batch-cooking tip: this freezes well before the sour cream is added — freeze the base in portions, then stir through fresh sour cream when reheating for the best texture.","Sweet Hungarian paprika (not smoked or hot) is key to the flavour — worth seeking out if you don't already have it."]},"chicken-meatballs":{"title":"Best Anytime Baked Chicken Meatballs","sub":"Pinch of Yum.","src":"Chicken Meatballs.pdf","serves":4,"unit":"servings","servesNote":"50–60 meatballs / 4 servings","meta":[{"k":"Total","v":"30 min"}],"groups":[{"i":[{"q":2,"u":"pound","n":"ground chicken or turkey"},{"q":2,"n":"egg"},{"q":1,"u":"cup","n":"panko breadcrumbs"},{"q":1,"u":"cup","n":"grated Parmesan"},{"q":4,"u":"tbsp","n":"olive oil","note":"optional — makes meatballs more moist and yummy"},{"q":1,"u":"tsp","n":"garlic powder"},{"q":1,"u":"tsp","n":"onion powder"},{"q":1,"u":"tsp","n":"salt"},{"n":"Black pepper to taste"},{"n":"Additional seasonings optional!"}]}],"steps":["Prep: preheat the oven to 400 degrees. Line a baking sheet with foil and a little cooking spray.","Mix: mix all the ingredients together in a mixing bowl.","Roll: roll the mixture into about 30 small balls. Place on baking sheet.","Bake: bake for 25–30 minutes."]},"butter-chicken":{"title":"Butter Chicken","sub":"Cafe Delites — creamy and easy to make in one pan. Aromatic golden chicken pieces in an incredible creamy curry sauce.","src":"Butter Chicken.pdf","serves":5.5,"unit":"people","servesNote":"5–6","meta":[{"k":"Prep","v":"15 min"},{"k":"Cook","v":"30 min"}],"groups":[{"n":"For the chicken marinade","i":[{"q":800,"u":"g","n":"boneless and skinless chicken thighs or breasts, cut into bite-sized pieces","note":"28 oz"},{"q":0.5,"u":"cup","n":"plain yogurt"},{"q":1.5,"u":"tbsp","n":"minced garlic"},{"q":1,"u":"tbsp","n":"minced ginger","note":"or finely grated"},{"q":2,"u":"tsp","n":"garam masala"},{"q":1,"u":"tsp","n":"turmeric"},{"q":1,"u":"tsp","n":"ground cumin"},{"q":1,"u":"tsp","n":"red chili powder"},{"q":1,"u":"tsp","n":"salt"}]},{"n":"For the sauce","i":[{"q":2,"u":"tbsp","n":"olive oil"},{"q":2,"u":"tbsp","n":"ghee","note":"or 1 tbsp butter + 1 tbsp oil"},{"q":1,"u":"large","n":"onion, sliced or chopped"},{"q":1.5,"u":"tbsp","n"
