<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandro's Recipe Book</title>
<style>
:root{
  --bg:#faf8f4; --panel:#fffdf9; --ink:#23201c; --muted:#6f675d; --line:#e6dfd3;
  --accent:#8a4b2a; --accent-soft:#f0e4d8; --chip:#efe8dc; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17150f; --panel:#201d17; --ink:#ece6dc; --muted:#a49a8b; --line:#332e25;
         --accent:#e0a173; --accent-soft:#2c241c; --chip:#2a251d; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 80px}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 0 10px;margin-bottom:6px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:650}
.brand .count{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 240px;min-width:180px;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);color:var(--ink);font-size:15px;box-shadow:var(--shadow)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.toggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.toggle button{border:0;background:transparent;color:var(--muted);padding:9px 13px;font-size:13.5px;
  cursor:pointer;font-family:inherit;white-space:nowrap}
.toggle button[aria-pressed=true]{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:999px;
  padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.clear{background:transparent}

section.grp{margin:26px 0 0}
section.grp > h2{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
  margin:0 0 4px;font-weight:700}
h3.sub{font-size:13px;color:var(--muted);margin:16px 0 2px;font-weight:600;letter-spacing:.02em}
ul.dishes{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.dishes li{border-bottom:1px solid var(--line)}
.dish{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;
  padding:10px 2px;font:inherit;color:inherit;cursor:default}
.dish.has{cursor:pointer}
.dish.has:hover{background:var(--accent-soft)}
.dish .txt{flex:1;min-width:0}
.dish .name{font-size:15px}
.dish.has .name{color:var(--accent);font-weight:560}
.dish .cui{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.03em}
.dish .rc{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;margin-top:2px;white-space:nowrap;background:var(--panel)}
.dish .rc.none{opacity:.55}
.dish ul.variants{margin:5px 0 0 0;padding-left:16px;color:var(--muted);font-size:13.5px}
.xmark{color:var(--muted);font-size:11px;border:1px solid var(--line);border-radius:4px;
  padding:0 4px;margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* recipe view */
#recipe{display:none}
body.rv #list{display:none}
body.rv #recipe{display:block}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;
  padding:14px 0 6px;display:inline-flex;gap:6px;align-items:center}
.rhead h2{font-size:26px;margin:6px 0 4px;letter-spacing:-.015em;line-height:1.2}
.rhead .rsub{color:var(--muted);font-size:14.5px;margin:0 0 10px;max-width:62ch}
.rmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;margin-bottom:4px}
.rmeta b{color:var(--ink);font-weight:600}
.flag{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  font-size:12.5px;color:var(--muted);margin:12px 0}

.scaler{position:sticky;top:0;z-index:10;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin:14px 0 18px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.scaler .lab{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:var(--accent);
  font-size:19px;cursor:pointer;font-family:inherit;line-height:1}
.stepper button:hover{background:var(--accent-soft)}
.stepper .val{min-width:62px;padding:0 4px;text-align:center;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.scaler .unit{font-size:13.5px;color:var(--muted)}
.scaler .factor{font-size:12px;color:var(--accent);margin-left:auto}
.scaler .reset{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;
  padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:780px){ .cols{grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:38px;align-items:start} }
h4.blk{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  margin:22px 0 8px;font-weight:700}
.ig{margin:0 0 14px}
.ig .gn{font-size:13px;font-weight:650;margin:12px 0 4px}
ul.ings{list-style:none;margin:0;padding:0}
ul.ings li{padding:4px 0;font-size:14.5px;border-bottom:1px dotted var(--line);display:flex;gap:8px}
ul.ings li .q{font-variant-numeric:tabular-nums;font-weight:620;white-space:nowrap;color:var(--ink)}
ul.ings li .n{flex:1;min-width:0}
ul.ings li .nt{color:var(--muted);font-size:13px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st}
ol.steps li.s{counter-increment:st;position:relative;padding:0 0 14px 34px;font-size:15px}
ol.steps li.s::before{content:counter(st);position:absolute;left:0;top:1px;width:23px;height:23px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
ol.steps li.h{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:10px 0 9px;counter-reset:st}
ul.notes{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
ul.notes li{padding:3px 0}
.src{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted)}

@media print{
  header.top,.back,.scaler .reset,.chips,.controls,footer.foot{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .scaler{position:static;border:0;border-bottom:1px solid #999;border-radius:0;box-shadow:none}
  .cols{grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:26px}
  ol.steps li.s{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <h1>Sandro's Recipe Book</h1>
    <span class="count" id="count"></span>

  <div class="controls">
    <input type="search" id="q" placeholder="Search dishes, ingredients, recipes…" autocomplete="off">
    <div class="toggle" role="group" aria-label="View">

      <button id="vRegion" aria-pressed="false">By region</button>
      <button id="vRecipes" aria-pressed="false">Recipes only</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="list"></main>
<article id="recipe"></article>

<footer class="foot" id="foot"></footer>
</div>

"r":["goan-fish-curry"]}]},{"name":"Other Asian Mains","items":[{"t":"Mongolian lamb w/ rice","c":"Chinese","r":["mongolian-lamb"]},{"t":"Black pepper beef w/ rice","c":"Chinese","r":["black-pepper-short-ribs"]},{"t":"Beef & Onion w/ vegetables","c":"Chinese","r":["beef-onion-veggies"]},{"t":"Udon noodles w/ minced beef, cucumber","c":"Japanese & Korean"},{"t":"Thai curry w/ chicken, vegetables (such as carrot, lotus, zucchini, broccoli, capsicum), mushrooms w/ rice","c":"Southeast Asian","r":["thai-curry"]},{"t":"Pork larb w/ shallots, spring onions, herbs, jasmin rice","c":"Southeast Asian","x":true,"r":["pork-larb"]},{"t":"Chinese meatballs w/ tomato sauce","c":"Chinese","r":["chinese-meatballs"]},{"t":"Steamed Tofu w/ shrimp","c":"Chinese","r":["steamed-tofu-shrimp"]},{"t":"Braised Pork Belly and Potato","c":"Chinese","r":["braised-pork-belly-potato"]}]},{"name":"Side dishes","items":[{"t":"Sauteed Broccolini","c":"Modern Café","r":["sauteed-broccolini"]},{"t":"Boiled Broccoli or Cauliflower","c":"Modern Café"},{"t":"Fried spinach or Gai Lan","c":"Chinese"},{"t":"Boiled Lettuce","c":"Chinese"},{"t":"Roased Mexican Zucchini","c":"Mexican & Latin","r":["roasted-mexican-zucchini"]},{"t":"Carrots & Peas","c":"Swiss"},{"t":"Potato gratin dauphinois","c":"French","r":["kartoffel-gratin"]},{"t":"Fried brussel sprouts or green beans w/ bacon, onion","c":"Modern Café"},{"t":"Oven-baked eggplant w/ olive oil, salt, pepper, paprika","c":"Greek & Mediterranean"},{"t":"Oven-baked potato or sweet potato wedgels w/ olive oil, salt, pepper, paprika, oregano","c":"American & Australian"},{"t":"Grilled capsicum or zucchini w/ olive oil, salt, pepper, paprika, oregano","c":"Greek & Mediterranean"},{"t":"Black rice and halloumi salad","c":"Greek & Mediterranean","r":["black-rice-halloumi"]},{"t":"Lentil Salad","c":"Greek & Mediterranean","r":["lentil-salad"]},{"t":"Quinoa Salad","c":"Modern Café","r":["quinoa-salad-asian","quinoa-salad-mixed"]}]}]},"recipes":{"tuna-melt":{"title":"Tuna Melt","sub":"A classic toasted tuna-and-cheese sandwich.","src":"Tuna melt.docx","serves":1,"unit":"sandwich","groups":[{"n":"Tuna salad","i":[{"q":1,"u":"can","n":"tuna (5–6 oz), drained"},{"q":2,"u":"tbsp","n":"mayonnaise","note":"adjust to taste"},{"q":1,"u":"tsp","n":"Dijon mustard","note":"optional"},{"q":1,"u":"tbsp","n":"chopped celery or onion","note":"optional, for crunch and flavor"},{"n":"Salt and pepper, to taste"}]},{"n":"To assemble","i":[{"q":2,"u":"slices","n":"bread","note":"sourdough, rye, or your favorite"},{"q":[1,2],"u":"slices","n":"cheese","note":"cheddar, Swiss, or provolone work well"},{"n":"Butter, for toasting"},{"n":"Optional: sliced tomato or pickles for topping"}]}],"steps":["Prepare the tuna salad. In a bowl, mix the drained tuna, mayonnaise, Dijon mustard, and chopped celery or onion if using. Season with salt and pepper to taste.","Assemble the sandwich. Spread the tuna mixture evenly on one slice of bread. Add a slice or two of cheese on top. Add optional toppings like tomato or pickles if desired. Top with the second slice of bread.","Butter the bread. Spread a thin layer of butter on the outside of each slice of bread. This helps achieve a crispy, golden crust.","Cook the tuna melt. Heat a skillet or griddle over medium heat. Place the sandwich on the skillet and cook for 3–4 minutes on one side, pressing lightly with a spatula. Flip and cook for another 3–4 minutes until the bread is golden brown and the cheese is melted.","Serve. Slice the sandwich in half and serve warm with chips, salad, or soup."]},"french-toast":{"title":"French Toast with Strawberries and Syrup","sub":"taste.com.au — French toast served with sweet strawberries.","src":"French Toast.pdf","transcribed":true,"serves":6,"unit":"servings","meta":[{"k":"Prep","v":"5 min"},{"k":"Cook","v":"10 min"}],"groups":[{"n":"Batter","i":[{"q":160,"u":"ml","n":"milk","note":"2/3 cup"},{"q":3,"n":"eggs, lightly whisked"},{"q":55,"u":"g","n":"caster sugar","note":"1/4 cup"},{"n":"Pinch of mixed spice"}]},{"n":"To cook and serve","i":[{"q":60,"u":"g","n":"unsalted butter"},{"q":6,"u":"slices","n":"white bread, 1 cm thick"},{"q":250,"u":"g","n":"strawberries, hulled, washed, halved","note":"1 punnet"},{"q":60,"u":"ml","n":"maple syrup","note":"1/4 cup"},{"n":"Thickened cream, to serve"}]}],"steps":["Combine the milk, egg, sugar and mixed spice in a bowl. Melt half the butter in a frying pan over high heat until foaming. Dip 3 bread slices, 1 at a time, in the egg mixture. Cook for 2–3 minutes each side or until golden brown. Transfer to serving plates. Repeat with remaining butter, bread and egg mixture.","Top toast with strawberries and cream. Drizzle with maple syrup to serve."],"notes":["Make this recipe just before serving."]},"chinese-steamed-egg":{"title":"Chinese Steamed Eggs","src":"Chinese Steamed Egg.docx","serves":2,"unit":"portions","groups":[{"i":[{"q":3,"n":"eggs","note":"assume each is c. 50 g"},{"q":2,"u":"dl","n":"lukewarm water"},{"n":"A pinch of salt"},{"n":"Soy sauce and sesame oil, to finish"},{"n":"Spring onion, to garnish (optional)"}]}],"steps":["Preheat water in a pot that has a steamer basket.","Add three eggs to a bowl (assume each is c. 50 g).","Add 2 dl lukewarm water.","Add a pinch of salt. Mix well.","Strain into two small bowls or cups through a mesh strainer.","Cover small bowls with cling wrap and pierce holes through the wrap with a knife.","Steam for c. 15 mins or until cooked through.","When done, remove cling wrap and cut a grid into steamed eggs.","Add a bit of soy sauce and sesame oil on top.","If you want, garnish with some spring onion."]},"xo-prawn-spaghetti":{"title":"XO Prawn Spaghetti","sub":"With kale, cherry tomatoes and fried shallots.","src":"XO Prawn Spaghetti.docx","serves":3,"unit":"servings","groups":[{"i":[{"q":300,"u":"g","n":"spaghetti"},{"q":375,"u":"g","n":"raw prawns, peeled and deveined"},{"q":3,"u":"tbsp","n":"XO sauce"},{"q":3,"u":"tbsp","n":"olive oil"},{"q":4,"u":"cloves","n":"garlic, thinly sliced"},{"q":[2,3],"n":"fresh red chillies, finely chopped","note":"to taste"},{"q":150,"u":"g","n":"kale, thick stems removed, roughly chopped"},{"q":225,"u":"g","n":"cherry tomatoes, halved"},{"q":0.75,"u":"cup","n":"pasta cooking water"},{"n":"Salt and freshly ground black pepper"},{"n":"Store-bought fried shallots, for topping"}]}],"steps":["Bring a large pot of well-salted water to the boil. Cook the spaghetti until al dente. Reserve at least 1 cup of pasta cooking water, then drain.","Heat a splash of olive oil in a large pan over medium heat. Add the kale with a small pinch of salt. Wilt briefly until just tender and still bright green. Remove from the pan and set aside.","In the same pan, add a little more olive oil if needed. Add the cherry tomatoes with a pinch of salt. Cook briefly until just softened but not collapsed. Remove and set aside.","Add the remaining olive oil to the pan over medium-high heat. Add garlic and chilli and sauté until fragrant, about 30 seconds.","Add the prawns, season lightly with salt and pepper, and cook until just opaque and cooked through.","Reduce heat slightly and stir in the XO sauce. Add approximately ¾ cup of the reserved pasta water and stir to create a glossy, emulsified sauce.","To serve, place the spaghetti into bowls. Spoon over the prawns and XO sauce. Top with the wilted kale, cherry tomatoes, and a generous sprinkle of store-bought fried shallots."]},"panzanella":{"title":"Haven-Style Panzanella Salad","sub":"A modern café-style panzanella inspired by Haven Specialty Coffee. Balances sweet stone fruit, salty pancetta, crisp bread, fresh tomatoes, and creamy bocconcini with a sharp, lightly sweet vinaigrette.","src":"Panzanella Salad.docx","serves":3,"unit":"people","groups":[{"n":"Bread & base","i":[{"q":3,"u":"thick slices","n":"sourdough, torn into large chunks"},{"n":"Extra virgin olive oil"},{"n":"Salt"}]},{"n":"Pancetta","i":[{"q":[80,100],"u":"g","n":"pancetta or streaky bacon, diced"}]},{"n":"Fruit, cheese & greens","i":[{"q":2,"n":"ripe peaches or nectarines, cut into wedges"},{"q":1,"u":"small","n":"cos or butter lettuce, torn"},{"q":150,"u":"g","n":"cherry bocconcini, halved"},{"q":1,"u":"cup","n":"cherry tomatoes, halved"},{"n":"Optional: fresh herbs (parsley or basil)"}]},{"n":"Quick pickled shallots","i":[{"q":1,"u":"small","n":"shallot, thinly sliced"},{"q":2,"u":"tbsp","n":"white wine vinegar"},{"n":"Pinch of sugar"},{"n":"Pinch of salt"}]},{"n":"Dressing","i":[{"q":3,"u":"tbsp","n":"extra virgin olive oil"},{"q":1,"u":"tbsp","n":"red or white wine vinegar"},{"q":1,"u":"tsp","n":"Dijon mustard"},{"q":1,"u":"tsp","n":"honey","note":"or maple syrup"},{"n":"Salt and freshly cracked black pepper"}]}],"steps":["Start with the pancetta. Place the diced pancetta in a cold pan and cook gently over medium heat until deeply golden and crisp. Remove the pancetta with a slotted spoon and set aside, leaving the rendered fat in the pan. This fat will be used to coat the croutons and is key to the flavour.","Toast the sourdough croutons. Toss the torn sourdough pieces in the warm pancetta fat, adding a little olive oil if needed. Season lightly with salt. Roast in a 190°C oven for 12–15 minutes (or pan-toast) until golden and crisp outside, but still slightly chewy inside. Set aside.","Pickle the shallots. Combine the vinegar, sugar and salt in a small bowl. Add the sliced shallots and set aside for at least 5 minutes.","Char the peaches. Using the same pan (wipe out excess fat if needed), sear the peach wedges cut-side down until lightly caramelised. Turn once and cook briefly on the other side. Remove and cool slightly.","Make the dressing. Whisk together the olive oil, vinegar, Dijon, honey, salt and pepper. The dressing should be bright and tangy with just a hint of sweetness.","Assemble the salad. Place the warm croutons in a large bowl and spoon over a small amount of dressing, allowing the bread to absorb it. Add the lettuce, peaches, cherry tomatoes, bocconcini, crispy pancetta and drained pickled shallots. Add the remaining dressing and toss gently.","Finish and serve. Taste and adjust seasoning with salt, pepper or a splash of vinegar. Finish with fresh herbs if using. Serve immediately while the croutons still have texture."],"notes":["Avoid over-drying the bread — panzanella should have contrast between crisp edges and a soft centre.","This salad works best assembled just before serving.","Optional finish: a few shavings of pecorino or ricotta salata."]},"chilli-scramble-croissant":{"title":"Chilli Scramble with Tahini Croissant & Prawns","sub":"Based on a Haven-style chilli scramble, adapted with toasted croissant, tahini, chilli prawns, and a soft, jammy egg scramble. Rich, comforting, ideal for brunch.","src":"Chili scramble croissant.docx","serves":3,"unit":"portions","groups":[{"i":[{"q":3,"n":"croissants","note":"1 per person, sliced horizontally"},{"q":6,"n":"eggs","note":"2 per person"},{"q":350,"u":"g","n":"raw prawns, peeled and deveined"},{"q":3,"u":"tbsp","n":"tahini"},{"n":"Chilli oil – to taste (for frying + drizzle)"},{"q":[2,3],"u":"tbsp","n":"fresh parsley, finely chopped"},{"q":40,"u":"g","n":"butter"},{"n":"Salt – to taste"}]}],"steps":["Prepare the croissants. Slice croissants in half horizontally. Toast the cut sides in a dry pan or oven until golden and crisp. Set aside and keep warm.","Cook the chilli prawns. Roughly chop the prawns into bite-sized pieces. Heat a pan over medium heat with a little chilli oil. Add prawns, season lightly with salt, and fry for 1–2 minutes until just cooked. Remove from heat and set aside.","Make the soft egg scramble. Crack eggs into a bowl, add a small pinch of salt, and whisk gently until just combined (do not overbeat). Melt butter in a non-stick pan over very low heat. Add eggs and allow them to sit undisturbed for ~20 seconds. Using a silicone spatula, gently push the eggs from the edges toward the centre, forming soft folds. Continue slowly until eggs are just set but still glossy and custardy. Remove from heat — residual heat will finish cooking.","Assemble. Spread tahini generously over the toasted croissant halves. Top with chilli prawns, then spoon the scrambled eggs over the top.","Finish and serve. Drizzle with additional chilli oil and sprinkle with chopped parsley. Serve immediately while warm."],"notes":["Keep the egg heat very low — the texture should be soft and layered, not dry.","Chilli oil can be adjusted to taste; a mild oil works well if serving to a crowd.","Parsley can be substituted with chives or coriander.","For extra richness, finish with flaky sea salt or a squeeze of lemon."]},"caponata":{"title":"Piña-Style Eggplant & Tomato Caponata","sub":"Served on sourdough with stracciatella and pine nuts.","src":"Caponata.docx","serves":2.5,"unit":"servings (for toast)","servesNote":"2–3","groups":[{"n":"Caponata","i":[{"q":1,"u":"large","n":"eggplant, 2–3 cm dice"},{"q":[200,250],"u":"g","n":"ripe tomatoes","note":"fresh or crushed"},{"q":1,"u":"small","n":"red onion, finely sliced"},{"q":1,"u":"stalk","n":"celery, finely diced"},{"q":1,"u":"clove","n":"garlic, grated"},{"q":2,"u":"tbsp","n":"capers, rinsed"},{"q":2,"u":"tbsp","n":"green olives, sliced","note":"optional"},{"q":1.5,"u":"tbsp","n":"red wine vinegar"},{"q":[0.5,1],"u":"tsp","n":"sugar","note":"minimal"},{"n":"Extra-virgin olive oil"},{"n":"Salt & black pepper"}]},{"n":"To serve","i":[{"n":"Sourdough, toasted"},{"n":"Pine nuts, toasted"},{"n":"Stracciatella"},{"n":"Optional: basil or parsley"}]}],"steps":[{"h":"1. Roast eggplant"},"Preheat oven to 220°C (fan).","Toss eggplant with olive oil and salt.","Roast 25–30 minutes until golden and soft.",{"h":"2. Tomato base"},"Heat olive oil in pan.","Cook onion and celery 5–7 minutes.","Add garlic, then tomatoes and capers.","Simmer 10–15 minutes until jammy.",{"h":"3. Combine"},"Add eggplant to sauce. Add olives.","Add vinegar and a small amount of sugar.","Season and finish with olive oil.",{"h":"4. Assemble"},"Toast sourdough. Add caponata.","Tear stracciatella on top. Add pine nuts and herbs."],"notes":["Serve warm with cool stracciatella."]},"pcp-autumn-salad":{"title":"PCP-Style Autumn Salad","sub":"Paramount Coffee Project style — mixed greens, roast pumpkin, fennel, tomatoes, lentils, pickled onions.","src":"Breakfast Bowls - PCP Autumn Salad.docx","serves":2,"unit":"servings","meta":[{"k":"Active","v":"~15 min"},{"k":"Roast","v":"~20 min"}],"groups":[{"n":"Roasted pumpkin","i":[{"q":0.25,"n":"butternut pumpkin, cut into wedges"},{"n":"Olive oil, salt & pepper"}]},{"n":"Salad","i":[{"n":"Mixed leaves (large handful, enough for 2)"},{"q":0.5,"u":"bulb","n":"fennel, thinly sliced"},{"n":"Handful cherry tomatoes, halved"},{"q":4,"u":"tbsp","n":"cooked lentils","note":"canned is fine"},{"n":"Small handful smoked almonds, roughly crushed"},{"n":"Handful pickled red onions"}]},{"n":"Simple vinaigrette","i":[{"q":2,"u":"tbsp","n":"olive oil"},{"q":2,"u":"tbsp","n":"white wine vinegar"},{"q":1,"u":"tsp","n":"Dijon mustard"},{"q":1,"u":"tsp","n":"honey"},{"n":"Pinch of salt"},{"n":"Pinch of pepper"}]}],"steps":["Roast the pumpkin: Toss pumpkin with olive oil, salt and pepper. Roast at 200°C for 20–25 minutes, until tender and caramelized at the edges.","Make the dressing: Whisk together the olive oil, vinegar, mustard, honey and salt until combined.","Assemble: In a large bowl, toss the leaves, fennel, tomatoes, lentils and pickled red onion with the dressing. Divide between two plates, top with warm roasted pumpkin, and scatter with crushed smoked almonds."],"notes":["Add grilled chicken or haloumi for extra protein if desired."]},"boatshed-green-bowl":{"title":"Green Bowl with Beetroot Hummus & Orange Dressing","sub":"Boatshed La Perouse style — quinoa, charred greens, edamame and radish, cradled in a swipe of beetroot hummus and finished with a fresh orange vinaigrette.","src":"Boatshed La Perouse Green Bowl.docx","serves":2,"unit":"servings","groups":[{"n":"Bowl","i":[{"q":150,"u":"g","n":"quinoa"},{"q":150,"u":"g","n":"broccolini, trimmed"},{"q":80,"u":"g","n":"kale leaves, stems removed, torn"},{"q":60,"u":"g","n":"baby spinach"},{"q":200,"u":"g","n":"canned edamame, drained and rinsed"},{"q":4,"u":"small","n":"radishes, thinly sliced"},{"q":6,"u":"tbsp","n":"beetroot hummus"},{"q":1,"u":"tbsp","n":"olive oil","note":"for charring veg"},{"n":"Salt, to taste"},{"n":"Black pepper, to taste"}]},{"n":"Orange dressing","i":[{"q":1,"n":"fresh orange, juiced and zested"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"white wine vinegar or rice vinegar"},{"q":1,"u":"tsp","n":"Dijon mustard"},{"q":1,"u":"tsp","n":"honey or maple syrup"}]}],"steps":["Cook the quinoa. Rinse well, then cook according to packet instructions (usually simmered in twice the volume of water for about 15 minutes, until fluffy). Fluff with a fork and set aside to cool slightly.","Blanch the broccolini. Bring a pot of salted water to the boil. Blanch the broccolini for 2 minutes until bright green and just tender. Drain and plunge into iced water to stop the cooking, then pat dry.","Char the broccolini and kale. Heat the olive oil in a griddle pan or heavy skillet over high heat. Add the blanched broccolini and kale and char for 2–3 minutes, tossing occasionally, until nicely blistered and wilted at the edges. Season with a pinch of salt and pepper.","Make the orange dressing. In a small bowl, whisk together the orange juice, zest, vinegar, mustard, and honey. Slowly drizzle in the olive oil while whisking until emulsified. Season to taste with salt and pepper.","Coat the bowls. Take two big flat bowls and use the back of a spoon to swipe the beetroot hummus generously up the inside edge of each bowl, leaving the center open for the bowl fillings.","Build the bowls. Divide the quinoa between the two bowls, spooning it into the center. Top with baby spinach, the charred broccolini and kale, and edamame.","Finish and serve. Scatter radish slices over the top of each bowl. Drizzle generously with the orange dressing and serve immediately."],"notes":["Use store-bought beetroot hummus to save time, or blend cooked beetroot into plain hummus.","Leftover orange dressing keeps in the fridge for about a week — shake well before using.","For extra crunch, add toasted pumpkin seeds or slivered almonds on top."]},"room-ten-sweet-potato-salad":{"title":"Room Ten Sweet Potato Salad","sub":"A simpler take on a chickpea, kale, and tahini sweet potato salad — roasted sweet potato, chickpeas, cucumber, cherry tomatoes, crunchy radish and almonds, all tossed in a lemony tahini dressing.","src":"Room Ten Sweet Potato Salad.docx","serves":2,"unit":"servings","groups":[{"n":"Salad","i":[{"q":400,"u":"g","n":"sweet potato, peeled and cubed"},{"q":2,"u":"tbsp","n":"olive oil, divided"},{"q":1,"u":"cup","n":"chickpeas, canned and rinsed"},{"q":2,"u":"cups","n":"baby kale or spinach"},{"q":4,"n":"radishes, thinly sliced"},{"q":2,"u":"tbsp","n":"almonds, roughly chopped"},{"q":1,"n":"cucumber, diced"},{"q":1,"u":"cup","n":"cherry tomatoes, halved"},{"q":2,"u":"slices","n":"bread, for toast"}]},{"n":"Dressing","i":[{"q":2,"u":"tbsp","n":"tahini"},{"q":1,"n":"lemon, juiced"},{"q":1,"u":"clove","n":"garlic, grated"},{"q":2,"u":"tbsp","n":"water, to thin"},{"q":0.5,"u":"tsp","n":"salt"}]}],"steps":["Roast the sweet potato (~25 min): Preheat oven to 200°C (400°F). Toss sweet potato with 1 tbsp olive oil and a pinch of salt. Spread on a baking tray and roast until golden and tender.","Make the dressing: While the sweet potato roasts, whisk together tahini, lemon juice, garlic, water, and salt in a small bowl until smooth. Add more water if needed to loosen it.","Toast the bread (~3 min): Toast until golden and set aside.","Assemble the salad: In a large bowl, combine the roasted sweet potato, chickpeas, kale, radishes, cucumber, and cherry tomatoes. Drizzle with the tahini dressing and toss gently to coat.","Finish and serve: Scatter almonds over the top. Serve with the toast on the side."],"notes":["Swap the almonds for walnuts or pepitas if you prefer. For extra protein, add mayo chicken or poached chicken as in the original menu version."]},"potato-salad":{"title":"Potato Salad","sub":"Swiss-style potato salad with dill pickles. Start cooking at least 1 h 15 min before desired eating time; effective preparation time 20–30 min.","src":"Rezepte.xlsx — Potato Salad","serves":4,"unit":"servings","groups":[{"i":[{"q":1,"u":"kg","n":"potatoes (white, washed)"},{"q":1,"u":"cup","n":"broth (chicken / veggie)"},{"q":4,"u":"tbsp","n":"vinegar"},{"q":1,"u":"tsp","n":"mustard"},{"q":0.25,"u":"cup","n":"French salad dressing","note":"see separate recipe"},{"q":50,"u":"g","n":"sour cream"},{"q":4,"n":"pickles (european / dill)"}]}],"steps":["Heat up a pot, half filled with water. Add broth cubes (chicken or veggie) as appropriate. In the meantime, peel the potatoes. Cut into slices of ~7 mm. Add to the broth as soon as it's boiling. Once it's back to the boil, cook for 10–12 min.","While potatoes are cooking, add broth (as per table above; either chicken or veggie), vinegar and mustard to a bowl, with black pepper and herbal salt to taste. Mix well. Drain the potato slices carefully once done, and place into a flat bowl. Add the mixture, and let potato slices soak for at least 30 mins.","In the meantime, mix french salad dressing, sour cream and black pepper and herbal salt to taste. Once the potato slices have soaked for long enough, if there's any of the broth-mixture left, drain about 80% of it, however catch in a separate bowl — this can be used later in case salad gets too dry. Slice or dice pickles, add with salad dressing mixture to potato slices and let rest again for a couple of minutes.","If too dry when serving, add back some of the broth mixture."],"notes":["Add 1 Kohlräbli instead of all potatos. Takes same amount to boil. Makes the salad feel lighter."]},"french-salad-dressing":{"title":"French Salad Dressing","sub":"Component of the potato salad — also good on its own.","src":"Rezepte.xlsx — French Salad Dressing","serves":1,"unit":"batch (~1/3 l sauce)","groups":[{"i":[{"q":0.5,"u":"cup","n":"white vinegar"},{"q":0.5,"u":"cup","n":"olive oil"},{"q":0.333,"n":"onion"},{"q":1,"u":"clove","n":"garlic"},{"q":0.333,"n":"egg"},{"q":1,"u":"tsp","n":"Dijon mustard"}]}],"steps":["Finely chop 1/3 of an onion and 1 garlic clove. Add to a blender cup, together with vinegar, a heaped tsp of mustard, and olive oil. Whisk an egg and add about 1/3 to 1/2 of it to the cup.","Season with 1/2 tsp of salt and a pinch of black pepper and curry powder.","Blend well using an electronic food processor. Taste and adapt seasoning if necessary."]},"viet-chicken-vermicelli":{"title":"Vietnamese Grilled Chicken Vermicelli Salad with Spring Rolls","src":"Vietnamese Grilled Chicken Vermicelli Salad with Spring Rolls.docx","serves":6,"unit":"servings","servesNote":"3 people for 2 meals each","groups":[{"n":"Grilled chicken","i":[{"q":900,"u":"g","n":"boneless, skinless chicken thighs","note":"2 lbs"},{"q":3,"u":"tbsp","n":"dark Thai fish sauce"},{"q":2,"u":"tbsp","n":"soy sauce"},{"q":1,"u":"tbsp","n":"oyster sauce"},{"q":1,"u":"tbsp","n":"honey or brown sugar"},{"q":1,"u":"tbsp","n":"minced garlic"},{"q":1,"u":"tbsp","n":"minced shallots"},{"q":1,"u":"tsp","n":"black pepper"},{"q":1,"u":"tbsp","n":"vegetable oil"},{"q":5,"u":"cl","n":"lime juice","note":"about ¾ of a lime"}]},{"n":"Noodle salad","i":[{"q":450,"u":"g","n":"dried rice vermicelli noodles","note":"1 lb"},{"q":1,"u":"small head","n":"romaine or butter lettuce, shredded"},{"q":2,"u":"large","n":"carrots, julienned"},{"q":2,"n":"Lebanese cucumbers, julienned"},{"q":1.5,"u":"cups","n":"bean sprouts"},{"q":6,"u":"sprigs","n":"mint leaves","note":"regular mint"},{"q":6,"u":"sprigs","n":"cilantro"},{"q":6,"u":"sprigs","n":"Thai basil","note":"optional"},{"q":0.25,"u":"cup","n":"crushed peanuts"}]},{"n":"Nuoc cham dressing","i":[{"q":5,"u":"tbsp","n":"dark Thai fish sauce"},{"q":6,"u":"cl","n":"fresh lime juice","note":"about 1 lime"},{"q":1,"u":"tbsp","n":"sugar"},{"q":0.5,"u":"cup","n":"warm water"},{"q":2,"u":"cloves","n":"garlic, minced"},{"q":2,"n":"bird eye chilies, finely chopped"}]},{"n":"Spring rolls","i":[{"q":6,"n":"store-bought frozen spring rolls","note":"one per serving"}]}],"steps":["Marinate and grill the chicken. In a bowl, mix Thai fish sauce, soy sauce, oyster sauce, honey, lime juice, garlic, shallots, black pepper, and vegetable oil. Coat the chicken in the marinade and refrigerate for at least 1 hour (overnight for best flavor). Preheat a grill or pan over medium-high heat. Grill the chicken for 5–7 minutes per side until charred and fully cooked. Let rest for 5 minutes, then slice.","Prepare the noodles and vegetables. Cook the vermicelli noodles according to the package instructions. Drain and rinse under cold water. Arrange bowls with shredded lettuce, bean sprouts, julienned carrots, and cucumbers. Top with cooked noodles.","Make the nuoc cham dressing. In a bowl, whisk together Thai fish sauce, lime juice, sugar, warm water, garlic, and chilies. Adjust to taste.","Bake the spring rolls. Follow the package instructions to bake the frozen spring rolls until crispy. Once baked, cut each into three pieces.","Assemble and serve. Place sliced grilled chicken on top of the noodle bowls. Add three spring roll pieces per bowl. Drizzle with nuoc cham dressing. Garnish with fresh herbs and crushed peanuts."],"notes":["Storage: keep the chicken, noodles, veggies, sauce, and spring rolls separate.","Reheating: warm the chicken and spring rolls before serving. The noodles can be refreshed with a quick rinse in warm water.","Serving: assemble just before eating for the freshest taste."]},"beef-tartare":{"title":"Beef Tartare (Ester's recipe)","sub":"Mat Lindsay / Ester, Sydney. An exercise in contrasts that calls for crunch, salt, fat, acid and heat. Fish sauce intensifies the sweetness and umami of the beef, hot sauce brings sourness, egg yolk fattiness, capers and shallots bite and perfume.","src":"Beef tartare.pdf","serves":4,"unit":"as a snack","servesNote":"4 as a snack, 2 as a starter","meta":[{"k":"Difficulty","v":"★☆☆"}],"groups":[{"i":[{"q":200,"u":"g","n":"beef rump, trimmed of all silver skin, fat and sinew"},{"q":1,"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"fermented hot sauce","note":"e.g. sriracha"},{"q":1,"u":"tbsp","n":"finely diced shallots"},{"q":1,"u":"tsp","n":"small salted capers, rinsed of salt"},{"q":1,"u":"tsp","n":"Thai fish sauce"},{"n":"Sea salt"},{"n":"Black pepper"},{"q":1,"n":"egg yolk"}]}],"steps":["Using a sharp knife, cut the rump into 3 mm dice and place in a chilled bowl set over another bowl filled with ice; you want to keep the meat as cold as possible.","Coat the meat with the olive oil first, then mix in the hot sauce, beating a little vigorously with a fork for a minute to get the meat sticking to itself a bit.","Add the shallots and capers, season with the fish sauce, a pinch of flaky sea salt and a healthy grind of black pepper. Gently fold in the egg yolk to add richness and shine.","Pile the mixture onto a shallow bowl or plate and serve with hot sourdough toast, preferably grilled over coals and buttered from edge to edge."],"notes":["Use a lean cut of the best quality meat you can find. Beef tartare is traditionally made with tenderloin, but because the fibres of the meat are finely chopped, Lindsay likes rump; it has a firmer texture and more beefiness.","Use the sharpest knife possible.","Don't get too heavy-handed with the garnishes, and don't overdress it with too much olive oil or fish sauce, otherwise it will feel wet.","Serve with potato chips or on hot grilled sourdough toast. Don't let the kids miss out — just form the tartare into burger patties and pan-fry them."]},"bolognese":{"title":"Bolognese Sauce","lang":"de","src":"Bolognese Sauce.xls","serves":1,"unit":"grosse Portion (1 kg Gehacktes)","groups":[{"n":"Sauce","i":[{"q":2,"u":"Essl.","n":"Olivenöl"},{"q":2,"n":"Zwiebeln"},{"q":3,"n":"Knobli-Zehen, gehackt"},{"q":1,"u":"kleines","n":"Rüebli, geraffelt"},{"q":1,"u":"Stück","n":"Sellerie, geraffelt"},{"q":0.333,"n":"Lauch, in Ringen"},{"q":0.25,"n":"Peperoni, in Streifen"},{"q":800,"u":"g","n":"Dosen-Pelati"},{"q":0.75,"u":"Tube","n":"Tomatenpurrée"},{"q":1,"u":"Dose","n":"Champignons","note":"abtropfen"},{"n":"Ital. Gewürzmischung"},{"n":"Petersilie, gehackt"},{"n":"Pfeffer"},{"n":"ev. Bouillon"},{"q":1,"u":"Teel.","n":"Zucker"},{"q":1,"u":"Tetra-P.","n":"Sauce all'Arrabiata","note":"nach Belieben dazugeben"}]},{"n":"Fleisch (in 2 Portionen anbraten)","i":[{"q":1,"u":"kg","n":"Gehacktes"},{"q":2,"u":"Essl.","n":"Olivenöl","note":"pro Portion, in einer grossen Bratpfanne erhitzen"},{"n":"Salz, Pfeffer"},{"q":1,"u":"dl","n":"Rotwein","note":"zum Ablöschen"}]}],"steps":["Olivenöl, Zwiebeln, Knobli, Rüebli, Sellerie, Lauch und Peperoni in einer grossen, hohen Bratpfanne andünsten.","Pelati und Tomatenpurrée dazugeben, vermischen.","Champignons abtropfen und dazugeben.","Sauce mit ital. Gewürzmischung, Petersilie, Pfeffer, ev. Bouillon und Zucker würzen. Sauce all'Arrabiata nach Belieben dazugeben.","Gehacktes in 2 Portionen anbraten: Olivenöl in einer grossen Bratpfanne erhitzen, 500 g Gehacktes anbraten, mit Salz und Pfeffer würzen, mit 1 dl Rotwein ablöschen.","Fleisch zur Sauce geben, gut vermischen. (Bratpfanne mit ganz wenig Wasser Brat-Fond auflösen, zur Sauce geben.)","Sauce Bolognese ca. 1/2 Std. zugedeckt köcheln lassen, evtl. nachwürzen, weitere 1 1/2 Std. köcheln."]},"lamb-ragu":{"title":"Pasta al Ragù d'Agnello","sub":"Slow-cooked lamb ragù for pappardelle or rigatoni.","src":"Lamb Ragout Pasta.docx","serves":6,"unit":"servings","groups":[{"n":"For the ragù","i":[{"q":1.2,"u":"kg","n":"lamb shoulder or leg, trimmed and cut into small chunks (1–2 cm pieces)"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"medium","n":"onion, finely diced"},{"q":1,"n":"carrot, finely diced"},{"q":1,"u":"stick","n":"celery, finely diced"},{"q":3,"u":"cloves","n":"garlic, minced"},{"q":2,"u":"tbsp","n":"tomato paste"},{"q":400,"u":"g","n":"crushed or diced tomatoes","note":"1 can"},{"q":100,"u":"ml","n":"dry red wine","note":"optional but adds depth"},{"q":[250,300],"u":"ml","n":"chicken or beef stock"},{"q":[1,2],"u":"sprigs","n":"rosemary","note":"or thyme"},{"q":1,"n":"bay leaf"},{"n":"Salt and pepper, to taste"},{"q":1,"u":"tsp","n":"sugar","note":"only if tomatoes are very acidic"},{"q":1,"u":"tbsp","n":"balsamic vinegar","note":"optional, adds roundness at the end"}]},{"n":"For serving","i":[{"q":[500,600],"u":"g","n":"pasta","note":"pappardelle or rigatoni"},{"n":"Grated Parmigiano-Reggiano or Pecorino Romano"},{"n":"Fresh parsley or mint, chopped (optional)"},{"q":[2,3],"u":"tbsp","n":"mascarpone","note":"optional, step 6"}]}],"steps":["Brown the lamb. Heat olive oil in a large heavy pot (Dutch oven or deep pan). Season lamb chunks with salt and pepper. Sear in batches until browned on all sides — don't overcrowd the pan. Remove lamb and set aside.","Make the sofrito (base). In the same pot, reduce heat to medium. Add onion, carrot, and celery with a pinch of salt. Sauté 8–10 minutes until soft and golden. Add garlic and cook another 30 seconds.","Build flavor. Stir in tomato paste and cook 1–2 minutes until it darkens slightly (this caramelizes it). Deglaze with red wine — scrape any browned bits from the bottom. Let it simmer for 2 minutes to cook off the alcohol.","Slow cook. Return the lamb to the pot. Add crushed tomatoes, stock, rosemary, bay leaf, and a bit more salt. Bring to a simmer, cover partially, and cook 1½–2 hours on low heat, stirring occasionally. It should gently bubble — not boil. If it starts drying out, add a splash of water or stock. When lamb is tender, use a spoon to slightly shred some pieces (for texture).","Finish the sauce. Remove rosemary and bay leaf. Taste and adjust: add salt, pepper, a pinch of sugar, and balsamic vinegar for balance. Let it rest 10–15 minutes before serving — it thickens beautifully.","Add mascarpone (optional). After step 5, stir in 2–3 tablespoons of mascarpone off the heat. Mix until melted and creamy. It will slightly lighten the color and give a silky, rounded mouthfeel. Finish with a squeeze of lemon or a dash of balsamic vinegar to cut through the richness.","Serve. Boil pasta until al dente, reserve ½ cup pasta water. Toss pasta with the ragù and a bit of the pasta water to emulsify. Serve with grated Parmesan and fresh herbs."],"notes":["Store cooled sauce in the fridge up to 3 days — flavor actually improves overnight.","Reheat gently with a splash of water or stock before serving.","Also perfect for freezing up to 2 months."]},"carbonara":{"title":"Spaghetti Carbonara","src":"Rezepte.xlsx — Spaghetti Carbonara","serves":4,"unit":"servings","groups":[{"i":[{"q":500,"u":"g","n":"spaghetti"},{"q":125,"u":"g","n":"parmiggiano, grated"},{"q":200,"u":"g","n":"bacon"},{"q":1,"n":"onion"},{"q":2,"u":"cloves","n":"garlic"},{"q":4,"n":"eggs"}]}],"steps":["Start heating up a large pot of water for cooking the spaghetti. Add the spaghetti to the water, with a pinch of salt, as soon as the water is boiling. Cook for 12 minutes, stir occasionally.","In the mean time, cut the bacon into small pieces and chop the onion and the garlic cloves. Add to a large frying pan with a drizzle of olive oil (if the bacon isn't fatty enough already). Fry to taste.","While frying bacon etc. and cooking spaghetti, add the eggs into a bowl. Beat the eggs with a fork. Add parmiggiano as well as some black pepper. Add bacon etc. once done.","Once done, drain spaghetti and add to the bowl while still hot. Stir well for about 2 mins — the egg should be cooked through the heat of the hot spaghetti, and the parmiggiano melted."]},"carbonara-swiss":{"title":"Spaghetti alla Carbonara (Swiss cookbook version)","lang":"de","sub":"Aus dem Schweizer Kochbuch, mit handschriftlichen Anpassungen.","src":"Spaghetti Carbonara.jpg","transcribed":true,"serves":4,"unit":"Personen","groups":[{"i":[{"q":300,"u":"g","n":"Spaghetti","note":"handschriftlich geändert auf 500 g"},{"q":100,"u":"g","n":"Speck- oder Schinkentranchen"},{"n":"wenig Butter"},{"q":[1,2],"n":"Knoblauchzehen"},{"q":1,"n":"Zwiebel","note":"handschriftlich ergänzt"},{"q":2,"u":"dl","n":"Rahm","note":"handschriftlich: 3 dl Rahm oder 2.5 dl Vollrahm + 0.5 dl Milch"},{"q":3,"n":"frische Eier","note":"ursprünglich 2, handschriftlich auf 3 geändert"},{"q":50,"u":"g","n":"geriebener Parmesan","note":"handschriftlich: neu 100 g"},{"q":0.5,"u":"KL","n":"Salz oder Streuwürze"},{"n":"wenig Pfeffer"},{"n":"(wenig Muskatnuss) — handschriftlich ergänzt"}]}],"steps":["Spaghetti zubereiten wie Teigwaren (S. 210).","Speck- oder Schinkentranchen schneiden, glasig braten.","Wenig Butter zugeben.","Knoblauchzehen (und Zwiebel) schneiden, beifügen, dünsten. Gekochte Spaghetti zugeben, erwärmen.","Rahm, frische Eier, geriebenen Parmesan, Salz oder Streuwürze und wenig Pfeffer gut mischen, darüber giessen. Sofort servieren."],"notes":["Transkribiert aus einem Foto einer Kochbuchseite mit handschriftlichen Notizen — bitte gegen das Original prüfen."]},"amatriciana":{"title":"Spaghetti all'Amatriciana","lang":"de","src":"Spaghetti all'Amatriciana.xls","serves":4,"unit":"Personen","groups":[{"i":[{"q":400,"u":"g","n":"Spaghetti"},{"q":150,"u":"g","n":"Speck, geräuchert"},{"q":1,"n":"Zwiebel"},{"q":1,"u":"dl","n":"Weisswein"},{"q":400,"u":"g","n":"Pelati, in Würfel"},{"q":[2,3],"n":"Peperoncini"},{"q":2,"n":"Knobli-Zehen, gehackt"},{"n":"Salz, Pfeffer"},{"n":"Ital. Gewürzmischung"},{"q":1,"u":"dl","n":"Rahm"},{"n":"Parmesan"}]}],"steps":["Spaghetti in Salzwasser al dente kochen.","Speck in feine Streifen schneiden und in einer Bratpfanne anbraten.","Zwiebel in Würfel schneiden, kurz mitbraten.","Mit Weisswein ablöschen.","Pelati dazugeben, aufkochen.","Peperoncini in Streifen schneiden, mit den gehackten Knobli-Zehen unterrühren.","Mit Salz, Pfeffer und ital. Gewürzmischung würzen. Sauce 30 Min. köcheln lassen.","Rahm dazugeben.","Parmesan über die angerichteten Spaghetti streuen."]},"arrabiata":{"title":"Spaghetti Arrabiata","sub":"Archana's Kitchen — a quick, simple pasta cooked in a lip-smacking spicy tomato sauce.","src":"Spaghetti All Arrabiata.pdf","transcribed":true,"serves":2,"unit":"servings","meta":[{"k":"Prep","v":"10 min"},{"k":"Cook","v":"45 min"},{"k":"Total","v":"55 min"}],"groups":[{"i":[{"q":350,"u":"g","n":"spaghetti pasta","note":"wheat pasta"},{"q":500,"u":"g","n":"tomatoes, finely chopped"},{"q":0.25,"u":"cup","n":"basil leaves, roughly torn"},{"q":6,"u":"cloves","n":"garlic, finely chopped"},{"q":1,"n":"onion, finely chopped"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":2,"u":"tsp","n":"red chilli flakes"},{"q":0.5,"u":"tsp","n":"sugar"},{"n":"Salt and pepper, to taste"},{"n":"Parmesan cheese, for garnish"}]}],"steps":["To begin making Spaghetti Arrabiata, keep a stock pot with water. Add a teaspoon of salt and allow it to boil. Add spaghetti pasta and allow it to soften.","Cook the pasta until al dente (just cooked); once the pasta is cooked, drain and rinse under cold water and keep aside. Drizzle some oil over the spaghetti pasta, so it does not stick to each other while cooking.","In a wok or a heavy bottomed pan, heat the olive oil over medium. Add the onion and garlic and sauté until the onion is cooked through.","Once it's cooked through, add the tomatoes, the red chili flakes, salt, sugar, basil leaves. Sauté the tomatoes until it becomes soft. Add 1/4 to 1/2 cup of water and bring the tomatoes to a saucy consistency.","Bring the spicy arrabiata sauce to a brisk boil and allow the sauce to slightly thicken. Check the salt and adjust according to taste.","Once done, add the cooked spaghetti and toss the pasta for 3 to 4 minutes until the spaghetti is well coated with the pasta sauce.","Once done, turn off the heat and check the taste and spice and adjust accordingly. Transfer to a serving bowl and serve hot."]},"beef-rendang-rigatoni":{"title":"Beef Rendang Rigatoni","sub":"Slow-braised beef rendang piled over rigatoni tossed in a coconut-cream sauce built from the same aromatics — a fusion of Malaysian rendang and a creamy pasta.","src":"Beef Rendang Rigatoni.docx","serves":4,"unit":"servings","meta":[{"k":"Active","v":"~45 min"},{"k":"Total","v":"~2.5 hrs"}],"groups":[{"n":"Rendang paste","i":[{"q":6,"n":"shallots"},{"q":6,"n":"garlic cloves"},{"q":30,"u":"g","n":"fresh ginger, peeled and chopped"},{"q":20,"u":"g","n":"galangal, peeled and chopped","note":"or extra ginger"},{"q":6,"u":"large","n":"red chillies, deseeded"},{"q":3,"n":"bird's eye chillies","note":"adjust to taste"},{"q":4,"n":"candlenuts or macadamias"},{"q":1,"u":"tsp","n":"ground turmeric"},{"q":2,"u":"tsp","n":"ground coriander"},{"q":1,"u":"tsp","n":"ground cumin"},{"n":"Water, as needed to blend — expect a generous splash (roughly 2–3 tbsp) to get it moving; keep blending until silky smooth"}]},{"n":"Beef rendang","i":[{"q":800,"u":"g","n":"beef chuck or shin, cut into 3–4 cm chunks"},{"q":3,"u":"tbsp","n":"vegetable oil"},{"q":1,"n":"cinnamon stick"},{"q":2,"n":"star anise"},{"q":2,"u":"stalks","n":"lemongrass, bruised and knotted"},{"q":4,"n":"kaffir lime leaves, torn"},{"q":400,"u":"ml","n":"coconut milk"},{"q":200,"u":"ml","n":"coconut cream"},{"q":1,"u":"tbsp","n":"tamarind paste"},{"q":2,"u":"tbsp","n":"palm sugar, grated","note":"or brown sugar"},{"q":1,"u":"tsp","n":"salt"},{"q":2,"u":"tbsp","n":"toasted ground desiccated coconut (kerisik)","note":"optional"}]},{"n":"Creamy coconut pasta sauce (1.5× volume)","i":[{"q":400,"u":"g","n":"rigatoni"},{"q":45,"u":"g","n":"butter"},{"q":1.5,"n":"shallots, finely diced"},{"q":3,"u":"cloves","n":"garlic, minced"},{"q":1.5,"u":"stalks","n":"lemongrass, inner core finely minced"},{"q":3,"n":"kaffir lime leaves, finely shredded"},{"q":375,"u":"ml","n":"coconut cream"},{"q":60,"u":"g","n":"parmesan, finely grated"},{"q":1.5,"n":"limes, juiced"},{"q":0.75,"u":"tsp","n":"salt"},{"n":"Coriander leaves, roughly chopped, to serve"}]}],"steps":[{"h":"The rendang"},"Make the paste. Blend the shallots, garlic, ginger, galangal, chillies and candlenuts with the turmeric, coriander and cumin into a smooth paste. It won't move easily at first — add water in small splashes (2–3 tbsp total) until it does, then keep blending until fully silky.","Fry the paste. Heat the oil in a heavy-based pot over medium heat. Add the paste and fry, stirring often, ~10 min, until fragrant and the oil starts to separate at the edges.","Brown the beef. Add the beef, cinnamon, star anise, lemongrass and kaffir lime leaves. Stir to coat and cook ~5 min until the beef colours on the outside.","Simmer. Pour in the coconut milk and coconut cream, then stir in the tamarind, palm sugar and salt. Bring to a gentle boil, reduce to a low simmer, cover, and cook ~75 min, stirring occasionally so it doesn't catch.","Reduce until thick. Uncover and keep simmering ~30 min, stirring more often, until the beef is fork-tender and the sauce has reduced to a thick, clinging paste with the oil starting to split out. Stir through the kerisik if using. Best made a day ahead and reheated gently.",{"h":"The pasta"},"Cook the rigatoni. Boil in well-salted water until al dente (~11 min). Reserve a cup of pasta water before draining.","Start the sauce. While the pasta cooks, melt the butter in a wide pan over medium heat. Add the shallot and garlic, cook gently until soft, then stir in the lemongrass and kaffir lime leaves and cook another minute until fragrant.","Finish the sauce. Pour in the coconut cream, bring to a gentle simmer and reduce slightly (~3 min). Stir in the parmesan, season with the salt, and finish with the lime juice.","Toss. Add the drained rigatoni to the sauce and toss to coat, loosening with reserved pasta water until glossy and creamy.",{"h":"To finish"},"Plate up. Divide the pasta between bowls, pile the rendang beef chunks generously in the middle of each, spoon over a little extra rendang sauce, scatter with coriander and serve."],"notes":["Rendang is best made a day ahead — flavour deepens overnight and on the day you're just cooking pasta and building a quick sauce.","Keep the beef chunks on the larger side (3–4 cm) so they hold their shape piled on top rather than breaking apart into the pasta.","No galangal or kaffir lime leaves on hand? Extra ginger and a strip of lime zest work as a stand-in, just slightly less sharp.","If the paste needs more than a few tablespoons of water to blend smooth, that's fine — just fry it a little longer in step 2 to cook off the extra moisture before adding the beef."]},"spinat-nudeln":{"title":"Spinat-Nudeln","sub":"Tagliatelle al spinaci — Swiss family recipe.","lang":"de","src":"Spinat-Nudeln.xls","serves":4,"unit":"Pers.","groups":[{"i":[{"q":1,"u":"Essl.","n":"Oel"},{"q":1,"n":"Zwiebel, gehackt"},{"q":2,"n":"Knobli-Zehen, gehackt"},{"q":350,"u":"g","n":"Blatt-Spinat"},{"q":1,"u":"dl","n":"Rahm"},{"q":1,"u":"dl","n":"Milch"},{"q":1,"u":"Teel.","n":"Mehl"},{"q":70,"u":"g","n":"Parmesan"},{"n":"Gemüse-Bouillon Extrakt"},{"n":"Muskat"},{"n":"Salz, Pfeffer"},{"q":350,"u":"g","n":"breite Nudeln"}]}],"steps":["Oel erhitzen, Zwiebel und Knobli-Zehen andünsten.","Blatt-Spinat mitdünsten.","Rahm, Milch und Mehl vermischen, zum Spinat geben.","Parmesan dazugeben. Mit Gemüse-Bouillon Extrakt, Muskat, Salz und Pfeffer würzen.","Den Spinat ca. 15 Min. köcheln lassen; in dieser Zeit die breiten Nudeln kochen.","Nudeln abtropfen lassen und zum Spinat geben. En Guete!"]},"trofie-salsiccia":{"title":"Trofie con Ragù di Salsiccia e Parmigiano","lang":"it","sub":"Fidelity Cucina.","src":"Trofie Al Ragu di Salsiccia.pdf","transcribed":true,"serves":4,"unit":"porzioni","groups":[{"n":"Ingredienti","i":[{"q":1,"n":"cipolla"},{"q":1,"n":"carota"},{"q":1,"u":"costa","n":"sedano"},{"n":"q.b. olio extravergine di oliva"},{"q":500,"u":"g","n":"salsiccia"},{"q":1,"u":"l","n":"passata di pomodoro"},{"n":"q.b. acqua"},{"n":"Sale, a piacere"},{"n":"q.b. di pepe"},{"n":"q.b. di burro"},{"q":50,"u":"g","n":"parmigiano reggiano"},{"q":500,"u":"g","n":"trofie"},{"q":1,"u":"bicchiere","n":"vino bianco"}]}],"steps":["Per iniziare la preparazione delle trofie con ragù di salsiccia e parmigiano reggiano cominciate a tritare una cipolla, una carota e una costa di sedano che saranno la classica base del soffritto.","Togliete il budello alla salsiccia e rompetela in pezzettini con le mani. Prendete una padella ampia e versateci un filo di olio extravergine di oliva e una noce di burro. Quando saranno ben caldi buttate la salsiccia e fatela rosolare per qualche minuto. Aggiungete le verdure e fate rosolare tutto insieme. A fiamma alta versate il vino e fatelo sfumare.","Abbassate il fuoco, aggiungete la passata di pomodoro e un po' di acqua in modo che a lungo andare il sugo non risulti denso e si attacchi alla padella. Macinate un po' di pepe e fate andare a fuoco bassissimo per circa 60 minuti. Salate sempre alla fine.","Cuocete le trofie, conditele con il ragù, spolverate abbondantemente con il parmigiano reggiano e servite ancora calde."],"notes":["I consigli di Elena: «Io ne faccio sempre parecchio di questo ragù di salsiccia in modo da poterlo congelare ed averlo sempre pronto all'uso. Volendo si può aggiungere un po' di peperoncino. Io uso sempre la salsiccia al naturale, in modo che il sapore della carne venga esaltato senza essere coperto da altre spezie.»","Conservazione: le trofie con ragù di salsiccia e parmigiano reggiano si conservano per al massimo un paio di giorni in un contenitore ermetico.","Transcribed from a scanned PDF — the page break clipped part of the final cooking paragraph; the last step is reconstructed from the surviving text either side. Please check against the original."]},"lasagne":{"title":"Lasagne","lang":"de","sub":"Für 2 grosse Formen, 35 × 25 cm.","src":"Lasagne.xls","serves":2,"unit":"grosse Formen","groups":[{"n":"Bolognese-Sauce","i":[{"q":1.2,"u":"kg","n":"Gehacktes 3er-lei"},{"q":2,"u":"dl","n":"Rotwein"},{"q":2,"u":"grosse","n":"Zwiebeln, gewürfelt"},{"q":2,"n":"Knobli-Zehen"},{"q":1,"u":"kl.","n":"Rüebli, geraffelt"},{"q":0.5,"n":"Lauch, in Streifen"},{"q":1,"u":"Stück","n":"Sellerie, geraffelt"},{"q":0.5,"n":"Peperoni, gewürfelt"},{"q":3,"u":"B. à 400 g","n":"Pelati"},{"q":1,"u":"Tetra-P.","n":"Sauce all'Arrabiata"},{"q":1,"u":"Tube","n":"Tomatenpurrée"},{"n":"Rindsbouillon"},{"n":"Salz, Pfeffer"},{"n":"Ital. Gewürzmischung"},{"n":"Ev. Cayenne-Pfeffer"}]},{"n":"Béchamel-Sauce","i":[{"q":80,"u":"g","n":"Butter"},{"q":1.5,"u":"Essl.","n":"Mehl (gehäuft)"},{"q":1.2,"u":"lt.","n":"Milch"},{"q":[2,3],"n":"Knobli-Zehen, gepresst"},{"n":"Aromat, Season all"},{"n":"Pfeffer, wenig Muskat"},{"q":120,"u":"g","n":"Parmesan, gerieben"}]},{"n":"Weiteres","i":[{"q":5,"u":"x","n":"Pasta-Teig = 10 Rollen"},{"n":"Geriebener Parmesan (oder Mozzarella) für die oberste Schicht"}]}],"steps":["Bolognese-Sauce zubereiten und ca. 1 Std. köcheln lassen. Sauce in 2 Glasschüsseln verteilen, Gewicht notieren: 5 Lagen (Total ca. 1,6 kg → 5 × ca. 320 g). Die Sauce kann auch schon am Vortag gekocht werden.","Béchamel-Sauce zubereiten und ca. 10 Min. köcheln lassen. Parmesan dazugeben, vermischen. Sauce in 2 Glasschüsseln verteilen, Gewicht notieren: Total − 80 g für oberste Schicht : 5 Lagen (Total ca. 600 g − 80 g → 5 × ca. 100 g).","Gratin-Formen gut ausbuttern und mit 2 Essl. kaltem Wasser beträufeln.","5 Lagen: Lasagne-Blätter – Bolognese-Sauce – Béchamel-Sauce.","6. Lage: Lasagne-Blätter – Béchamel-Sauce 80 g – geriebener Parmesan (oder Mozzarella).","Eine Gratin-Form ca. 35 Min. bei 200 °C auf der 2. untersten Rille backen.","2. Gratin-Form mit Alu-Folie gut abdecken und einfrieren. (Gefrorene Lasagne ca. 1 Std. backen / aufgetaut 45 Min.)"]},"fennel-chorizo-lemon-pasta":{"title":"Fennel, Lemon & Chorizo Pasta","sub":"Woolworths — a one-pot pasta with fennel, lemon and chorizo.","src":"Fennel Chorizo Lemon Pasta.pdf","serves":4,"unit":"servings","groups":[{"i":[{"q":250,"u":"g","n":"chorizo, very finely chopped"},{"q":0.333,"u":"cup","n":"extra virgin olive oil"},{"q":1,"n":"lemon, zested, juiced"},{"q":700,"u":"g","n":"fennel"},{"q":0.5,"u":"cup","n":"white wine"},{"q":1,"u":"L","n":"chicken stock"},{"q":50,"u":"g","n":"parmesan, finely grated, rind reserved"},{"q":300,"u":"g","n":"spaghetti"},{"q":3,"n":"Roma tomatoes, cut into wedges"}]}],"steps":["Place chorizo and half the oil in a large saucepan over medium-high heat. Cook, stirring, for 4 minutes or until golden and crisp. Add lemon juice, stirring to combine. Transfer to a bowl and cover to keep warm.","Reserve fennel fronds and thinly slice stem. Halve fennel bulb lengthways and cut each half into 5 mm-thick wedges.","Return saucepan to heat and add remaining oil. Add fennel wedges and stem and cook, stirring regularly, for 5 minutes or until golden. Add wine and half the zest, then cook for a further 2 minutes or until wine has reduced by half. Transfer to another bowl and cover to keep warm.","Add stock and parmesan rind to pan, then cover and bring to the boil. Add pasta to pan, breaking to fit if necessary. Add 2 cups water. Gently submerge pasta and bring mixture to the boil, stirring gently to prevent pasta from sticking. Continue to boil for 12 minutes or until pasta is tender. Add three-quarters of the parmesan and tomato. Cover and stand for 5 minutes to thicken sauce. Season, stirring well to combine.","Divide pasta mixture among bowls. Top with fennel mixture and scatter over chorizo, remaining zest and parmesan, and reserved fennel fronds. Serve."],"notes":["Vegetable and meat scraps are perfect to use for making stock."]},"prawn-linguine":{"title":"Ultimate Creamy Prawn Linguine","sub":"Like a crab linguine, but creamier, silkier, and more indulgent.","src":"Prawn Linguine.docx","serves":3,"unit":"portions","groups":[{"n":"Prawns","i":[{"q":500,"u":"g","n":"raw prawns, peeled and deveined"},{"q":1,"u":"tbsp","n":"olive oil"},{"q":1,"u":"tbsp","n":"butter"},{"n":"Salt & white pepper"}]},{"n":"Sauce base","i":[{"q":2,"u":"tbsp","n":"butter"},{"q":1,"u":"tbsp","n":"olive oil"},{"q":4,"u":"cloves","n":"garlic, finely minced"},{"q":0.5,"u":"small","n":"shallot, finely minced","note":"or ¼ small onion"},{"q":[6,8],"n":"cherry tomatoes, halved"},{"q":50,"u":"ml","n":"dry white wine","note":"or fish/chicken stock + ½ tsp lemon juice"},{"q":1,"u":"tsp","n":"tomato paste","note":"optional but deepens colour and sweetness"}]},{"n":"Creamy finish","i":[{"q":250,"u":"ml","n":"thickened cream (heavy cream)"},{"q":50,"u":"g","n":"mascarpone cheese","note":"key to the silky texture"},{"q":40,"u":"g","n":"Parmigiano-Reggiano, finely grated"},{"q":0.5,"n":"lemon, zested, + 1 tsp juice"},{"n":"Pinch of chilli flakes (optional but recommended)"},{"n":"Salt and black pepper to taste"}]},{"n":"To serve","i":[{"q":250,"u":"g","n":"linguine"},{"q":0.5,"u":"cup","n":"reserved pasta water"},{"n":"Chopped parsley or chives"},{"n":"Extra Parmigiano for garnish"},{"n":"Optional: drizzle of olive oil or truffle oil"}]}],"steps":["Prepare the prawns. Roughly chop prawns into small pieces (~0.5 cm). Heat olive oil and butter in a large pan over medium-high heat. Add prawns, season lightly, and cook 1–2 minutes until just opaque. Remove immediately to a bowl — they'll finish later.","Build the sauce base. In the same pan, add 2 tbsp butter + 1 tbsp olive oil over medium heat. Add shallot and cook 1–2 minutes until translucent. Add garlic and cook 30 seconds until fragrant (don't brown it). Add halved cherry tomatoes, sprinkle with a pinch of salt, and cook 1–2 minutes until they blister and release a bit of juice. Stir in tomato paste and cook another 30–60 seconds to caramelize slightly.","Deglaze and concentrate. Pour in white wine and let it bubble for 1–2 minutes, scraping up all the flavour from the pan. The sauce should reduce by half and smell sweet and aromatic.","Make it creamy. Lower the heat to medium-low. Add the cream and mascarpone, whisking until smooth. Simmer 2–3 minutes until slightly thickened and glossy. Stir in Parmigiano until melted and emulsified. Add lemon zest, juice, and chilli flakes. Taste — it should be creamy, savoury, and just bright enough to cut the richness.","Add prawns back. Fold in the cooked prawn meat and any juices. Simmer gently for 30–60 seconds — just to warm through.","Finish with the pasta. Add the al dente linguine directly to the sauce with a few tablespoons of pasta water. Toss over medium heat until the sauce clings beautifully to the pasta (add more water as needed to loosen — it should be glossy, not heavy).","Serve. Plate it up immediately. Top with chopped parsley or chives, a dusting of Parmigiano, cracked pepper, and optionally a drizzle of olive or truffle oil."],"notes":["Mascarpone is what makes this silky, not just creamy. Don't skip it.","Cherry tomatoes should stay soft and sweet — don't crush or stew them.","Use your nose: the sauce should smell buttery, garlicky, faintly lemony, and briny before you even taste it.","Pasta water = magic: that starchy saltwater binds everything into that professional \"creamy cling\"."]},"mushroom-risotto":{"title":"Classic Mushroom Risotto","src":"Mushroom Risotto.docx","serves":4,"unit":"servings","groups":[{"i":[{"q":320,"u":"g","n":"Arborio (or Carnaroli) rice"},{"q":[300,400],"u":"g","n":"mixed mushrooms"},{"q":1,"u":"small","n":"onion, finely diced"},{"q":2,"u":"cloves","n":"garlic, minced"},{"q":1.2,"u":"L","n":"hot chicken or vegetable stock"},{"q":150,"u":"mL","n":"dry white wine","note":"optional"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":[50,70],"u":"g","n":"freshly grated Parmigiano Reggiano"},{"q":1,"u":"tbsp","n":"chopped parsley"},{"n":"Salt and black pepper"},{"n":"Optional: thyme or truffle oil"}]}],"steps":["Keep the stock just below a simmer.","Brown the mushrooms in 1 tbsp olive oil over high heat. Season lightly and set aside.","Cook onion in remaining oil for 5–7 minutes. Add garlic for 30 seconds.","Add the rice and toast for 2 minutes.","Pour in the wine and cook until almost absorbed.","Add hot stock one ladle at a time, stirring regularly and allowing each addition to absorb before the next. Continue for 18–20 minutes.","Fold in the mushrooms. Remove from heat and stir in the Parmesan. Rest for 2 minutes.","Adjust with a splash of stock if needed. Finish with parsley, black pepper and extra Parmesan."],"notes":["Do not rinse the rice.","Keep the stock hot.","Serve immediately for the best texture.","Add rehydrated dried porcini for a richer flavour."]},"pizza-thin":{"title":"Pizza (thin base)","sub":"Two big rectangular trays. Hydration 66%.","src":"Rezepte.xlsx — Pizza (thin)","serves":2,"unit":"big rectangular trays","groups":[{"n":"Dough","i":[{"q":416,"u":"g","n":"high-gluten bread flour"},{"q":2.75,"u":"dl","n":"water (lukewarm)"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"pack","n":"dry yeast"},{"q":1,"u":"tsp","n":"salt"},{"q":2,"u":"tsp","n":"oregano"}]},{"n":"Sauce & cheese","i":[{"q":140,"u":"g","n":"pizza sauce","note":"use a good one, e.g. DIY pizza sauce from Coles"},{"q":3,"u":"cups","n":"grated cheese","note":"c. 1.5 cups per pizza"}]},{"n":"Gluten-free variant (alternative dough)","i":[{"q":180,"u":"g","n":"corn flour"},{"q":140,"u":"g","n":"rice flour"},{"q":100,"u":"g","n":"corn meal"},{"q":1,"u":"tsp","n":"xanthan gum"},{"q":1,"u":"tbsp","n":"dry yeast"},{"q":1,"u":"tbsp","n":"oregano"},{"q":1,"u":"tsp","n":"salt"},{"q":1,"u":"tbsp","n":"chili flakes"},{"q":270,"u":"ml","n":"water","note":"approx."}]}],"steps":["Preheat the oven to the maximum temperature it can do. Place a baking sheet upside down in the bottom half or middle of the oven so it gets preheated as well.","Add all ingredients together in a large bowl. Stretch and fold until the dough shows some elasticity.","Divide the dough into 2 portions each c. 345 g. Place each on a flour-dusted parchment paper the size of a big rectangular baking sheet (c. 30 × 40 cm). Grease another 2 sheets of parchment paper of that size and place on top. Press a little to form a circle / oval, then let it rest for 10 mins for the gluten to develop.","For the first dough: 1. Roll the dough between the parchment papers until it is c. 0.3 cm thin. 2. Remove the top parchment paper. 3. Use a brush to add c. 70 g of tomato sauce on top. 4. Add c. 1.5 cups of grated cheese. This needs to be added before the other toppings, not after. 5. Add other toppings — thinly sliced and sparingly. 6. Add salt and pepper to taste.","Put the first pizza in the oven — on top of the inverted baking sheet, with the parchment paper. Leave it in the oven until it looks ready, likely 10 mins or a bit less (at 250 °C). Then take out — best to transfer it on a large cutting board with the paper.","While the first pizza is in the oven, do steps 1–6 to the second dough so it's ready to go in the oven once the first one is done."],"notes":["Don't add more than like 3 toppings, otherwise it'll feel like overkill.","Diavola: 100 g hot salami (best are large but thin slices), 2–3 red chilis, very thinly sliced onion.","Prosciutto e funghi con cipolla: c. 100 g thinly sliced ham off the bone, c. 100 g mushrooms thinly sliced, very thinly sliced onion.","Quattro Stagioni: put on ¼ of the pizza each — thinly sliced ham off the bone; artichokes, thinly sliced; mushrooms, thinly sliced; capsicum, thinly sliced."]},"pizza-thick":{"title":"Pizza (thick base)","sub":"The original tray version — quantities for a big rectangular tray and for a small round tray.","src":"Rezepte.xlsx — Pizza (thick)","serves":1,"unit":"big rectangular tray","groups":[{"n":"Dough — big rectangular tray","i":[{"q":375,"u":"g","n":"flour","note":"3 cups"},{"q":2.7,"u":"dl","n":"water (lukewarm)","note":"1.15 cups"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":1,"u":"pack","n":"dry yeast"},{"q":1,"u":"tsp","n":"salt"},{"q":2,"u":"tsp","n":"oregano"}]},{"n":"Toppings (amount to taste)","i":[{"n":"Pizza-tomato sauce (usually contains more salt / spices / herbs than pasta sauce — i.e. Leggo's pizza sauce, sold in packages big enough for a small tray)"},{"n":"Ham, salami or bacon"},{"n":"Garlic and onion"},{"n":"Olives, artichokes, mushrooms, capsicum"},{"n":"(Frozen) grated mozzarella cheese"},{"n":"Salt and pepper"}]}],"steps":["Add all ingredients together in a large bowl. Knead all the ingredients into a dough. Cover and let it rest for ideally 2 h.","Brush a tray with olive oil or butter. Put dough on tray and pull it by hand, or push it with palms, to make it cover the whole tray.","Then cover it with a thin layer of pizza-tomato sauce, and add the toppings on top, amount to taste.","Add a thin or thick layer (to taste) of (frozen) grated mozzarella cheese. Season with salt and pepper.","Bake in pre-heated oven at 220 °C for 12–15 min. Open oven door 2–3× to let the steam escape."],"notes":["Small round tray: halve everything — 1.5 cups / 180 g flour, 0.6 cups / 1.4 dl water, 1 tbsp olive oil, ½ pack dry yeast, ½ tsp salt, 1 tsp oregano."]},"tarte-flambee":{"title":"Tarte Flambée (Alsace)","sub":"With streaky bacon and onions.","src":"Rezepte.xlsx — Tarte Flambée","serves":1,"unit":"big rectangular tray","groups":[{"n":"Dough — big rectangular tray","i":[{"q":200,"u":"g","n":"flour","note":"1.5 cups"},{"q":1.2,"u":"dl","n":"water (lukewarm)","note":"0.5 cups"},{"q":2,"u":"tbsp","n":"olive oil"},{"q":0.5,"u":"tsp","n":"salt"}]},{"n":"Topping","i":[{"n":"Sour cream"},{"n":"Streaky bacon, cut"},{"n":"Onions, cut in rings"},{"n":"Salt and pepper"}]}],"steps":["Add all ingredients together in a large bowl. Knead all the ingredients into a dough. Cover and let it rest for 30 mins at least.","Roll out the dough on a piece of baking paper using a rolling pin, until it covers a surface similar to the tray size.","Thinly cover the dough with sour cream. Add streaky bacon, cut, and onions, cut in rings, on top. Season with salt and pepper.","Bake in pre-heated oven for 10 mins at 220 °C."],"notes":["Use a wood smoked / dry cured bacon such as Skara Artisan Small Goods @ Harris Farmer's Market.","Small round tray: 0.75 cups / 100 g flour, 0.25 cups / 0.6 dl water, 1 tbsp olive oil, 0.25 tsp salt."]},"flammkuchen-paris":{"title":"Flammkuchen Paris","lang":"de","sub":"Tarte flambée mit Champignons und Oregano.","src":"Flammkuchen Paris.JPG","transcribed":true,"serves":2,"unit":"Personen","meta":[{"k":"Vor- und zubereiten","v":"ca. 20 Min."},{"k":"Backen","v":"ca. 10 Min."}],"groups":[{"n":"Teig","i":[{"q":1,"u":"Portion","n":"Brotteig","note":"S. 81 — schneller: statt Brotteig 1 ausgewallten Pizzateig (ca. 30 cm Ø), oval, ca. 3 mm dick ausgewallt, verwenden"}]},{"n":"Belag","i":[{"q":100,"u":"g","n":"Crème fraîche"},{"q":1,"u":"Esslöffel","n":"Oregano, fein gehackt"},{"q":1,"n":"unbehandelte Zitrone, nur wenig abgeriebene Schale"},{"q":2,"u":"Prisen","n":"Salz"},{"q":100,"u":"g","n":"braune Champignons, in ca. 5 mm dicken Scheiben"},{"q":2,"u":"Prisen","n":"Salz, wenig Pfeffer"}]}],"steps":["Brotteig auf wenig Mehl oval, ca. 3 mm dick auswallen, in ein mit Backpapier belegtes Blech legen.","Crème fraîche, Oregano, Zitronenschale und Salz alles verrühren, auf dem Teig verteilen, dabei ringsum einen Rand von ca. 1 cm frei lassen.","Champignons darauf verteilen.","Mit Salz und wenig Pfeffer würzen.","Backen: ca. 10 Min. in der Mitte des auf 240 Grad vorgeheizten Ofens."],"notes":["Pro Person: 19 g Fett, 14 g Eiweiss, 72 g Kohlenhydrate, 2169 kJ (518 kcal).","Transkribiert aus einem Foto einer Kochbuchseite — bitte gegen das Original prüfen."]},"grilled-snapper":{"title":"Grilled Snapper with Herb Sauce","sub":"On the Weber Q.","src":"Grilled snapper with herb sauce.docx","serves":2,"unit":"servings","scaleNote":"The fish quantities are open — scale the herb sauce.","groups":[{"n":"Fish","i":[{"n":"Snapper fillets (skin-on preferred for grilling)"},{"n":"Olive oil"},{"n":"Salt and pepper"},{"n":"Lemon wedges, for serving"},{"n":"Optional: fresh herbs like dill or parsley"}]},{"n":"Herb sauce","i":[{"q":0.25,"u":"cup","n":"olive oil"},{"q":2,"u":"tbsp","n":"lemon juice","note":"freshly squeezed"},{"q":1,"u":"small clove","n":"garlic, minced"},{"q":2,"u":"tbsp","n":"fresh parsley, chopped"},{"q":1,"u":"tbsp","n":"fresh dill, chopped"},{"q":1,"u":"tsp","n":"fresh chives, chopped"},{"q":0.5,"u":"tsp","n":"Dijon mustard","note":"optional, for tanginess"},{"n":"Salt and pepper to taste"}]}],"steps":["Prepare the grill. Preheat your Weber Q BBQ to medium-high heat (around 400 °F or 200 °C). Clean the grill grates thoroughly to prevent the fish from sticking, and oil them lightly with a paper towel dipped in oil.","Prep the fish. Pat the snapper fillets dry with paper towels. Brush both sides of the fillets with olive oil. Season generously with salt and pepper.","Grill the snapper. Place the fillets skin-side down on the preheated grill. Close the lid and cook for 3–5 minutes (depending on the thickness of the fillet) until the skin is crisp and the flesh starts to turn opaque. Flip the fillets gently using a wide spatula and cook the other side for an additional 2–4 minutes.","Check for doneness. The fish is done when it flakes easily with a fork and reaches an internal temperature of 145 °F (63 °C).","Serve. Transfer the fillets to a plate and let them rest for a minute. Squeeze fresh lemon juice over the top and garnish with herbs if desired.",{"h":"Herb sauce"},"In a small bowl, whisk together olive oil, lemon juice, and Dijon mustard (if using).","Stir in the minced garlic and chopped herbs (parsley, dill, and chives).","Season with salt and pepper to taste.","Let the sauce sit for 5–10 minutes to allow the flavors to meld. Drizzle over grilled, baked, or pan-seared fish before serving."],"notes":["Use a fish basket if you're worried about the fillets sticking or breaking.","Don't overcook: snapper cooks quickly, so keep an eye on it. Overcooking will make it dry.","The sauce works well with salmon, cod, trout, or any mild white fish. Just use more parsley if not using dill or chives."]},"ahi-poke-bowl":{"title":"Classic Maui-Style Ahi Poke Bowl","sub":"Simple, fish-forward Hawaiian poke — clean flavours, minimal ingredients, and proper technique. This version skips seaweed, uses white onion, and finishes with toasted macadamia nuts and toasted sesame seeds.","src":"Maui-style Ahi Poke Bowl.docx","serves":3,"unit":"generous servings","groups":[{"n":"Poke","i":[{"q":600,"u":"g","n":"sashimi-grade ahi tuna (yellowfin or bigeye), cut into 2 cm cubes"},{"q":2.5,"u":"Tbsp","n":"shoyu (soy sauce)"},{"q":1,"u":"tsp","n":"toasted sesame oil","note":"light hand"},{"q":0.5,"u":"small","n":"white onion, very thinly sliced"},{"q":2,"n":"spring onions, finely sliced"},{"q":[0.5,1],"u":"tsp","n":"toasted sesame seeds"},{"q":[2,3],"u":"Tbsp","n":"toasted macadamia nuts, coarsely crushed"}]},{"n":"To serve","i":[{"n":"Steamed short-grain white rice (warm)"}]}],"steps":["Prepare the tuna. Keep tuna cold until just before cutting. Cut into clean, even 2 cm cubes using a sharp knife. Place in a chilled bowl.","Marinate the poke. Add shoyu, toasted sesame oil, and sliced white onion to the tuna. Gently toss to coat evenly. Cover and refrigerate for 15–30 minutes to lightly season the fish. This is a light marinade, not a cure — the tuna should remain silky, not firm.","Finish the poke. Add sliced spring onions. Toss gently. Taste and adjust very lightly with a few drops of shoyu if needed.","Finish and serve. Spoon warm rice into bowls. Top with poke. Sprinkle with toasted sesame seeds and toasted macadamia nuts. Serve immediately.",{"h":"How to toast sesame seeds"},"Heat a dry pan over medium-low heat. Add sesame seeds in a single layer. Shake or stir constantly. Remove from heat once lightly golden and nutty-smelling. Cool completely before using. They burn fast — stop early rather than late.",{"h":"How to prepare toasted macadamia nuts (inamona substitute)"},"Use raw or dry-roasted unsalted macadamia nuts. Toast in a dry pan over medium-low heat for 3–5 minutes, stirring often, until fragrant and lightly golden. Cool slightly. Crush coarsely using a mortar & pestle, knife, or rolling pin. Aim for a mix of small chunks and coarse grit. Season with a tiny pinch of sea salt. Add only at the very end to preserve aroma and texture."],"notes":["Recommended vegetable sides (served on the side, not mixed in): Sunomono-style cucumber salad — thinly sliced cucumber (seeds removed), rice vinegar, sugar, salt. Julienned carrot & daikon namasu — julienned carrot, julienned daikon, rice vinegar, sugar, salt.","Season only what you plan to eat immediately.","If storing leftover tuna, keep it unseasoned and season fresh before serving.","Poke should taste clean, not salty or oily — restraint is key."]},"chargrilled-octopus":{"title":"Char-Grilled Octopus Salad","sub":"From whole raw octopus — poach, then char.","src":"Chargrilled Octopus Salad.docx","serves":4,"unit":"as a starter","servesNote":"4 as a starter, 2–3 as a main","meta":[{"k":"Active","v":"30 min"},{"k":"Poach","v":"45–60 min"},{"k":"Rest/marinate","v":"30 min"}],"groups":[{"n":"Octopus & poaching","i":[{"q":800,"u":"g","n":"whole raw octopus","note":"tentacle cluster, pre-cleaned, thawed"},{"q":2,"n":"bay leaves"},{"q":1,"u":"clove","n":"garlic, smashed","note":"for the poaching liquid"},{"q":1,"n":"cork","note":"optional, old wives' tale — doesn't hurt"}]},{"n":"Marinade & dressing","i":[{"q":8,"u":"tbsp","n":"olive oil, divided"},{"q":4,"u":"cloves","n":"garlic, minced","note":"for the marinade"},{"q":2,"u":"tsp","n":"smoked paprika"},{"q":2,"n":"lemons, zested and juiced"},{"q":1,"u":"tsp","n":"sea salt"},{"q":0.5,"u":"tsp","n":"black pepper"}]},{"n":"Salad base","i":[{"q":160,"u":"g","n":"rocket (arugula)"},{"q":2,"u":"tbsp","n":"capers, drained"},{"q":20,"n":"pitted kalamata olives, halved"},{"q":300,"u":"g","n":"cherry tomatoes, halved"},{"q":0.5,"n":"red onion, thinly sliced"},{"q":4,"u":"tbsp","n":"flat-leaf parsley, roughly chopped"}]}],"steps":[{"h":"1. Prep the octopus"},"Make sure the octopus is fully thawed (24 hours in the fridge if starting frozen).","Check whether the beak has already been removed. If not: flip the tentacle cluster so the underside faces you, locate the hard beak at the centre where the arms meet, and push it out with your finger or a knife tip. Discard.","Rinse the octopus under cold water and pat dry.",{"h":"2. Poach until tender"},"Bring a large pot of water to a gentle simmer (not a rolling boil). Add the bay leaves and smashed garlic clove.","Holding the octopus by the head end (or with tongs), dip the tentacles into the simmering water 3 times, about 5 seconds each, before fully submerging. This helps the tentacles curl rather than seize flat — optional but worth doing.","Submerge fully and simmer gently, uncovered, for 45–60 minutes, until a knife slides into the thickest part of a tentacle with no resistance. Keep the heat low — a hard boil will toughen it.","Turn off the heat and let the octopus cool in its poaching liquid for 15–20 minutes. This resting step matters as much as the simmer for tenderness.","Lift out and pat very dry with paper towel. It can be poached up to 2 days ahead and kept in the fridge.",{"h":"3. Marinate"},"Cut the tentacles apart if you'd like individual portions, or leave the cluster whole and portion after searing.","In a bowl, toss the octopus with 4 tbsp olive oil, the minced garlic, smoked paprika, half the lemon juice, salt and pepper. Marinate at room temperature for 20–30 minutes while you prep the salad.",{"h":"4. Prep the salad base"},"In a large bowl, combine the rocket, capers, olives, cherry tomatoes, red onion and parsley. Set aside.",{"h":"5. Char the octopus on the BBQ"},"Heat the BBQ grill plate or grates to
